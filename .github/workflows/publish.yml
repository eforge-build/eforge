name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # npm 11 includes trusted-publishing OIDC token exchange support. pnpm
      # delegates publishing to npm, so make sure the delegated npm is new enough.
      - run: npm install -g npm@11
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # publish-all.mjs is the single source of truth for a release:
      # it propagates the lockstep version, runs build/type-check/test,
      # then `pnpm -r publish`. Do not duplicate those steps here.
      # setup-node's registry-url mode injects a placeholder NODE_AUTH_TOKEN and
      # .npmrc auth config, which prevents npm trusted publishing from using OIDC.
      # Keep the publish environment token-free so pnpm can exchange the GitHub
      # id-token granted above.
      - run: env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG pnpm publish-all
