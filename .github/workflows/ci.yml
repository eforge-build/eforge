name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm type-check

      # PRs are normally validated by eForge locally before the branch is pushed.
      # Keep the GitHub PR gate fast, but allow an explicit full run by adding the
      # `full-ci` label. Full tests still run on main, nightly, and manual runs.
      - if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: pnpm test

      # pnpm build already builds @eforge-build/docs-gen and the web docs site.
      # Run the generated docs drift/link check directly to avoid rebuilding the
      # docs-gen dependency closure, and leave production docs builds to Vercel.
      - run: node packages/docs-gen/dist/cli.js check
