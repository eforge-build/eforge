maxConcurrentBuilds: 2
agents:
  tiers:
    planning:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
    implementation:
      harness: claude-sdk
      model: claude-sonnet-4-6
      effort: medium
    review:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
    evaluation:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
build:
  postMergeCommands:
    - pnpm install
    - pnpm build
    - pnpm type-check
    - pnpm test
# --- eforge:region plan-01-stack-contracts-config-state-events ---
stacking:
  # Stacking is disabled for this repo's own builds. git-spice must be installed
  # and initialized (git-spice repo init) for stacking to work. Since stacking is an
  # opt-in feature for projects that explicitly need it, and the eforge repo
  # itself uses direct PRs without a stack topology, we leave it disabled here.
  # Set to true only if you want git-spice stacked PRs for eforge's own builds.
  enabled: false
  provider: git-spice
landing:
  action: pr
# --- eforge:endregion plan-01-stack-contracts-config-state-events ---
