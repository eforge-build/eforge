maxConcurrentBuilds: 2
agents:
  tiers:
    planning:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
    implementation:
      harness: claude-sdk
      model: claude-sonnet-4-6
      effort: medium
    review:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
    evaluation:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
build:
  postMergeCommands:
    - pnpm install
    - pnpm build
    - pnpm type-check
    - pnpm test
# --- eforge:region plan-01-stack-contracts-config-state-events ---
stacking:
  # git-spice has been initialized for this repo; enable stacked PRs for eforge builds.
  enabled: true
  provider: git-spice
landing:
  action: pr
# --- eforge:endregion plan-01-stack-contracts-config-state-events ---
