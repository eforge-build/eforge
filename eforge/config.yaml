build:
  postMergeCommands:
    - pnpm install
    - pnpm build
    - pnpm type-check
    - pnpm test
stacking:
  enabled: true
  provider: git-spice
landing:
  action: pr
  pr:
    autoMerge: always
tools:
  toolbelts:
    browser-ui:
      description: Playwright MCP server for browser automation and UI testing
      mcpServers:
        - playwright
