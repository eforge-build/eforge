maxConcurrentBuilds: 2
monitor:
  retentionCount: 100
agents:
  tiers:
    planning:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
    implementation:
      harness: claude-sdk
      model: claude-sonnet-4-6
      effort: medium
    review:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
    evaluation:
      harness: claude-sdk
      model: claude-opus-4-7
      effort: high
build:
  postMergeCommands:
    - pnpm install
    - pnpm build
    - pnpm type-check
    - pnpm test
stacking:
  enabled: true
  provider: git-spice
landing:
  action: pr
tools:
  toolbelts:
    browser-ui:
      description: Playwright MCP server for browser automation and UI testing
      mcpServers:
        - playwright
