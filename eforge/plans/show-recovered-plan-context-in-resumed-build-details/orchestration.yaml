name: show-recovered-plan-context-in-resumed-build-details
description: Show recovered PRD/source context and compiled plan artifacts on
  resumed build details without replaying historical planning or agent activity.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm --filter @eforge-build/console-ui test
  - pnpm test -- --run packages/client/src/__tests__/events-schemas.test.ts
    packages/client/src/__tests__/events-wire-parity.test.ts
    packages/monitor/src/__tests__/resume-plans-route.test.ts
    test/recovery-terminal-failure.test.ts
    test/resume-compiled-build-engine.test.ts
  - pnpm maintainability:check
  - pnpm docs:generate
  - pnpm docs:check
plans:
  - id: plan-01-recovery-run-selection
    name: Prefer Failed Build Runs for Recovery Summaries
    depends_on: []
    branch: show-recovered-plan-context-in-resumed-build-details/plan-01-recovery-run-selection
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
  - id: plan-02-resume-artifacts-projection
    name: Emit and Render Recovered Resume Artifacts
    depends_on:
      - plan-01-recovery-run-selection
    branch: show-recovered-plan-context-in-resumed-build-details/plan-02-resume-artifacts-projection
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Cross-package event contract, engine emission, daemon projection,
          console rendering, and generated docs must land together so the new
          event type stays consumable.
      reviewer:
        effort: high
        rationale: The plan changes a persisted wire event contract and multiple
          consumers; review must check API shape and projection semantics.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - test-write
      - doc-sync
    - validate
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a focused cross-package bugfix with a clear dependency chain
    across client event contracts, engine resume emission, monitor projection,
    and console-ui rendering, so excursion fits better than expedition. Plan
    review is included to catch contract and dependency issues before build. The
    build pipeline implements the fix, writes/updates tests, syncs
    generated/reference documentation, runs the registered maintainability
    validation gate, executes test cycles, then runs iterative review. API and
    test review perspectives target the main risks: additive persisted event
    shape, shared route projections, and regression coverage."
