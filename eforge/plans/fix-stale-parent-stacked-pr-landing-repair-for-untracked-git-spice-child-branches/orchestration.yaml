name: fix-stale-parent-stacked-pr-landing-repair-for-untracked-git-spice-child-branches
description: Fix stale-parent stacked PR landing repair for untracked git-spice
  child branches by deferring retarget side effects until after tracking and
  covering the repaired ordering with regression tests.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test -- stack-runtime-landing-metadata-preflight
    stack-runtime-landing-failures stack-base-resolver git-spice-provider
  - pnpm docs:check
plans:
  - id: plan-01-stale-parent-landing-repair
    name: Stale Parent Stack Landing Repair
    depends_on: []
    branch: fix-stale-parent-stacked-pr-landing-repair-for-untracked-git-spice-child-branches/plan-01-stale-parent-landing-repair
    build:
      - test-write
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Changes provider command ordering in a high-impact PR publication
          path while preserving fail-closed repair semantics.
      test-writer:
        effort: high
        rationale: Regression tests must model git-spice's tracked-branch precondition
          and prove non-main trunk handling.
      reviewer:
        effort: high
        rationale: Review must verify landing preflight side effects only occur after
          the child branch is tracked.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - test-write
      - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a cohesive high-impact bugfix in one subsystem, so excursion
    fits better than expedition. A plan review is included because landing
    orchestration and fail-closed recovery need careful sequencing. Build
    includes implementation, targeted regression test authoring, documentation
    sync for any stale stacking wording, strict code/test review, and a final
    test cycle to verify the repaired git-spice ordering and non-main trunk
    behavior.
