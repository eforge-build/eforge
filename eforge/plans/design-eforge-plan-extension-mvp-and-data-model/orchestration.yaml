name: design-eforge-plan-extension-mvp-and-data-model
description: "Implement the eforge-plan project-team native extension MVP and
  data model: .backlog Markdown storage, kanban projection, trace sidecars,
  promotion/input-source handoff, conservative lifecycle linkage, contribution
  surfaces, colocated tests, and README documentation."
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- eforge/extensions/eforge-plan/__tests__/*.test.ts
  - pnpm maintainability:check
plans:
  - id: plan-01-eforge-plan-foundation
    name: "Eforge Plan Foundation: Storage, Domain, Kanban, and Trace"
    depends_on: []
    branch: design-eforge-plan-extension-mvp-and-data-model/plan-01-eforge-plan-foundation
    build:
      - implement
      - test-cycle
      - validate
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan creates the extension's data-model helpers,
          Markdown/frontmatter storage, path-safety checks, and kanban
          projection; the work is localized but has several invariants around
          file safety and human-authored content preservation.
      reviewer:
        effort: high
        rationale: Review must inspect path containment, source-of-truth boundaries, and
          frontmatter/body preservation for local filesystem writes.
  - id: plan-02-eforge-plan-registration
    name: Eforge Plan Promotion, Lifecycle, Registration, and Docs
    depends_on:
      - plan-01-eforge-plan-foundation
    branch: design-eforge-plan-extension-mvp-and-data-model/plan-02-eforge-plan-registration
    build:
      - - implement
        - doc-author
      - test-cycle
      - doc-sync
      - validate
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan connects the foundation helpers to extension action
          handlers, direct input-source handoff, lifecycle trace updates, and
          contribution metadata while preserving conservative status mutation
          rules.
      reviewer:
        effort: high
        rationale: Review must inspect registration shapes, side-effect metadata,
          lifecycle correlation, and user-facing documentation for trust and
          boundary claims.
      doc-author:
        effort: medium
        rationale: The README is a required deliverable with explicit capability, trust,
          storage, and deferred-platform sections.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - test-cycle
    - doc-sync
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a cohesive multi-file reference extension with storage,
    domain, promotion, lifecycle, registrations, tests, and docs, but a single
    planner can enumerate the work, so excursion is appropriate rather than
    expedition. Plan review is included because the PRD has many boundary and
    acceptance constraints. Documentation and tests are first-class
    deliverables, so doc-author, test-write, test-cycle, and doc-sync are
    included. The separate test stage is omitted because it conflicts with
    test-cycle. The loaded maintainability validation provider requires validate
    after implementation work and before review. Review focuses on code quality
    and extension/API contract correctness with strict evaluation because the
    extension mutates local backlog data and must preserve kernel boundaries.
