name: handle-stale-stacked-pr-parent-branches-during-git-spice-landing
description: Implement resilient git-spice stacked PR landing when a child PR's
  recorded parent branch has been merged and deleted from the remote, including
  trunk-collapse base resolution, branch-scoped landing repair, optional
  observability metadata, recovery guidance, and docs.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-stack-base-and-provider-foundation
    name: Stack Base Normalization and Provider Retarget Foundation
    depends_on: []
    branch: handle-stale-stacked-pr-parent-branches-during-git-spice-landing/plan-01-stack-base-and-provider-foundation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Introduces shared git ancestry/remote helpers, changes stack base
          semantics, and extends the provider interface used by multiple tests.
      reviewer:
        effort: high
        rationale: Provider boundary and git-ref safety need close review because branch
          names flow into subprocess argv.
  - id: plan-02-landing-preflight-and-observability
    name: Landing Preflight Repair and Observability Metadata
    depends_on:
      - plan-01-stack-base-and-provider-foundation
    branch: handle-stale-stacked-pr-parent-branches-during-git-spice-landing/plan-02-landing-preflight-and-observability
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Coordinates landing workflow ordering, optional wire metadata, PR
          metadata base selection, and state projection across large existing
          files.
      reviewer:
        effort: high
        rationale: Landing failure paths, event compatibility, and subprocess/ref
          handling need careful review.
  - id: plan-03-recovery-and-docs
    name: Recovery Guidance and Stacking Documentation
    depends_on:
      - plan-02-landing-preflight-and-observability
    branch: handle-stale-stacked-pr-parent-branches-during-git-spice-landing/plan-03-recovery-and-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Focused recovery text and docs work depending on the new landing
          metadata from prior plans.
      reviewer:
        effort: medium
        rationale: Review should verify the recovery guidance is scoped to git-spice
          missing-base failures and docs match implemented behavior.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - test-write
      - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: Excursion fits because the work is cohesive but cross-cutting across
    stack base resolution, landing, provider adapters, event/state metadata,
    recovery messaging, tests, and docs; a single planner can decompose it
    without expedition module planning. A plan review gate is included due the
    git/topology safety requirements. Build runs implementation alongside
    planned docs, then writes tests and syncs docs, runs the registered
    maintainability validation gate before review, uses iterative review for
    correctness/API compatibility, and finishes with test-cycle to exercise the
    many required regression paths.
