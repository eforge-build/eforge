name: close-follow-up-gaps-in-git-spice-stacked-pr-support
description: Close follow-up gaps in git-spice stacked PR support by removing
  legacy onSuccess vocabulary, adding a provider-neutral artifact registry,
  making dependency readiness artifact-based, fixing stack landing
  lifecycle/cleanup, and refreshing docs/skills/generated references.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-landing-vocabulary-clean-break
    name: Landing Vocabulary Clean Break
    depends_on: []
    branch: close-follow-up-gaps-in-git-spice-stacked-pr-support/plan-01-landing-vocabulary-clean-break
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: xhigh
        rationale: Breaking rename spans engine types, daemon/client API, CLI, Pi
          integration, and tests; sharding keeps mechanical updates within turn
          budget while one plan preserves type-change atomicity.
        shards:
          - id: engine-client-daemon
            roots:
              - packages/engine/src/
              - packages/client/src/
              - packages/monitor/src/
          - id: cli
            roots:
              - packages/eforge/src/cli/
          - id: pi-extension
            roots:
              - packages/pi-eforge/extensions/eforge/
          - id: tests
            roots:
              - test/
  - id: plan-02-artifact-registry-dependencies
    name: Provider-Neutral Artifact Registry and Dependency Readiness
    depends_on:
      - plan-01-landing-vocabulary-clean-break
    branch: close-follow-up-gaps-in-git-spice-stacked-pr-support/plan-02-artifact-registry-dependencies
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds a new engine-owned runtime state file and changes queue
          dependency semantics across scheduler, queue validation, and stack
          base resolution.
  - id: plan-03-stack-landing-lifecycle-cleanup
    name: Stack Landing Lifecycle Status and Cleanup
    depends_on:
      - plan-02-artifact-registry-dependencies
    branch: close-follow-up-gaps-in-git-spice-stacked-pr-support/plan-03-stack-landing-lifecycle-cleanup
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Coordinates stack runtime persistence, landing phase ordering,
          cleanup extraction, provider failure handling, and monitor
          projections.
  - id: plan-04-docs-skills-generated-references
    name: Docs, Skills, and Generated References
    depends_on:
      - plan-03-stack-landing-lifecycle-cleanup
    branch: close-follow-up-gaps-in-git-spice-stacked-pr-support/plan-04-docs-skills-generated-references
    build:
      - - implement
        - doc-author
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Documentation and generated artifact refresh across repo docs, web
          docs, skills, config comments, and plugin metadata.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - review-cycle
    - doc-sync
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - docs
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a large cross-cutting change, but it is primarily a
    coordinated architecture/refactor sequence with shared foundations rather
    than independently planned subsystems, so excursion is appropriate. A plan
    review gate is included because the PRD has many acceptance criteria and
    breaking API/docs changes. Build runs implementation and planned docs
    authoring together, then writes tests, performs iterative review, syncs
    existing docs against the final implementation, and runs an iterative test
    cycle. Review focuses on API compatibility/breaking-surface correctness and
    documentation consistency, with strict evaluation due to the clean-break
    landing vocabulary, queue semantics, artifact persistence, and generated-doc
    drift risk.
