name: ensure-ai-session-plans-satisfy-readiness-dimensions
description: Ensure AI session-plan creation drafts use canonical readiness
  dimension ids and are validated before persistence.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test
plans:
  - id: plan-01-readiness-contract
    name: Enforce AI Session-Plan Creation Readiness Contract
    depends_on: []
    branch: ensure-ai-session-plans-satisfy-readiness-dimensions/plan-01-readiness-contract
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Coordinates a shared client task contract, prompt context, an
          input-package validator, extension apply ordering, and regression
          tests while avoiding growth in a baseline-capped source file.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a multi-package bugfix/feature touching engine prompts,
    client task schemas, input readiness helpers, extension orchestration, and
    regression tests, but it is still one coherent planning problem, so
    excursion is appropriate. A plan review gate is useful because the
    acceptance criteria are detailed and cross-package. The build runs
    implementation, writes and executes tests, then runs the registered
    maintainability validation provider before iterative review. API and test
    perspectives target the main risks: preserving task/schema contracts while
    enforcing readiness and proving the regression cannot recur."
