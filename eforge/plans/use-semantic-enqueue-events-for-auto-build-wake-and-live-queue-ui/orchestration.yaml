name: use-semantic-enqueue-events-for-auto-build-wake-and-live-queue-ui
description: Use persisted semantic enqueue completion events to wake auto-build
  and live-project pending queue items instead of relying on enqueue worker
  process exit.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
plans:
  - id: plan-01-semantic-enqueue-wake
    name: Semantic Enqueue Wake and Queue Projection
    depends_on: []
    branch: use-semantic-enqueue-events-for-auto-build-wake-and-live-queue-ui/plan-01-semantic-enqueue-wake
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The fix crosses daemon DB polling, scheduler wake semantics, and
          client/UI event projection; careful idempotency and
          subscriber-independence are required.
      reviewer:
        effort: high
        rationale: Review must check that wake side effects no longer depend on worker
          process exit and that run-state authority remains daemon:run:upsert.
      tester:
        effort: high
        rationale: Regression tests must cover asynchronous persisted-event polling
          without connected SSE subscribers and queue projection idempotency.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
    - test-write
    - test-cycle
    - validate
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
      - test
      - verify
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a cross-cutting daemon/client/UI bugfix, but a single planner
    can enumerate the required changes across event reaction, queue projection,
    and tests, so excursion is appropriate rather than expedition. A plan review
    cycle is included because the PRD has architectural constraints around
    semantic events, daemon ownership, idempotency, and avoiding process-exit
    coupling. The build pipeline prioritizes implementation, iterative code
    review, explicit test authoring, test execution/fix cycles, and final
    validation because the acceptance criteria require regression and
    reducer/projector tests. Parallel review perspectives cover code
    correctness, API/wire-contract behavior, test quality, and verification of
    the semantic enqueue wake path. Strict evaluation is warranted because this
    fixes recurring orchestration behavior in daemon scheduling and live state
    projection.
