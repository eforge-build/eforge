name: extend-12b-validation-provider-extension-point
description: Wire extension-registered validation providers into the built-in
  `validate` build stage as a runtime-supported per-plan quality gate, with
  typed/legacy results, command-style alternative, provider-specific events,
  fail-closed timeout semantics, and coherent projections/UI/CLI/docs/example
  coverage.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-validation-provider-runtime
    name: Validation provider runtime, build-stage execution, and event schemas
    depends_on: []
    branch: extend-12b-validation-provider-extension-point/plan-01-validation-provider-runtime
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Cross-package SDK type expansion, new engine runtime helper,
          build-stage execution, and event schema additions with strict
          backwards-compatibility requirements. Higher effort improves
          type-design quality and the legacy/structured-result normalization
          logic.
      reviewer:
        effort: high
        rationale: Public SDK contract change plus new event schema variants — both have
          downstream consumers and must be reviewed for API ergonomics,
          backwards compatibility, and event-shape consistency with existing
          extension event families.
  - id: plan-02-validation-provider-projections-ui-docs
    name: Validation provider projections, monitor UI, CLI, docs, and example
      extension
    depends_on:
      - plan-01-validation-provider-runtime
    branch: extend-12b-validation-provider-extension-point/plan-02-validation-provider-projections-ui-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      doc-author:
        effort: high
        rationale: Four user-facing docs files plus a new example extension and SDK
          README change all need to land in sync with the runtime behavior
          shipped in plan-01. Higher doc-author effort improves accuracy of the
          runtime status table and the timeout/failure semantics sections.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
      - docs
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "The PRD recommends Excursion explicitly and the work is a cohesive
    capability slice (SDK types, engine runtime, client event schemas, UI/CLI
    projections, tests, docs) that a single planner can decompose into sequenced
    plans without delegated module planning. Compile uses planner +
    plan-review-cycle because plan quality matters: the work touches a public
    SDK contract, event schemas, and a guardrail ('no arbitrary stage
    registration'), so a planning quality gate is warranted, while expedition's
    architecture/module-planning is unnecessary for a sequential feature. Build
    composes implement in parallel with doc-author (PRD explicitly updates
    docs/extensions.md, docs/extensions-api.md, docs/config.md, README.md, and
    adds an example - doc-author has no predecessors so it parallelizes safely
    with implement), then doc-sync to reconcile other docs against the diff
    (changed SDK signatures and event shapes will have stale references), then
    review-cycle for iterative quality gating, then test-cycle because the PRD
    enumerates a large test matrix (loader validation, runtime behavior, event
    schema parity, projection/CLI output, timeout/error paths) and explicitly
    calls for unit/integration tests. Review uses parallel strategy with
    code/api/docs/test perspectives: 'code' for runtime/engine correctness,
    'api' because this evolves a public SDK contract with
    backwards-compatibility requirements, 'docs' because doc updates are an
    acceptance criterion (deferred->runtime-supported labelling), and 'test'
    because comprehensive test coverage is required. Strictness is standard with
    2 rounds - the change is substantive but not security/data-critical; the
    no-mutation contract is enforced by API shape and documentation rather than
    a security boundary, so strict is unwarranted."
