name: extract-playbook-domain-ownership-to-eforge-playbooks
description: Extract all playbook domain behavior into eforge-playbooks and
  remove playbook-specific ownership from core, input, host, client, monitor,
  Console, and planning contracts.
created: 2026-06-26
compiled: 2026-06-26
mode: expedition
base_branch: main
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm build
  - pnpm test
plans:
  - id: plan-01-playbook-domain-extraction
    name: Move canonical playbook model, parser, serializer, validation, storage,
      compiler, and planning seed behavior into eforge-playbooks and rewire its
      actions/tests.
    depends_on: []
    branch: extract-playbook-domain-ownership-to-eforge-playbooks/playbook-domain-extraction
    build: &a1
      - - implement
        - doc-author
      - doc-sync
      - test-write
      - validate
      - review-cycle
      - test-cycle
    review: &a2
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 3
      evaluatorStrictness: strict
  - id: plan-02-host-surface-neutrality
    name: Remove CLI, MCP, Pi, and Claude plugin host-owned playbook
      commands/tools/skills and rely on generic extension contribution
      invocation.
    depends_on:
      - plan-01-playbook-domain-extraction
    branch: extract-playbook-domain-ownership-to-eforge-playbooks/host-surface-neutrality
    build: *a1
    review: *a2
  - id: plan-03-input-neutrality
    name: Remove playbook-specific files, exports, session-plan seed helpers, and
      docs from @eforge-build/input while preserving generic session-plan
      behavior.
    depends_on:
      - plan-01-playbook-domain-extraction
    branch: extract-playbook-domain-ownership-to-eforge-playbooks/input-neutrality
    build: *a1
    review: *a2
  - id: plan-04-planning-contract-neutralization
    name: Remove playbookDraft and playbook-specific planning capability/contracts
      from client, monitor, and eforge-plan planning task surfaces.
    depends_on:
      - plan-01-playbook-domain-extraction
    branch: extract-playbook-domain-ownership-to-eforge-playbooks/planning-contract-neutralization
    build: *a1
    review: *a2
  - id: plan-05-boundary-docs-validation
    name: Add source-wide boundary tests, enabled/disabled extension coverage,
      Console contribution coverage, and update architecture/public/generated
      docs.
    depends_on:
      - plan-03-input-neutrality
      - plan-04-planning-contract-neutralization
      - plan-02-host-surface-neutrality
    branch: extract-playbook-domain-ownership-to-eforge-playbooks/boundary-docs-validation
    build: *a1
    review: *a2
pipeline:
  scope: expedition
  compile:
    - planner
    - architecture-review-cycle
    - module-planning
    - cohesion-review-cycle
    - compile-expedition
  defaultBuild: *a1
  defaultReview: *a2
  rationale: "This is expedition-scale because it extracts a domain boundary
    across many packages: extension ownership, input contracts, engine,
    client/daemon/monitor, CLI, Pi, Claude plugin, Console, tests, and docs. The
    compile pipeline uses architecture and module planning plus cohesion review
    to coordinate cross-package boundaries before producing build plans. The
    build pipeline implements docs in parallel, syncs existing docs, adds
    boundary/flow tests, runs the loaded validation provider before review, then
    performs strict iterative review and final test cycling. Code and API
    perspectives target the main risks: domain leakage, contract churn, and
    generic host/extension boundary correctness."
