name: move-console-plans-into-the-eforge-plan-workstation
description: Move first-party Console planning UX into the eforge-plan extension
  workstation while preserving daemon/client session-plan compatibility routes.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- eforge/extensions/eforge-plan/__tests__/*.test.ts
    test/eforge-plan-workstation.test.ts
    packages/console-ui/src/__tests__/navigation.test.ts
    packages/console-ui/src/__tests__/app.test.tsx
    packages/console-ui/src/__tests__/header.test.tsx
    packages/console-ui/src/views/system/__tests__/system-fetches.test.ts
    packages/console-ui/src/views/system/__tests__/use-system-surfaces.test.tsx
    packages/console-ui/src/views/system/__tests__/system-view-content.test.tsx
    packages/console-ui/src/views/system/__tests__/system-selectors.test.ts
    packages/monitor/src/__tests__/routes-session-plans.test.ts
    packages/monitor/src/__tests__/routes-session-plan-sets.test.ts
    packages/monitor/src/__tests__/routes-extension-content-source-contract.test.ts
  - pnpm maintainability:check
  - pnpm docs:check
plans:
  - id: plan-01-extension-planning-workstation
    name: Extension-Owned Planning Workstation and Actions
    depends_on: []
    branch: move-console-plans-into-the-eforge-plan-workstation/plan-01-extension-planning-workstation
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan adds a new extension-owned action surface, JSON-safe
          projections, local session-plan mutations, and a sandboxed
          frame-bundle UI that must preserve the extension/Console boundary.
      reviewer:
        effort: high
        rationale: Review needs careful attention to iframe bridge allowlists, local
          file writes, JSON-safe outputs, and compatibility with the existing
          session-planning adapter.
  - id: plan-02-console-plans-route-removal
    name: Remove the Core Console Plans Route
    depends_on:
      - plan-01-extension-planning-workstation
    branch: move-console-plans-into-the-eforge-plan-workstation/plan-02-console-plans-route-removal
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
  - id: plan-03-system-boundary-docs
    name: Remove System Session-Plan Summary and Sync Boundary Docs
    depends_on:
      - plan-02-console-plans-route-removal
    branch: move-console-plans-into-the-eforge-plan-workstation/plan-03-system-boundary-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a cohesive cross-cutting feature touching the eforge-plan
    extension, Console route ownership, tests, and documentation, but a single
    planner can enumerate the required work, so excursion is appropriate. A plan
    review gate is included because the boundary changes and compatibility
    constraints are important. Build runs implementation with documentation
    authoring in parallel, then syncs docs, writes tests, runs the registered
    maintainability validation providers before review, performs an iterative
    review cycle, and finishes with test execution. Review uses code and
    security perspectives because the work changes iframe/workstation bridge
    behavior, allowed actions, and queue-affecting handoff flows.
