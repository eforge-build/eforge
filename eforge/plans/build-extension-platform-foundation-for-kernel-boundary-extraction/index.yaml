name: build-extension-platform-foundation-for-kernel-boundary-extraction
description: Foundation for typed extension actions, contribution manifests,
  daemon invocation routes, Console rendering, and host discovery/invocation
  while preserving existing workflows.
created: 2026-06-03
status: compiled
compiled: "2026-06-03"
mode: expedition
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
architecture:
  status: complete
modules:
  platform-contracts:
    description: Define SDK registration methods plus client-owned TypeBox
      manifest/action wire contracts, helpers, exports, and daemon API v52 bump.
    depends_on: []
    status: pending
  engine-registry-runtime:
    description: Record, validate, de-duplicate, project, replay-summarize, and
      invoke extension actions/contributions/commands/deep links in the engine
      registry/runtime.
    depends_on:
      - platform-contracts
    status: pending
  daemon-action-routes:
    description: Add daemon manifest and action invocation routes, typed action
      lifecycle events, route security, and route/event regression coverage.
    depends_on:
      - engine-registry-runtime
    status: pending
  console-contribution-rendering:
    description: Render declarative extension Console contributions in the System
      route and invoke bound actions through browser-safe client helpers.
    depends_on:
      - daemon-action-routes
    status: pending
  host-integration-surfaces:
    description: Expose generic extension contribution discovery and invocation in
      Pi, Claude/MCP, and CLI while keeping management dispatch separate.
    depends_on:
      - daemon-action-routes
    status: pending
  docs-examples-compat:
    description: Update docs, SDK README, examples, generated references, and
      compatibility guidance for shipped and deferred extension platform seams.
    depends_on:
      - console-contribution-rendering
      - host-integration-surfaces
    status: pending
