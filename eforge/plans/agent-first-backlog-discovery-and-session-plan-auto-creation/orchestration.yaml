name: agent-first-backlog-discovery-and-session-plan-auto-creation
description: Implement compact agent-first extension contribution discovery,
  eforge-plan backlog projection controls, and automatic workstation
  session-plan creation from ready planning tasks.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-shared-contribution-projection
    name: Shared Contribution Projection and Formatting
    depends_on: []
    branch: agent-first-backlog-discovery-and-session-plan-auto-creation/plan-01-shared-contribution-projection
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This plan introduces shared projection and formatting contracts that
          multiple host integrations will depend on; careful API shape and
          compatibility handling are required.
  - id: plan-02-host-contribution-surfaces
    name: MCP, Pi, and CLI Contribution Surfaces
    depends_on:
      - plan-01-shared-contribution-projection
    branch: agent-first-backlog-discovery-and-session-plan-auto-creation/plan-02-host-contribution-surfaces
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This plan wires a shared client projection through three user-facing
          host surfaces while preserving Pi interactive invocation behavior that
          needs detail schemas.
  - id: plan-03-backlog-query-projections
    name: eforge-plan Backlog Query Projection Controls
    depends_on: []
    branch: agent-first-backlog-discovery-and-session-plan-auto-creation/plan-03-backlog-query-projections
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-04-workstation-session-plan-auto-apply
    name: Workstation Session Plan Auto-Creation
    depends_on:
      - plan-03-backlog-query-projections
    branch: agent-first-backlog-discovery-and-session-plan-auto-creation/plan-04-workstation-session-plan-auto-apply
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: The workstation hook must coordinate polling, duplicate apply
          prevention, visible error state, data refresh, and navigation without
          introducing apply loops.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a broad multi-package feature touching shared client
    projection/formatting, MCP/CLI, Pi, eforge-plan actions/docs, and
    workstation workflow UI, but it can still be planned as ordered excursion
    plans rather than requiring delegated expedition module planning. A plan
    review gate is included because the work has many acceptance criteria and
    cross-package dependencies. The build pipeline includes documentation
    authoring/sync, test generation, the registered validation gate, iterative
    review, and final test execution. Review focuses on API contract safety and
    test coverage because the main risks are daemon/client-owned wire behavior,
    host integration drift, projection options, and workflow auto-apply
    correctness.
