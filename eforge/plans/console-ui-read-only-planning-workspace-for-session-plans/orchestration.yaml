name: console-ui-read-only-planning-workspace-for-session-plans
description: Add a read-only Console UI Planning Workspace for session plans,
  including submitted-plan visibility via a compatible session-plan list API
  expansion.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm exec vitest run test/session-plan.test.ts
    test/daemon-session-plan-routes.test.ts
  - pnpm --filter @eforge-build/console-ui test
plans:
  - id: plan-01-session-plan-list-api
    name: Session Plan List API Submitted Visibility
    depends_on: []
    branch: console-ui-read-only-planning-workspace-for-session-plans/plan-01-session-plan-list-api
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - api
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This plan touches shared input helpers, typed client contracts, and a
          large daemon route file; bounded edits and compatibility preservation
          need careful coordination.
      reviewer:
        effort: high
        rationale: The reviewer must verify additive API compatibility and that
          active-plan callers keep their current default behavior.
  - id: plan-02-console-plans-workspace
    name: Console Plans Workspace UI
    depends_on:
      - plan-01-session-plan-list-api
    branch: console-ui-read-only-planning-workspace-for-session-plans/plan-02-console-plans-workspace
    build:
      - - implement
        - doc-author
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - api
        - docs
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This plan adds a new route, navigation, data-fetching hook,
          interactive workspace UI, tests, and docs across console-ui.
      reviewer:
        effort: high
        rationale: The reviewer must check SPA routing, typed API usage, accessibility
          of controls, and submitted build-detail linking.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-package feature touching console-ui
    routing/UI, shared client API contracts, daemon/input listing behavior,
    docs, and tests, but it does not require delegated expedition module
    planning. A planner plus plan-review-cycle is appropriate to catch
    cross-package contract and compatibility issues before implementation. The
    build runs implementation alongside planned documentation, then syncs
    existing docs and writes tests, followed by review and final test execution.
    Review focuses on API compatibility and test coverage because the highest
    risks are preserving active-plan list behavior, using typed client routes,
    and satisfying the PRD's extensive test acceptance criteria.
diff_base_ref: b71a22dc9e6679872a3c9358bce4388ff05a2139
