name: add-context-managed-compile-planning-for-oversized-sources
description: Add a context-managed compile planning strategy that decomposes
  overflow-risk sources into bounded dependency-aware planning units and
  synthesizes existing artifacts.
created: 2026-06-28
compiled: 2026-06-28
mode: expedition
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-contracts-config
    name: Define client-owned decomposition event/failure schemas and engine config
      defaults for planning-unit budgets and parallelism.
    depends_on: []
    branch: add-context-managed-compile-planning-for-oversized-sources/contracts-config
    build: &a1
      - - implement
        - doc-author
      - - doc-sync
        - test-write
      - test-cycle
      - validate
      - review-cycle
    review: &a2
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 3
      evaluatorStrictness: strict
  - id: plan-02-decomposition-core
    name: Implement pure decomposition graph, coverage assignment, recursive
      splitting, budget derivation, and safe scheduling helpers.
    depends_on:
      - plan-01-contracts-config
    branch: add-context-managed-compile-planning-for-oversized-sources/decomposition-core
    build: *a1
    review: *a2
  - id: plan-03-bounded-agent-execution
    name: Add bounded unit prompt/source/compact-handoff support to planner-family
      agent runners and inspection helpers.
    depends_on:
      - plan-01-contracts-config
      - plan-02-decomposition-core
    branch: add-context-managed-compile-planning-for-oversized-sources/bounded-agent-execution
    build: *a1
    review: *a2
  - id: plan-04-compile-orchestration-synthesis
    name: Route bounded-decomposition compile runs through the controller, schedule
      unit planning, and synthesize existing compile artifacts.
    depends_on:
      - plan-01-contracts-config
      - plan-02-decomposition-core
      - plan-03-bounded-agent-execution
    branch: add-context-managed-compile-planning-for-oversized-sources/compile-orchestration-synthesis
    build: *a1
    review: *a2
  - id: plan-05-recovery-rendering
    name: Render decomposition progress and classify decomposition exhaustion in
      recovery sidecars, CLI, Console, registry, and fixtures.
    depends_on:
      - plan-01-contracts-config
      - plan-02-decomposition-core
      - plan-04-compile-orchestration-synthesis
    branch: add-context-managed-compile-planning-for-oversized-sources/recovery-rendering
    build: *a1
    review: *a2
pipeline:
  scope: expedition
  compile:
    - planner
    - architecture-review-cycle
    - module-planning
    - cohesion-review-cycle
    - compile-expedition
  defaultBuild: *a1
  defaultReview: *a2
  rationale: "This is expedition-scale work: it spans engine compile
    orchestration, planner/module-planner behavior, client-owned event schemas,
    recovery sidecars, CLI/Console rendering, config, and extensive tests, with
    preflight explicitly flagging overflow-risk and wide subsystem breadth. The
    compile pipeline uses the full expedition path with architecture and
    cohesion review before compiling module plans. The build pipeline includes
    documentation work, test generation/execution, the required validate gate,
    and iterative review. Parallel code/api review is appropriate because the
    change affects core orchestration logic and typed client-facing event
    contracts."
