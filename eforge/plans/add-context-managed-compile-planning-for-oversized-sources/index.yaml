name: add-context-managed-compile-planning-for-oversized-sources
description: Add a context-managed compile planning strategy that decomposes
  overflow-risk sources into bounded dependency-aware planning units and
  synthesizes existing artifacts.
created: 2026-06-28
status: draft
mode: expedition
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
architecture:
  status: complete
modules:
  contracts-config:
    description: Define client-owned decomposition event/failure schemas and engine
      config defaults for planning-unit budgets and parallelism.
    depends_on: []
    status: pending
  decomposition-core:
    description: Implement pure decomposition graph, coverage assignment, recursive
      splitting, budget derivation, and safe scheduling helpers.
    depends_on:
      - contracts-config
    status: pending
  bounded-agent-execution:
    description: Add bounded unit prompt/source/compact-handoff support to
      planner-family agent runners and inspection helpers.
    depends_on:
      - contracts-config
      - decomposition-core
    status: pending
  compile-orchestration-synthesis:
    description: Route bounded-decomposition compile runs through the controller,
      schedule unit planning, and synthesize existing compile artifacts.
    depends_on:
      - contracts-config
      - decomposition-core
      - bounded-agent-execution
    status: pending
  recovery-rendering:
    description: Render decomposition progress and classify decomposition exhaustion
      in recovery sidecars, CLI, Console, registry, and fixtures.
    depends_on:
      - contracts-config
      - decomposition-core
      - compile-orchestration-synthesis
    status: pending
