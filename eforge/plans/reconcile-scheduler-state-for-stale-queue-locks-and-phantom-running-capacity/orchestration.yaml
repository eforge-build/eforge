name: reconcile-scheduler-state-for-stale-queue-locks-and-phantom-running-capacity
description: Reconcile the live QueueScheduler's in-memory running state with
  queue lock and root-queue file state on every tick/kick so stale locks and
  disappeared PRD files stop consuming capacity without weakening claim-time
  lock ownership.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- queue-scheduler prd-queue auto-build-resume-after-failure
plans:
  - id: plan-01-runtime-queue-lock-reconciliation
    name: Runtime Queue Lock Reconciliation
    depends_on: []
    branch: reconcile-scheduler-state-for-stale-queue-locks-and-phantom-running-capacity/plan-01-runtime-queue-lock-reconciliation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The fix is focused but touches scheduler state-machine and lock
          ownership behavior where regressions can cause duplicate launches or
          stuck dependencies.
      reviewer:
        effort: high
        rationale: Review must verify concurrency boundaries, live-lock preservation,
          and already-claimed semantics.
      tester:
        effort: high
        rationale: Tests need to exercise real filesystem lock states and event ordering
          around scheduler ticks.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
      - test
      - verify
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a focused but non-trivial daemon scheduler correctness fix
    touching runtime state reconciliation, queue lock semantics, and regression
    coverage, so excursion is appropriate. A planner plus plan-review-cycle
    should be enough; expedition is unnecessary because one planner can reason
    about the scheduler, lock helper, and tests together. The build pipeline
    emphasizes implementation, explicit test generation, iterative test
    execution, and strict review because the risk is concurrency/state-machine
    regression such as duplicate launches or phantom capacity. Parallel review
    perspectives cover code quality, daemon/API behavior, tests, and acceptance
    verification.
