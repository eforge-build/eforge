name: add-full-implementation-audit-mode-to-backlog-curation
description: Add explicit delta and full implementation audit scan modes to
  eforge-plan backlog curation, including extension-owned mode plumbing, bounded
  full-audit evidence collection, workstation UI controls/previews, docs, and
  tests.
base_branch: main
mode: excursion
validate:
  - pnpm exec vitest run
    eforge/extensions/eforge-plan/__tests__/backlog-curation-actions.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-source.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-analyze-all-regression.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-apply.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-accepted-baseline.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-recommendation-overlay.test.ts
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/plan-with-ai-panel.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/use-planning-task-workflows.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/backlog-curation-preview.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/backlog-curation-view-model.test.ts
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/backlog-curation-git-delta-panel.test.tsx
    eforge/extensions/eforge-plan/__tests__/readme-contract.test.ts
    eforge/extensions/eforge-plan/__tests__/docs-validation-contract.test.ts
  - pnpm type-check
  - pnpm maintainability:check
plans:
  - id: plan-01-scan-mode-plumbing
    name: Scan Mode Plumbing and Baseline Metadata
    depends_on: []
    branch: add-full-implementation-audit-mode-to-backlog-curation/plan-01-scan-mode-plumbing
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Cross-file schema, workflow-index, source-provider, and apply-path
          metadata change where missing one consumer can break durable task
          reuse or preview parsing.
      reviewer:
        effort: high
        rationale: Review must verify scan-mode metadata stays synchronized across
          action input, workflow entries, source fingerprints, preview output,
          retry/redraft, and accepted baselines.
  - id: plan-02-full-audit-evidence
    name: Bounded Full Implementation Audit Evidence
    depends_on:
      - plan-01-scan-mode-plumbing
    branch: add-full-implementation-audit-mode-to-backlog-curation/plan-02-full-audit-evidence
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        thinking:
          type: adaptive
        rationale: Adds a new bounded evidence collector that must coordinate
          current-state search, lifecycle traces, git/PR classifiers, source
          fingerprints, and planner guardrails without creating false-positive
          closure paths.
      reviewer:
        effort: high
        rationale: Review must inspect evidence confidence, caps, diagnostics,
          determinism, and conservative closure semantics.
      tester:
        effort: high
        rationale: Evidence behavior needs repository-fixture tests for pre-baseline
          shipped work, partial implementation, no-change, ambiguous matches,
          and PR/git degradation.
  - id: plan-03-workstation-docs
    name: Workstation UI, Preview Rendering, and Documentation
    depends_on:
      - plan-01-scan-mode-plumbing
      - plan-02-full-audit-evidence
    branch: add-full-implementation-audit-mode-to-backlog-curation/plan-03-workstation-docs
    build:
      - - implement
        - doc-author
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: UI and docs changes span several files but follow existing
          workstation patterns and server-authoritative preview contracts.
      reviewer:
        effort: high
        rationale: Review must verify user-facing mode copy, warning states, and
          full-audit evidence display align with the new server contract.
      doc-author:
        effort: medium
        rationale: The source explicitly requires README/action documentation and
          workstation copy for both scan modes.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a broad feature across one first-party extension, source
    generation, schemas, UI, docs, and tests, but it is still a coordinated
    excursion rather than independent expedition modules. Plan review is
    included because scan-mode metadata, evidence confidence, baseline behavior,
    and recommendation overlay logic have meaningful correctness risk. The build
    pipeline updates implementation and docs, syncs existing docs, writes
    targeted tests, runs the registered maintainability validation gate, then
    uses iterative review and test cycles for quality.
