    Set-level defaults follow the highest plan risk score (3).

    - module-extension-action-diagnostics: risk score 3 (large-plan,
    low-confidence-localization, multi-subsystem); declared docs work
    sync-existing, test work author-new; derived build implement -> doc-sync ->
    test-write -> test-cycle -> review-cycle and parallel review with
    perspectives code, security, test, verify, 2 round(s), strict evaluation
