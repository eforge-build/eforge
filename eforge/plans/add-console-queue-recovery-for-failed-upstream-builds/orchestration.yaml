name: add-console-queue-recovery-for-failed-upstream-builds
description: Add Console queue recovery for failed-upstream queue cascades via
  client-owned daemon APIs, guarded engine queue repair helpers, and a Console
  Now-dashboard recovery workflow.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-queue-recovery-api-engine
    name: Queue Recovery API and Engine Cascade Repair
    depends_on: []
    branch: add-console-queue-recovery-for-failed-upstream-builds/plan-01-queue-recovery-api-engine
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - api
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan adds a public daemon/client API and guarded filesystem
          mutations across queue terminal directories; careful drift and
          path-safety handling is required.
      reviewer:
        effort: high
        rationale: Review needs extra attention on HTTP contract shape, path traversal
          guards, and queue mutation semantics.
  - id: plan-02-console-queue-recovery-workflow
    name: Console Queue Recovery Workflow
    depends_on:
      - plan-01-queue-recovery-api-engine
    branch: add-console-queue-recovery-for-failed-upstream-builds/plan-02-console-queue-recovery-workflow
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a cohesive cross-package feature touching client contracts,
    engine queue mutation logic, daemon routes, Console UI, docs, and tests, but
    a single planner can enumerate the dependency chain, so excursion fits
    better than expedition. Planner plus plan-review-cycle provides a quality
    gate for the public API and guarded filesystem workflow. The build runs
    implementation and docs authoring in parallel, then syncs docs and writes
    tests before the required validation gate, followed by iterative review and
    test cycles. Code and API reviews are prioritized because the risky areas
    are queue filesystem behavior, daemon/client route contracts, and
    browser-safe Console consumption.
