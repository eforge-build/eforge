name: add-interactive-ai-plan-revision-sessions-for-existing-session-plans
description: Add bounded eforge-plan-owned interactive AI revision sessions for
  existing flat session plans, with single-shot read-only daemon tasks,
  answer-only or patch-bearing turns, explicit preview/apply, stale fingerprint
  blocking, Plans tab UI, and boundary documentation.
created: 2026-06-12
status: draft
mode: expedition
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
  - pnpm build:eforge-plan-workstation
  - pnpm maintainability:check
architecture:
  status: complete
modules:
  client-engine-task-contract:
    description: Add the shared planRevisionTurn task result contract, engine
      submit/prompt handling, monitor metadata counting, and client/engine
      contract tests.
    depends_on: []
    status: pending
  plan-revision-extension-backend:
    description: Implement eforge-plan-owned revision-session storage, action
      schemas/actions, fingerprinted context/apply orchestration, registration,
      and backend tests.
    depends_on:
      - client-engine-task-contract
    status: pending
  plan-revision-workstation:
    description: Add the Plans tab Revise with AI panel, thread hook/rendering,
      patch preview/apply UX, stale/clarification states, frontend fixtures,
      bridge support, UI tests, and workstation build verification.
    depends_on:
      - plan-revision-extension-backend
    status: pending
  docs-reference-boundary:
    description: Update eforge-plan and shared extension docs/reference artifacts,
      preserve generic chat boundary language, and perform Pi/Claude
      integration-surface parity check.
    depends_on:
      - client-engine-task-contract
      - plan-revision-extension-backend
      - plan-revision-workstation
    status: pending
