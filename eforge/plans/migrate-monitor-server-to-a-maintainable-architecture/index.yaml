name: migrate-monitor-server-to-a-maintainable-architecture
description: Behavior-preserving monitor daemon architecture migration that
  turns packages/monitor/src/server.ts into a small composition root with shared
  HTTP primitives, typed context, feature route modules, stream modules,
  reusable projections, and compatibility exports.
created: 2026-06-01
status: compiled
compiled: "2026-06-01"
mode: expedition
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test
architecture:
  status: complete
modules:
  foundation-http-context:
    description: Create MonitorContext, public monitor types, and shared HTTP
      router/request/response/security/static primitives without moving feature
      routes yet.
    depends_on: []
    status: pending
  projections-read-models:
    description: Extract reusable read-side projections for run summaries, run
      state, plans, queue items, stack layers, auto-build state, config
      redaction, and event hydration.
    depends_on: []
    status: pending
  stream-hub:
    description: Extract session and daemon SSE streams, event parsing, polling,
      heartbeat, semantic daemon-event reactions, broadcast, and subscriber
      cleanup into stream-focused modules.
    depends_on:
      - foundation-http-context
      - projections-read-models
    status: pending
  control-monitor-routes:
    description: Create registered route modules for control-plane, recovery/resume,
      queue recovery, monitor data, run details, plans, diffs, and SSE attach
      routes.
    depends_on:
      - foundation-http-context
      - projections-read-models
      - stream-hub
    status: pending
  config-profile-stack-routes:
    description: Create registered route modules for health/version/project context,
      config, profiles, models, stack layers, and stack sync/status.
    depends_on:
      - foundation-http-context
      - projections-read-models
    status: pending
  extension-content-routes:
    description: Create registered route modules and narrow services for extensions,
      playbooks, session plans, and session plan sets.
    depends_on:
      - foundation-http-context
      - projections-read-models
    status: pending
  server-composition-coverage:
    description: Wire the final router and stream hub in server.ts, preserve
      compatibility exports, trim server.ts, add
      registry/security/static/compatibility coverage, and satisfy
      maintainability marker gates.
    depends_on:
      - foundation-http-context
      - projections-read-models
      - stream-hub
      - control-monitor-routes
      - config-profile-stack-routes
      - extension-content-routes
    status: pending
