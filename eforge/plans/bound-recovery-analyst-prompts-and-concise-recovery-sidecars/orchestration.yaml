name: bound-recovery-analyst-prompts-and-concise-recovery-sidecars
description: Bound recovery analyst prompt inputs and replace verbose recovery
  sidecars with a concise current contract and operator-first Markdown report.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm vitest run test/recovery-analyst-context.test.ts
    test/recovery-analyst-wiring.test.ts test/recovery-verdict-schema.test.ts
    test/recovery-sidecars.test.ts test/daemon-recovery-engine-fallback.test.ts
    test/daemon-recovery-sidecars.test.ts test/daemon-recovery-routes.test.ts
    test/apply-recovery.test.ts test/apply-recovery-route.test.ts
    test/apply-recovery-accept-success.test.ts test/resume-build-route.test.ts
    test/resume-eligibility-route.test.ts
    test/resume-compiled-build-engine.test.ts
    test/serve-queue-recovery-verdict.test.ts
    packages/monitor/src/__tests__/routes-recovery.test.ts
    packages/monitor/src/__tests__/projections-queue-items.test.ts
    packages/monitor/src/__tests__/stream-hello-parity.test.ts
    packages/monitor/src/__tests__/routes-monitor-data-streams-acceptance.test.ts
    packages/console-ui/src/components/now/__tests__/queue-recovery-dialog.test.tsx
  - pnpm maintainability:check
plans:
  - id: plan-01-bound-recovery-analyst-context
    name: Bound Recovery Analyst Prompt Context
    depends_on: []
    branch: bound-recovery-analyst-prompts-and-concise-recovery-sidecars/plan-01-bound-recovery-analyst-context
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: The prompt-bounding helper must preserve specific recovery facts
          while deterministically truncating large PRD and summary evidence.
      reviewer:
        effort: high
        rationale: Review must verify that truncation never weakens conservative
          recovery semantics or hides omission markers.
  - id: plan-02-concise-recovery-sidecar-contract
    name: Concise Recovery Sidecar Contract and Consumers
    depends_on:
      - plan-01-bound-recovery-analyst-context
    branch: bound-recovery-analyst-prompts-and-concise-recovery-sidecars/plan-02-concise-recovery-sidecar-contract
    build:
      - implement
      - - test-cycle
        - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes a current wire/file contract and all TypeScript
          consumers in one pass to avoid intermediate type drift.
      reviewer:
        effort: high
        rationale: Review must check the sidecar contract migration, API version bump,
          and current consumer updates across engine, monitor, Console, and
          skills.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-file engine bugfix with sidecar contract
    updates and direct consumer adjustments, but a single planner can enumerate
    the work, so excursion is appropriate. Plan review is included because the
    PRD has many behavioral boundaries and cross-package acceptance criteria.
    The build includes test writing and test cycling for the required
    prompt-bounding and sidecar tests, doc sync for user-facing recovery
    artifact/contract changes, and validate because the maintainability provider
    is loaded. Parallel code and API review targets implementation correctness
    plus the recovery sidecar contract without over-broad perspectives.
