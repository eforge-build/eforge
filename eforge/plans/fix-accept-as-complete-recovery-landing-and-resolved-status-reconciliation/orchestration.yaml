name: fix-accept-as-complete-recovery-landing-and-resolved-status-reconciliation
description: Fix accepted-success recovery so PR landing reuses direct-PR safety
  semantics, preserves per-run auto-merge intent, and projects accepted builds
  as resolved across monitor and Console.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test -- test/accept-success-static-discipline.test.ts
    test/accept-success-direct-pr-landing.test.ts
    test/apply-recovery-accept-success.test.ts test/apply-recovery-route.test.ts
    packages/monitor/src/__tests__/projections-queue-items.test.ts
    packages/monitor/src/__tests__/accept-success-projection-parity.test.ts
    packages/client/src/__tests__/events-schemas-auto-build.test.ts
    packages/console-ui/src/__tests__/now-accepted-success-selectors.test.ts
    packages/console-ui/src/__tests__/metrics-selectors.test.ts
    packages/console-ui/src/__tests__/build-history-accepted-success.test.ts
  - pnpm test -- test/apply-recovery-route.test.ts
    packages/monitor/src/__tests__/projections-queue-items.test.ts
    packages/console-ui/src/__tests__/now-selectors.test.ts
    packages/console-ui/src/__tests__/metrics-selectors.test.ts
  - pnpm test
plans:
  - id: plan-01-engine-monitor-reconciliation
    name: Engine and Monitor Accepted-Success Landing Reconciliation
    depends_on: []
    branch: fix-accept-as-complete-recovery-landing-and-resolved-status-reconciliation/plan-01-engine-monitor-reconciliation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Safety-sensitive git/GitHub landing path plus monitor/client
          wire-contract updates across packages.
      reviewer:
        effort: high
        rationale: Review must verify command sequencing, route contract compatibility,
          and canonical projection behavior.
  - id: plan-02-console-resolved-status
    name: Console Accepted-Success Resolved Status Display
    depends_on:
      - plan-01-engine-monitor-reconciliation
    branch: fix-accept-as-complete-recovery-landing-and-resolved-status-reconciliation/plan-02-console-resolved-status
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Focused selector and presentation changes after monitor/client
          contracts land.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - validate
      - test-write
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is cohesive cross-package bugfix work, not delegated
    module-planning scale, so excursion is appropriate. Plan review is included
    because the PRD touches safety-sensitive PR landing behavior, daemon/client
    contracts, monitor projections, and Console selectors. The build pipeline
    includes the required validate gate after implementation, generated
    regression test work, doc synchronization for API/user-facing behavior
    changes, iterative review, and a final test cycle. Review uses code and API
    perspectives with strict evaluation to cover landing correctness, shared
    helper reuse, route/schema compatibility, and REST/stream/UI parity.
