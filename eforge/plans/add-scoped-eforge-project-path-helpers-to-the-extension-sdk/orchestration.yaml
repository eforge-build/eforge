name: add-scoped-eforge-project-path-helpers-to-the-extension-sdk
description: Add scoped eforge project path helpers to the extension SDK, wire
  ctx.paths into native extension runtime contexts, dogfood the new storage
  convention in eforge-plan, and update tests and docs.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm docs:check
  - pnpm test
plans:
  - id: plan-01-sdk-runtime-paths
    name: SDK Scoped Path Helpers and Runtime Context Wiring
    depends_on: []
    branch: add-scoped-eforge-project-path-helpers-to-the-extension-sdk/plan-01-sdk-runtime-paths
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Public SDK API plus required ctx.paths propagation across several
          runtime context builders and package export metadata.
      reviewer:
        effort: high
        rationale: Review must cover API compatibility, path containment semantics, and
          runtime context coverage across engine/input/monitor callers.
  - id: plan-02-dogfood-docs
    name: Dogfood Extension Storage Convention and Update Docs
    depends_on:
      - plan-01-sdk-runtime-paths
    branch: add-scoped-eforge-project-path-helpers-to-the-extension-sdk/plan-02-dogfood-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - docs
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a cohesive public SDK/runtime feature with docs and tests
    across several files, so excursion fits better than expedition: one planner
    can enumerate the shared helper API, context wiring, dogfooding, tests, and
    docs. Plan review is included because the API surface and runtime contexts
    need careful coordination. Documentation and tests are explicit acceptance
    criteria, so doc-author/doc-sync, test-write, and test-cycle are included.
    The registered validation provider is run after implementation/test/docs
    work and before review as a quality gate. Review focuses on API
    compatibility and documentation correctness with standard strictness for a
    medium-risk feature."
