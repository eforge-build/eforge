name: sqlite-backed-eforge-plan-store
description: Migrate eforge-plan private planning state to a canonical local
  SQLite store with import, SQL projections, FTS5 search,
  lifecycle/actionability evidence, bounded contribution outputs, and
  retention/maintenance.
created: 2026-06-24
status: compiled
compiled: "2026-06-24"
mode: expedition
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
architecture:
  status: complete
modules:
  storage-schema:
    description: "Build the eforge-plan SQLite store foundation: DB path/opening,
      pragmas, migrations, schema constraints, core typed repositories, and FTS5
      capability validation."
    depends_on: []
    status: pending
  importer-reporting:
    description: Implement dry-run-first, idempotent legacy importer/reporting for
      existing Markdown, JSON sidecars, session plans, traces,
      queue/build/session/landing records, and recommendations.
    depends_on:
      - storage-schema
    status: pending
  canonical-write-paths:
    description: Move eforge-plan mutation paths to SQLite repositories while
      keeping session-plan Markdown as build artifacts and centralizing
      duplicate planning suppression.
    depends_on:
      - storage-schema
    status: pending
  projections-lifecycle:
    description: Implement SQL-derived board lanes, item/session lifecycle,
      recommendation actionability, associated plan/build links, active build
      linkage, and compact projections.
    depends_on:
      - canonical-write-paths
    status: pending
  fts-search-bounded-actions:
    description: Implement FTS5 ranked/snippet search and swap agent-facing
      list/search/read contribution actions to bounded SQL-backed projections
      with filters and pagination.
    depends_on:
      - projections-lifecycle
    status: pending
  retention-maintenance:
    description: Add explicit compaction/archive/VACUUM/FTS maintenance helpers that
      preserve canonical rows and current projection explainability.
    depends_on:
      - projections-lifecycle
      - fts-search-bounded-actions
    status: pending
  workstation-docs-integration:
    description: Update the eforge-plan workstation, user-facing docs/help text, and
      integration parity notes to consume and explain the SQLite-backed store,
      import workflow, search, lifecycle, and retention semantics.
    depends_on:
      - importer-reporting
      - fts-search-bounded-actions
      - retention-maintenance
    status: pending
