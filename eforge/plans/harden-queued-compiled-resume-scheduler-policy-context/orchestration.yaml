name: harden-queued-compiled-resume-scheduler-policy-context
description: Harden queued compiled-resume scheduler policy-gate context by
  exposing optional typed compiledResume metadata, adding focused
  scheduler/runtime coverage, and syncing extension API docs.
base_branch: eforge/fix-recovery-actions-ux-after-successor-enqueue-or-resume
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm vitest run test/queue-scheduler-policy.test.ts
    test/extension-policy-gate-runtime.test.ts
    test/queued-compiled-resume-scheduler.test.ts
    test/queue-recovery-cascade.test.ts
  - pnpm docs:check
plans:
  - id: plan-01-compiled-resume-policy-context
    name: Expose Compiled Resume Metadata in Queue Dispatch Policy Context
    depends_on: []
    branch: harden-queued-compiled-resume-scheduler-policy-context/plan-01-compiled-resume-policy-context
    build:
      - test-write
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - api
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - doc-sync
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a focused multi-file API/context hardening task spanning
    scheduler behavior, engine runtime types, extension SDK types, tests, and
    user-facing docs, so excursion fits better than errand or expedition. A
    planner plus plan-review-cycle is enough to catch scope drift without
    delegated module planning. Build runs implementation and docs authoring
    together, adds tests, syncs docs, executes the requested validation/testing
    loop, then runs the loaded maintainability validation gate before iterative
    review. API and test perspectives target the main risks: backward-compatible
    typed context changes and precise coverage."
