name: disallow-manual-acceptance-criteria-in-hard-gated-build-validation
description: Disallow manual-only and visual-only acceptance criteria from
  hard-gated build validation, while preserving them as non-gating manual
  verification notes in prompts and planning guidance.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-manual-only-ac-gate
    name: Reject Manual-Only Hard-Gated Acceptance Criteria
    depends_on: []
    branch: disallow-manual-acceptance-criteria-in-hard-gated-build-validation/plan-01-manual-only-ac-gate
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - docs
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-file quality-gate change across duplicated
    analyzers, enqueue/readiness tests, prompts, and consumer-facing planning
    skills, so excursion is sufficient; a single planner can enumerate the work
    without delegated module planning. Plan review is included because the
    change crosses input, engine, prompts, and integration guidance. The build
    runs implementation with documentation authoring, syncs docs/prompts after
    code changes, writes tests, reviews code and docs, then runs a final test
    cycle to validate behavior.
