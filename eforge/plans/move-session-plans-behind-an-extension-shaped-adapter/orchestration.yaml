name: move-session-plans-behind-an-extension-shaped-adapter
description: Move session-plan behavior behind a bundled extension-shaped
  adapter while preserving existing daemon routes, wire shapes, file layout, and
  build handoff behavior.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm docs:check
  - pnpm test
plans:
  - id: plan-01-adapter-foundation
    name: SDK Storage Helper and Session Planning Adapter Foundation
    depends_on: []
    branch: move-session-plans-behind-an-extension-shaped-adapter/plan-01-adapter-foundation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Introduces a new SDK path-containment API, a public input-package
          adapter contract, package dependency wiring, and path traversal tests.
      reviewer:
        effort: high
        rationale: The plan adds a public helper and path containment logic that
          requires careful API and security review.
  - id: plan-02-daemon-integration-docs
    name: Daemon Service Adapter Integration and Documentation
    depends_on:
      - plan-01-adapter-foundation
    branch: move-session-plans-behind-an-extension-shaped-adapter/plan-02-daemon-integration-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - api
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Integrates the new adapter through daemon services and large CLI
          files while preserving public API compatibility and updating multiple
          documentation mirrors.
      reviewer:
        effort: high
        rationale: Route compatibility, documentation wording, and large-file bounded
          edits need thorough review.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - test-cycle
    - doc-sync
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive cross-package boundary refactor with SDK, input
    adapter, monitor service, test, and documentation work, but a single planner
    can enumerate the dependency chain, so excursion is appropriate rather than
    expedition. Plan review is included to protect the compatibility-heavy
    scope. Build runs docs in parallel with implementation, then adds/executes
    tests, syncs docs after code/test changes, runs the registered
    maintainability validation gate before review, and finishes with an
    iterative review cycle. Code and API perspectives target implementation
    quality plus route, wire, and exported-boundary compatibility.
