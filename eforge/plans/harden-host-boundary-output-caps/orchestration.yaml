name: harden-host-boundary-output-caps
description: Harden agent-facing host-boundary output caps for MCP/Pi tools and
  extension management/contribution responses.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-client-host-output
    name: Shared Client Host Output and Extension Management Projections
    depends_on: []
    branch: harden-host-boundary-output-caps/plan-01-client-host-output
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Defines shared host-boundary rendering and compact projection APIs
          that downstream MCP and Pi plans depend on.
      reviewer:
        effort: high
        rationale: Shared client APIs need careful compatibility review before host
          integrations consume them.
  - id: plan-02-mcp-host-boundary
    name: MCP Host-Boundary Caps and Compact Extension Management
    depends_on:
      - plan-01-client-host-output
    branch: harden-host-boundary-output-caps/plan-02-mcp-host-boundary
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Touches the MCP factory plus a large proxy file; default behavior
          must remain compatible for small JSON while capping oversized
          payloads.
      reviewer:
        effort: high
        rationale: MCP is an agent-facing boundary where raw error/details leakage needs
          careful review.
  - id: plan-03-pi-docs-regressions
    name: Pi Host-Boundary Caps, Regression Tests, and Documentation
    depends_on:
      - plan-01-client-host-output
      - plan-02-mcp-host-boundary
    branch: harden-host-boundary-output-caps/plan-03-pi-docs-regressions
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Coordinates Pi host-boundary behavior, generated docs, skill parity,
          and regression tests across consumer-facing packages.
      reviewer:
        effort: high
        rationale: Consumer-facing docs and Pi details behavior must remain in sync with
          MCP guidance.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - security
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is substantial cross-package hardening across shared client
    helpers, MCP formatting, Pi output, extension management projections, docs,
    and regression tests, but it is a coordinated foundation-plus-consumers
    change that a single planner can decompose, so excursion is appropriate.
    Plan review is included to catch boundary and parity gaps. Documentation and
    tests are first-class acceptance criteria, validate is required by the
    loaded guardrail provider, and strict parallel review focuses on
    host-boundary safety plus shared API/consumer behavior.
