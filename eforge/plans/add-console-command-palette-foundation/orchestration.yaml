name: add-console-command-palette-foundation
description: Add a host-owned Console command palette foundation with
  workstation subview contribution metadata and safe/defaulted extension command
  invocation.
base_branch: eforge/agent-first-backlog-discovery-and-session-plan-auto-creation
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm exec vitest run
    packages/client/src/__tests__/extension-contributions.test.ts
    test/extension-contribution-registry-runtime.test.ts
    test/extension-workstation-bundles.test.ts
    test/extension-sdk-example.test.ts
    eforge/extensions/eforge-plan/__tests__/registration.test.ts
    test/eforge-plan-package-management.test.ts
  - pnpm --filter @eforge-build/console-ui test
  - pnpm type-check
plans:
  - id: plan-01-workstation-subview-contract
    name: Workstation Subview Contribution Contract
    depends_on: []
    branch: add-console-command-palette-foundation/plan-01-workstation-subview-contract
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Extends a public contribution contract across client schemas,
          extension SDK types, engine validation/projection, and the eforge-plan
          extension registration.
  - id: plan-02-console-command-palette
    name: Console Command Palette Foundation
    depends_on:
      - plan-01-workstation-subview-contract
    branch: add-console-command-palette-foundation/plan-02-console-command-palette
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds a new keyboard-first React surface, shadcn/cmdk dependency
          wiring, pure derivation helpers, shortcut handling, extension action
          invocation, and side-effect confirmation tests.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - validate
    - test-write
    - test-cycle
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a substantial cross-package feature touching Console UI,
    client contribution schemas, extension SDK types, engine manifest
    projection, and eforge-plan registration, but it is still a coordinated
    sequential feature that a single planner can decompose, so excursion is
    appropriate. A plan review gate is included because the work spans multiple
    packages and acceptance criteria are detailed. The build includes validate
    because guardrail providers are loaded, test-write and test-cycle because
    the PRD explicitly requires UI/unit/registration tests, doc-sync because
    public contribution types and user-facing Console behavior may affect
    existing docs, and review-cycle for iterative quality. Review focuses on
    code and API compatibility risks without adding unnecessary security review
    because no auth/secrets/sandbox boundary changes are requested.
