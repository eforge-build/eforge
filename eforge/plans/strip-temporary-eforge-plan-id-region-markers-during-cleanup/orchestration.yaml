name: strip-temporary-eforge-plan-id-region-markers-during-cleanup
description: Strip temporary eforge plan-ID region marker comment lines during
  successful cleanup and perform a one-time removal of existing tracked plan-ID
  marker lines while preserving durable semantic markers.
base_branch: main
mode: excursion
validate:
  - bash -lc 'if git ls-files -z | xargs -0 rg -n "eforge:(end)?region
    plan-[0-9]{2}-"; then exit 1; fi'
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm exec vitest run test/region-marker-cleanup.test.ts
    test/prd-artifact.test.ts test/stack-landing-cleanup.test.ts
    test/agent-maintainability-check.test.ts
plans:
  - id: plan-01-cleanup-marker-stripping
    name: Cleanup Marker Stripping
    depends_on: []
    branch: strip-temporary-eforge-plan-id-region-markers-during-cleanup/plan-01-cleanup-marker-stripping
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: The implementation combines whole-line marker parsing, git staging,
          and non-fatal cleanup behavior; a careful builder pass reduces the
          risk of deleting code or changing cleanup commit semantics.
      reviewer:
        effort: high
        rationale: Review must verify that only temporary marker comment lines are
          stripped, semantic markers remain, and cleanup failures stay
          non-fatal.
  - id: plan-02-one-time-marker-cleanup
    name: One-Time Plan-ID Marker Removal
    depends_on:
      - plan-01-cleanup-marker-stripping
    branch: strip-temporary-eforge-plan-id-region-markers-during-cleanup/plan-02-one-time-marker-cleanup
    build:
      - implement
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - verify
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        rationale: This plan is a broad mechanical source edit across many tracked
          files; shards let builders remove marker-only lines in disjoint roots
          without overlapping edits.
        shards:
          - id: engine
            roots:
              - packages/engine/src/
          - id: package-surfaces
            roots:
              - packages/client/src/
              - packages/monitor/src/
              - packages/extension-sdk/src/
              - packages/docs-gen/src/
              - packages/eforge/src/
              - packages/pi-eforge/extensions/
          - id: ui
            roots:
              - packages/console-ui/src/
              - packages/monitor-ui/src/
              - packages/monitor-ui/test/
          - id: tests
            roots:
              - test/
          - id: scripts-config
            roots:
              - scripts/
            files:
              - vitest.main.config.ts
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - doc-sync
    - validate
    - test
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: Excursion fits because this is a focused multi-file maintenance
    change spanning engine cleanup logic, tests, prompts/docs, and a mechanical
    one-time marker cleanup, but it does not require delegated expedition module
    planning. A plan review gate is useful to ensure the cleanup semantics and
    broad source edit are scoped safely. The build runs implementation and
    documentation authoring in parallel, then writes tests, syncs docs, runs the
    registered maintainability validation provider, executes tests, and finishes
    with an iterative review cycle. Code and test review perspectives focus on
    correctness of marker stripping, staging/commit behavior, non-fatal cleanup
    semantics, and test coverage without adding unnecessary security or API
    review.
