name: complete-acceptance-criteria-lifecycle-hardening
description: Complete acceptance-criteria lifecycle hardening by fixing recovery
  split successor inventory creation and adding a fail-closed unknown acceptance
  verdict resolver.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm exec vitest run test/acceptance-criteria-extractor.test.ts
    test/acceptance-criteria-quality.test.ts test/apply-recovery.test.ts
    test/apply-recovery-route.test.ts test/prd-validator.test.ts
    test/prd-validator-fail-closed.test.ts test/prd-validate-phase.test.ts
    test/orchestration-validation-gates.test.ts
  - pnpm maintainability:check
plans:
  - id: plan-01-recovery-split-canonical-inventory
    name: Recovery Split Canonical Inventory
    depends_on: []
    branch: complete-acceptance-criteria-lifecycle-hardening/plan-01-recovery-split-canonical-inventory
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
  - id: plan-02-acceptance-unknown-resolution
    name: Acceptance Unknown Resolution
    depends_on:
      - plan-01-recovery-split-canonical-inventory
    branch: complete-acceptance-criteria-lifecycle-hardening/plan-02-acceptance-unknown-resolution
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan adds fail-closed agent parsing, read-only command safety,
          dirty-worktree enforcement, and orchestrator acceptance-gate wiring.
      reviewer:
        effort: high
        rationale: Review must check subprocess safety and fail-closed acceptance-gate
          behavior.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a multi-file engine hardening task spanning recovery queue
    writing, canonical acceptance-criteria extraction, final PRD validation,
    resolver behavior, and regression tests, but it is still cohesive enough for
    excursion rather than expedition. Plan review is included because the
    previous build failed review and the lifecycle rules are nuanced.
    Test-writing and test-cycle are included because the PRD explicitly requires
    targeted Vitest coverage. The registered maintainability validation provider
    requires validate after implementation and before review. Parallel
    code/security review with strict evaluation fits the fail-closed resolver
    behavior and safe read-only command constraints.
diff_base_ref: eforge/harden-acceptance-criteria-lifecycle
