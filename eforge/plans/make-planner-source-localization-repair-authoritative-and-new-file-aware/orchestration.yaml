name: make-planner-source-localization-repair-authoritative-and-new-file-aware
description: Bounded planner compiler artifacts for
  make-planner-source-localization-repair-authoritative-and-new-file-aware
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: planner-localization-authority
    name: Make planner source localization repair authoritative and new-file aware
    depends_on: []
    branch: make-planner-source-localization-repair-authoritative-and-new-file-aware/planner-localization-authority
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    test_ownership: builder
pipeline:
  compile:
    - planner
    - planning-quality-review-cycle
  defaultBuild:
    - implement
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: >-
    Bounded planner compiler pipeline

    Bounded planner compiler produced final plan artifacts directly.

    Per-plan pipeline settings normalize typed model intent against
    deterministic compiler safety signals.

    Set-level review follows the deepest normalized review; build defaults
    follow the broadest normalized plan pipeline (highest risk score 1).

    - planner-localization-authority: risk score 1
    (low-confidence-localization); declared docs work none, test work
    author-new, test owner builder; model review intent heavy (This changes
    compiler trust boundaries, path ownership under worktrees, evidence-budget
    ordering, and selective rerun scheduling; subtle fail-open behavior could
    produce unbuildable plans while overcorrection could force unnecessary
    exploration.); derived build implement -> test-cycle -> review-cycle and
    parallel review with perspectives code, security, test, verify, 2 round(s),
    strict evaluation
