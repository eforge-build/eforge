name: add-compile-resilience-for-oversized-prds
description: Add engine-owned compile resilience for oversized PRDs through
  preflight risk estimation, generated-inventory compaction, bounded planner
  diagnostics, context-failure classification, recovery guidance, and
  fail-closed artifact validation.
created: 2026-06-26
compiled: 2026-06-26
mode: expedition
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
  - pnpm build
plans:
  - id: plan-01-foundation-contracts
    name: Define shared client wire schemas, terminal subtype, recovery option
      union, and reusable compile-resilience helper contracts.
    depends_on: []
    branch: add-compile-resilience-for-oversized-prds/foundation-contracts
    build: &a1
      - - implement
        - doc-author
      - - test-write
        - doc-sync
      - test-cycle
      - validate
      - review-cycle
    review: &a2
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 3
      evaluatorStrictness: strict
  - id: plan-02-preflight-compaction
    name: Implement deterministic compile source risk estimation and
      generated-inventory prompt compaction before composer/planner prompts.
    depends_on:
      - plan-01-foundation-contracts
    branch: add-compile-resilience-for-oversized-prds/preflight-compaction
    build: *a1
    review: *a2
  - id: plan-03-planner-guardrails
    name: Bound planner submission diagnostics and add prompt/live context
      guardrails around planner-family agent runs.
    depends_on:
      - plan-01-foundation-contracts
      - plan-02-preflight-compaction
    branch: add-compile-resilience-for-oversized-prds/planner-guardrails
    build: *a1
    review: *a2
  - id: plan-04-context-recovery
    name: Classify provider/proactive context failures and route capped
      retry-as-expedition or bounded-decomposition guidance.
    depends_on:
      - plan-01-foundation-contracts
      - plan-02-preflight-compaction
      - plan-03-planner-guardrails
    branch: add-compile-resilience-for-oversized-prds/context-recovery
    build: *a1
    review: *a2
  - id: plan-05-artifact-validation
    name: Fail closed by validating required compile artifacts before reporting
      compile success, including expedition module completeness.
    depends_on:
      - plan-01-foundation-contracts
      - plan-04-context-recovery
    branch: add-compile-resilience-for-oversized-prds/artifact-validation
    build: *a1
    review: *a2
  - id: plan-06-surfaces-docs
    name: Render new typed preflight/failure/recovery guidance in existing CLI,
      Console, recovery, and documentation surfaces as needed.
    depends_on:
      - plan-01-foundation-contracts
      - plan-04-context-recovery
      - plan-05-artifact-validation
    branch: add-compile-resilience-for-oversized-prds/surfaces-docs
    build: *a1
    review: *a2
pipeline:
  scope: expedition
  compile:
    - planner
    - architecture-review-cycle
    - module-planning
    - cohesion-review-cycle
    - compile-expedition
  defaultBuild: *a1
  defaultReview: *a2
  rationale: "This is expedition-scale because it spans multiple coordinated
    subsystems: compile intake/preflight, prompt compaction, planner validation
    diagnostics, context-failure classification, recovery/artifact validation,
    shared client event/API types, and consumer rendering. Architecture and
    module planning reduce the risk of another oversized single planning
    session. The build pipeline includes tests and documentation sync because
    the PRD requires extensive Vitest coverage and may affect
    public/client-visible failure guidance. The loaded maintainability
    validation provider is included before review. Strict parallel code/API
    review is appropriate because the work changes engine resilience paths and
    shared wire/event contracts."
