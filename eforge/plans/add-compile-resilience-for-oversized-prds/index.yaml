name: add-compile-resilience-for-oversized-prds
description: Add engine-owned compile resilience for oversized PRDs through
  preflight risk estimation, generated-inventory compaction, bounded planner
  diagnostics, context-failure classification, recovery guidance, and
  fail-closed artifact validation.
created: 2026-06-26
status: compiled
compiled: "2026-06-26"
mode: expedition
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
  - pnpm build
architecture:
  status: complete
modules:
  foundation-contracts:
    description: Define shared client wire schemas, terminal subtype, recovery
      option union, and reusable compile-resilience helper contracts.
    depends_on: []
    status: pending
  preflight-compaction:
    description: Implement deterministic compile source risk estimation and
      generated-inventory prompt compaction before composer/planner prompts.
    depends_on:
      - foundation-contracts
    status: pending
  planner-guardrails:
    description: Bound planner submission diagnostics and add prompt/live context
      guardrails around planner-family agent runs.
    depends_on:
      - foundation-contracts
      - preflight-compaction
    status: pending
  context-recovery:
    description: Classify provider/proactive context failures and route capped
      retry-as-expedition or bounded-decomposition guidance.
    depends_on:
      - foundation-contracts
      - preflight-compaction
      - planner-guardrails
    status: pending
  artifact-validation:
    description: Fail closed by validating required compile artifacts before
      reporting compile success, including expedition module completeness.
    depends_on:
      - foundation-contracts
      - context-recovery
    status: pending
  surfaces-docs:
    description: Render new typed preflight/failure/recovery guidance in existing
      CLI, Console, recovery, and documentation surfaces as needed.
    depends_on:
      - foundation-contracts
      - context-recovery
      - artifact-validation
    status: pending
