name: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards
description: Port the legacy monitor-ui session reducer into console-ui, replace
  the left sidebar with a top header, fold queue/runs/activity list routes into
  the Now page, add a /console/runs/:detailId build detail route, and give
  active build cards a mini-Gantt pipeline strip — all contained to
  packages/console-ui/ with no daemon HTTP API changes.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
plans:
  - id: plan-01-reducer-port
    name: Port session reducer into console-ui
    depends_on: []
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-01-reducer-port
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Pure-logic port of 11 handlers plus tests; mechanical but volume is
          high and reducer correctness is the foundation everything downstream
          depends on.
  - id: plan-02-deps-and-shadcn
    name: Add dependencies and shadcn primitives
    depends_on: []
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-02-deps-and-shadcn
    build:
      - implement
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
        - verify
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: "Mechanical scaffolding: add npm deps, install shadcn primitive
          wrappers. Volume is high but content is template-driven."
  - id: plan-03-hook-signature-and-consumers
    name: Replace useActiveSessionStreams return shape with reduced RunState
    depends_on:
      - plan-01-reducer-port
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-03-hook-signature-and-consumers
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Cross-cutting type change — hook return shape, selectors, and one UI
          consumer must update together to keep the project type-checking after
          merge.
  - id: plan-04-shell-and-routes
    name: Replace sidebar with header, delete legacy routes
    depends_on:
      - plan-02-deps-and-shadcn
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-04-shell-and-routes
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Wide-impact IA change touching shell, navigation, app.tsx route
          table, and multiple view directories deleted at once. Must keep
          type-check + build green.
  - id: plan-05-now-page-rewrite
    name: Now page rewrite with mini-Gantt cards and activity drawer
    depends_on:
      - plan-03-hook-signature-and-consumers
      - plan-04-shell-and-routes
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-05-now-page-rewrite
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Section-by-section rewrite of the Now page; the mini-Gantt component
          and drawer are net-new and visual correctness matters.
  - id: plan-06-build-detail-base
    name: Build detail route with Log tab and ported pipeline
    depends_on:
      - plan-03-hook-signature-and-consumers
      - plan-04-shell-and-routes
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-06-build-detail-base
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: xhigh
        rationale: Ports the largest chunk of monitor-ui (pipeline family, timeline,
          summary/failure components, console-panel), wires the new route,
          handles live + terminal data sources via the hybrid pattern, and
          stands up the bottom tab panel with react-resizable-panels.
  - id: plan-07-build-detail-tabs
    name: Build detail Changes, Graph, and Plan tabs
    depends_on:
      - plan-06-build-detail-base
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-07-build-detail-tabs
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Ports heatmap, dependency graph, and plan-preview families with their
          respective heavyweight dependencies. Each tab is a self-contained
          subsystem.
  - id: plan-08-docs-sweep
    name: Console UI README and AGENTS.md sweep
    depends_on:
      - plan-05-now-page-rewrite
      - plan-07-build-detail-tabs
    branch: console-ui-monitoring-overhaul-port-reducer-replace-sidebar-with-header-consolidate-routes-into-now-add-build-detail-route-and-mini-gantt-active-build-cards/plan-08-docs-sweep
    build:
      - - implement
        - doc-author
      - doc-sync
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: lenient
    agents:
      doc-author:
        effort: medium
        rationale: Authoring a new README and updating AGENTS.md to reflect the
          consolidated IA.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "The PRD itself recommends Excursion: broad-but-cohesive UI
    replatforming (~50 file changes) with linear cross-plan dependencies
    (reducer port → hook signature change → consumers) and parallel branches
    (shell restructure, route deletions, docs). A single planner session can
    enumerate the 10 suggested execution steps, list file changes, and resolve
    cross-plan dependencies — no module-level delegation is needed.
    plan-review-cycle is added because the PRD has many acceptance criteria
    across reducer, shell, routes, Now sections, build detail route, and
    dependency manifest, so a plan quality gate is worth the cost. defaultBuild
    uses [[implement, doc-author], doc-sync, review-cycle]: the PRD explicitly
    requires creating packages/console-ui/README.md (doc-author runs in parallel
    with implement), updating AGENTS.md references and removing region
    annotations for deleted routes (doc-sync after implement), and a
    review-cycle for the substantial code changes. Review uses the default
    'auto' strategy with 'code' perspective (no security/auth/crypto/network
    trust boundaries, no build-config or dep-infra changes that would warrant
    security or verify — the package.json adds are routine UI deps). 2 rounds
    with standard strictness fits a UI port where iteration matters but isn't
    security-critical."
