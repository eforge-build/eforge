name: add-sandboxed-console-workstations-for-extensions
description: Add manifest-backed sandboxed Console workstations for native
  extensions, with SDK/runtime registration, Console iframe rendering and action
  bridge, a dogfood eforge-plan workstation, and LLM-first extension authoring
  documentation.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm docs:generate
  - pnpm docs:check
  - pnpm maintainability:check
  - pnpm test
plans:
  - id: plan-01-workstation-contract-runtime
    name: Workstation Contract, SDK, and Runtime Projection
    depends_on: []
    branch: add-sandboxed-console-workstations-for-extensions/plan-01-workstation-contract-runtime
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds a new cross-package extension contribution family and required
          client-owned manifest field; all existing typed consumers and fixtures
          must move together.
      reviewer:
        effort: high
        rationale: The plan changes public SDK/client contracts and daemon manifest
          projection, requiring careful API and compatibility review.
  - id: plan-02-console-workstations-ui
    name: Console Workstations Route and Iframe Action Bridge
    depends_on:
      - plan-01-workstation-contract-runtime
    branch: add-sandboxed-console-workstations-for-extensions/plan-02-console-workstations-ui
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Implements a browser trust boundary with sandboxed iframes and a
          parent-owned action bridge.
      reviewer:
        effort: high
        rationale: Iframe sandboxing, postMessage validation, and daemon action
          invocation provenance are security-sensitive.
  - id: plan-03-docs-llm-authoring
    name: Documentation, LLM Artifacts, and Migration Guidance
    depends_on:
      - plan-02-console-workstations-ui
    branch: add-sandboxed-console-workstations-for-extensions/plan-03-docs-llm-authoring
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: medium
        rationale: Documentation-heavy plan with small docs-generation code changes and
          generated artifact updates.
      reviewer:
        effort: high
        rationale: Docs must preserve the new sandbox boundary, deferred bundle scope,
          and LLM artifact discoverability.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - test-write
      - doc-sync
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - security
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a broad but cohesive cross-package feature with a shared
    client/schema foundation, engine capture/projection, Console UI, tests, and
    docs. A single planner can enumerate the dependency chain, so excursion is
    appropriate rather than expedition. Plan review is included because the work
    is architecture-sensitive. Documentation and tests are first-class
    acceptance criteria, so doc-author, doc-sync, test-write, and test-cycle are
    included. The registered maintainability validation provider requires
    validate after implementation and before review. Review uses strict parallel
    security and API perspectives because the feature introduces sandboxed
    iframe boundaries, postMessage action bridging, and public extension/daemon
    manifest contracts.
