name: increase-review-fixer-turn-budget-and-add-continuation-handoff
description: Increase implementation-tier default turn budget and add
  review-fixer max-turn continuation handoff
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm vitest run test/retry.test.ts test/parallel-reviewer.test.ts
    test/pipeline.test.ts test/agent-config.resolution.test.ts
    test/validation-fixer.test.ts test/review-fixer-continuation.test.ts
    packages/client/src/__tests__/events-wire-parity.test.ts
    packages/client/src/__tests__/events-schemas.test.ts
plans:
  - id: plan-01-review-fixer-continuation
    name: Review-Fixer Turn Budget and Continuation Handoff
    depends_on: []
    branch: increase-review-fixer-turn-budget-and-add-continuation-handoff/plan-01-review-fixer-continuation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Touches retry policy, wire events, prompt context, config precedence,
          and git-safety tests; requires careful preservation of evaluator
          boundaries.
      reviewer:
        effort: high
        rationale: Review must verify max-turn retry semantics and that review-fixer
          does not stage, commit, reset, or falsely complete after terminal
          errors.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
    - test-write
    - test-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-file engine bugfix spanning agent config
    defaults, retry/continuation behavior, review-fixer error classification,
    prompt handoff context, and tests, so excursion is appropriate. A plan
    review gate is useful because retry semantics and evaluator boundaries are
    subtle. The build runs implementation first, then review-cycle to catch
    behavioral regressions, followed by test writing and a test cycle because
    the PRD explicitly requires focused tests and type-check validation. Review
    uses code and test perspectives with standard strictness for a non-security
    internal engine behavior change.
