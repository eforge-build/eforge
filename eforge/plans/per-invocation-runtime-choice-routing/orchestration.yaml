name: per-invocation-runtime-choice-routing
description: Add per-invocation runtime choice routing within existing agent
  tiers, including config schema, engine resolution, extension hooks, event
  metadata, docs, and profile creation surfaces.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm docs:check
  - pnpm maintainability:check
  - pnpm test
plans:
  - id: plan-01-runtime-choice-core
    name: Runtime Choice Config and Core Resolution
    depends_on: []
    branch: per-invocation-runtime-choice-routing/plan-01-runtime-choice-core
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes the core runtime selection path, config validation,
          registry memoization, and agent spawn call sites; careful coordination
          prevents resolver/registry drift.
      tester:
        effort: high
        rationale: The plan requires targeted regression coverage for legacy configs,
          choice inheritance, routing predicates, and harness memoization.
  - id: plan-02-runtime-choice-events-extensions
    name: Runtime Choice Events and Extension Routers
    depends_on:
      - plan-01-runtime-choice-core
    branch: per-invocation-runtime-choice-routing/plan-02-runtime-choice-events-extensions
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan extends public event and extension SDK contracts while
          keeping failures fail-open and secret-safe.
      reviewer:
        effort: high
        rationale: The review needs focused attention on event compatibility, extension
          API boundaries, and secret-safe metadata.
  - id: plan-03-runtime-choice-docs-integrations
    name: Runtime Choice Docs and Profile Creation Surfaces
    depends_on:
      - plan-02-runtime-choice-events-extensions
    branch: per-invocation-runtime-choice-routing/plan-03-runtime-choice-docs-integrations
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - api
      maxRounds: 2
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a broad, coupled feature spanning config schema, runtime
    resolution, registry behavior, events, extension hooks, docs, and
    integration surfaces, but it is centered on one shared routing/resolution
    foundation rather than independent modules, so excursion with plan review is
    preferable to expedition. Build includes docs authoring/sync for public
    config and integration documentation, test generation and test cycling for
    resolver/schema/event/registry coverage, the loaded validation gate before
    review, and an iterative review cycle focused on API contracts and test
    adequacy.
