name: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation
description: Move eforge-plan backlog item/epic storage to private extension
  storage with legacy read-through/import compatibility, and add a manual
  analyze-all curation workflow that previews validated backlog updates before
  applying them and refreshing recommendations.
created: 2026-06-09
status: compiled
compiled: "2026-06-09"
mode: expedition
validate:
  - pnpm build:eforge-plan-workstation
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
architecture:
  status: complete
modules:
  storage-foundation:
    description: Canonical private backlog storage helpers with legacy
      read-through/import compatibility and private-only writes.
    depends_on: []
    status: pending
  planning-task-contract:
    description: Client/engine extension planning task contract for structured
      backlog curation drafts, prompt/tool schema, and API version gate.
    depends_on: []
    status: pending
  curation-workflow:
    description: Analyze-all backlog curation backend actions, workflow purpose,
      source fingerprints, validation-first apply, and recommendation freshness.
    depends_on:
      - storage-foundation
      - planning-task-contract
    status: pending
  workstation-curation-ui:
    description: Backlog workstation analyze-all control, curation task labels,
      read-only previews, two-step apply confirmation, mocks, and bundle guards.
    depends_on:
      - curation-workflow
    status: pending
  docs-assets-validation:
    description: README contract updates, generated workstation assets, drift
      guards, and final validation alignment.
    depends_on:
      - storage-foundation
      - planning-task-contract
      - curation-workflow
      - workstation-curation-ui
    status: pending
