name: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation
description: Move eforge-plan backlog item/epic storage to private extension
  storage with legacy read-through/import compatibility, and add a manual
  analyze-all curation workflow that previews validated backlog updates before
  applying them and refreshing recommendations.
created: 2026-06-09
compiled: 2026-06-09
mode: expedition
base_branch: main
validate:
  - pnpm build:eforge-plan-workstation
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-planning-task-contract
    name: Client/engine extension planning task contract for structured backlog
      curation drafts, prompt/tool schema, and API version gate.
    depends_on: []
    branch: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation/planning-task-contract
    build: &a1
      - - implement
        - doc-author
      - - test-write
        - doc-sync
      - validate
      - review-cycle
      - test-cycle
    review: &a2
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 3
      evaluatorStrictness: strict
  - id: plan-02-storage-foundation
    name: Canonical private backlog storage helpers with legacy read-through/import
      compatibility and private-only writes.
    depends_on: []
    branch: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation/storage-foundation
    build: *a1
    review: *a2
  - id: plan-03-curation-workflow
    name: Analyze-all backlog curation backend actions, workflow purpose, source
      fingerprints, validation-first apply, and recommendation freshness.
    depends_on:
      - plan-02-storage-foundation
      - plan-01-planning-task-contract
    branch: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation/curation-workflow
    build: *a1
    review: *a2
  - id: plan-04-workstation-curation-ui
    name: Backlog workstation analyze-all control, curation task labels, read-only
      previews, two-step apply confirmation, mocks, and bundle guards.
    depends_on:
      - plan-03-curation-workflow
    branch: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation/workstation-curation-ui
    build: *a1
    review: *a2
  - id: plan-05-docs-assets-validation
    name: README contract updates, generated workstation assets, drift guards, and
      final validation alignment.
    depends_on:
      - plan-02-storage-foundation
      - plan-01-planning-task-contract
      - plan-03-curation-workflow
      - plan-04-workstation-curation-ui
    branch: migrate-eforge-plan-backlog-storage-and-add-analyze-all-curation/docs-assets-validation
    build: *a1
    review: *a2
pipeline:
  scope: expedition
  compile:
    - planner
    - architecture-review-cycle
    - module-planning
    - cohesion-review-cycle
    - compile-expedition
  defaultBuild: *a1
  defaultReview: *a2
  rationale: "This is expedition-scale because it spans several coordinated
    subsystems: eforge-plan storage/domain/actions, client and engine
    planning-task schemas, workstation UI and bundles, tests, and documentation.
    Architecture and module planning help coordinate shared contracts before
    implementation. The build pipeline includes docs and tests, runs the
    registered maintainability validation gate before review, then uses
    iterative review and test cycles. Review focuses on code correctness and
    API/schema contract safety, with strict evaluation because the work includes
    storage migration, path containment, stale preconditions, and fail-closed
    validation."
diff_base_ref: 4fa9783efb22ab4bb7d71f9c2c507e8e36f4ea9a
