name: update-workspace-dependencies-and-validate-the-repo
description: Update the pnpm workspace dependencies, add tracked supply-chain
  evidence, and make minimal compatibility fixes so CI validation remains
  healthy.
base_branch: main
mode: excursion
validate:
  - pnpm build
  - pnpm type-check
  - pnpm test
  - node packages/docs-gen/dist/cli.js check
plans:
  - id: plan-01-workspace-dependency-update
    name: Workspace Dependency Update and Validation Evidence
    depends_on: []
    branch: update-workspace-dependencies-and-validate-the-repo/plan-01-workspace-dependency-update
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: "The implementation is mechanically scoped but
          supply-chain-sensitive: it must update workspace dependency manifests
          and lockfile, inspect risky package changes, and make only minimal
          compatibility fixes."
      reviewer:
        effort: high
        rationale: Dependency updates require careful review of package-manager
          behavior, lockfile changes, and the recorded supply-chain evidence.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - security
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a workspace-wide dependency update with
    supply-chain-sensitive evidence and validation requirements, but it does not
    require delegated module planning, so excursion is appropriate. A plan
    review gate helps ensure the pnpm workflow, lockfile/manifests, audit
    output, and evidence artifact requirements are covered. The build runs
    implementation first, then a strict review cycle focused on dependency
    security and verification, followed by a test cycle to ensure final changes
    pass the required build, type-check, and test commands.
