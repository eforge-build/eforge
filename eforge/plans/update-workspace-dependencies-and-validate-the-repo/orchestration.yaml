name: update-workspace-dependencies-and-validate-the-repo
description: Update pnpm workspace dependencies, add dependency-update
  supply-chain evidence, and make minimal compatibility fixes so build,
  type-check, test, audit, and docs validation pass.
base_branch: main
mode: excursion
validate:
  - pnpm install --frozen-lockfile
  - pnpm audit
  - pnpm build
  - pnpm type-check
  - pnpm test
  - node packages/docs-gen/dist/cli.js check
plans:
  - id: plan-01-update-workspace-dependencies
    name: Update Workspace Dependencies and Validation Evidence
    depends_on: []
    branch: update-workspace-dependencies-and-validate-the-repo/plan-01-update-workspace-dependencies
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Dependency updates require workspace-wide manifest/lockfile
          coordination plus supply-chain evidence review.
      reviewer:
        effort: high
        rationale: Review must inspect dependency-file diffs, pnpm build-script policy,
          and validation evidence.
      tester:
        effort: high
        rationale: The acceptance criteria require build, type-check, and test commands
          to pass after dependency compatibility fixes.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - security
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: "This is an excursion: dependency updates affect multiple manifests,
    the lockfile, validation evidence, and possible compatibility fixes, but a
    single planner can enumerate the work without expedition-scale module
    planning. plan-review-cycle is included because the PRD has many
    supply-chain and evidence requirements. The build runs implementation, then
    the registered validate provider, then an iterative review cycle, followed
    by a test cycle to satisfy the required build/type-check/test validation.
    Review uses security and verify perspectives because dependency and lockfile
    changes are supply-chain-sensitive and explicitly require command
    validation, with strict evaluation and two rounds to keep fixes targeted."
