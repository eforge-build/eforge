name: add-planning-task-activity-logs
description: Add bounded, sanitized activity logs to eforge-plan planning task
  records, persist daemon-side milestones, instrument backlog curation
  source/map-reduce phases, and render the recent timeline in the workstation
  task drawer.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test
plans:
  - id: plan-01-activity-contract-daemon-core
    name: Activity Log Contract and Daemon Append Flow
    depends_on: []
    branch: add-planning-task-activity-logs/plan-01-activity-contract-daemon-core
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Touches the shared wire contract plus daemon task lifecycle code with
          bounded persistence, event emission, and terminal race behavior.
      reviewer:
        effort: high
        rationale: The review must check API compatibility, sanitizer bounds, and
          terminal transition idempotency.
      tester:
        effort: high
        rationale: Lifecycle and cap tests span client schemas, daemon sanitizer
          helpers, and async task service paths.
  - id: plan-02-curation-milestones
    name: Backlog Curation Source and Map/Reduce Milestones
    depends_on:
      - plan-01-activity-contract-daemon-core
    branch: add-planning-task-activity-logs/plan-02-curation-milestones
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Instrumentation crosses deferred source assembly, source-first audit
          phases, and map/reduce orchestration without changing curation
          outputs.
      tester:
        effort: high
        rationale: Milestone tests must avoid brittle high-frequency item ordering while
          confirming the required phase coverage.
  - id: plan-03-workstation-activity-timeline
    name: Planning Task Projections and Workstation Timeline
    depends_on:
      - plan-01-activity-contract-daemon-core
      - plan-02-curation-milestones
    branch: add-planning-task-activity-logs/plan-03-workstation-activity-timeline
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      reviewer:
        effort: high
        rationale: The review must verify result payload omission remains intact while
          UI surfaces activity without cluttering task cards.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - validate
    - test-cycle
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a multi-package feature spanning shared client schemas,
    daemon persistence/service behavior, extension projections, backlog-curation
    instrumentation, workstation UI, and tests, but it is still a coordinated
    contract-first change that a single planner can decompose, so excursion is
    appropriate rather than expedition. A plan review gate is included because
    the acceptance criteria are detailed and cross-cutting. The build pipeline
    includes documentation support for user-visible workstation behavior, test
    generation and iterative test validation for the extensive required
    coverage, the registered validate provider after implementation, and a
    review cycle for quality. Review focuses on API compatibility and test
    coverage because the main risks are schema/wire-contract drift and missing
    behavior coverage, with standard strictness for feature work.
