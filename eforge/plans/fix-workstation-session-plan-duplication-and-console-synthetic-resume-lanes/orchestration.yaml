name: fix-workstation-session-plan-duplication-and-console-synthetic-resume-lanes
description: Fix eforge-plan workstation duplicate session-plan creation from
  completed AI tasks and filter synthetic resume IDs from engine/Console resume
  lane projections.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm exec vitest run
    eforge/extensions/eforge-plan/__tests__/planner-agent-task-actions.test.ts
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/use-planning-task-workflows.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/planning-task-card.test.tsx
  - pnpm exec vitest run test/resume-seed-state.test.ts
    test/resume-compiled-build-engine.test.ts
    test/recovery-failure-summary.test.ts
    packages/console-ui/src/lib/run-state/__tests__/handle-resume.test.ts
    packages/console-ui/src/components/pipeline/__tests__/thread-pipeline-lanes.test.tsx
    packages/console-ui/src/lib/run-state/__tests__/selectors.test.ts
    packages/console-ui/src/lib/run-state/__tests__/lane-registry.test.ts
plans:
  - id: plan-01-workstation-session-plan-consumption
    name: Consume Applied Session-Plan Creation Tasks
    depends_on: []
    branch: fix-workstation-session-plan-duplication-and-console-synthetic-resume-lanes/plan-01-workstation-session-plan-consumption
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Focused extension/workstation bugfix with existing workflow index
          primitives and test coverage patterns.
  - id: plan-02-filter-synthetic-resume-lanes
    name: Filter Synthetic Resume IDs From Engine and Console Lanes
    depends_on: []
    branch: fix-workstation-session-plan-duplication-and-console-synthetic-resume-lanes/plan-02-filter-synthetic-resume-lanes
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Cross-layer bugfix spanning engine resume event ordering, resume
          projection helpers, Console reducer state, selectors, and React lane
          rendering.
      reviewer:
        effort: high
        rationale: The review needs to verify event ordering, state projection, and UI
          lane gating stay aligned without hiding backed phase lanes.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - validate
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a focused multi-area bugfix touching workstation
    task/session-plan behavior, engine resume projection, and Console lane
    rendering, so excursion scope is appropriate. A single planner can enumerate
    the needed plans without expedition module planning. plan-review-cycle is
    included because the PRD has cross-layer acceptance criteria and explicitly
    warns against a superficial lane-registry fix. The build pipeline implements
    first, then runs the loaded maintainability validation provider, writes
    regression tests, runs an iterative test cycle, and finishes with an
    iterative review cycle. Review focuses on code correctness and test
    coverage; no security or docs perspective is needed because the PRD does not
    touch trust boundaries, dependencies, or documentation.
