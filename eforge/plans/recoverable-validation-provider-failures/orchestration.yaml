name: recoverable-validation-provider-failures
description: Recover normal per-plan validation-provider gate failures through
  the existing review-fixer/evaluator path before failing closed.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- validation-provider-runtime validation-provider-build-stage
    validation-provider-recovery-stage
  - pnpm maintainability:check
  - pnpm docs:check
plans:
  - id: plan-01-runtime-recovery
    name: Validation Provider Recovery Runtime
    depends_on: []
    branch: recoverable-validation-provider-failures/plan-01-runtime-recovery
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Core pipeline control-flow changes touch provider normalization,
          build-stage delegation, and recovery-loop tests while preserving an
          oversized file ceiling.
      reviewer:
        effort: high
        rationale: Review needs to verify failure-classification boundaries, event
          ordering, and recovery budget behavior.
      tester:
        effort: high
        rationale: Tests cover async generator loops, fake timers, command providers,
          and callback-driven recovery.
  - id: plan-02-docs-semantics
    name: Validation Provider Recovery Documentation
    depends_on:
      - plan-01-runtime-recovery
    branch: recoverable-validation-provider-failures/plan-02-docs-semantics
    build:
      - implement
      - review-cycle
    review:
      strategy: single
      perspectives:
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Documentation updates span API comments, examples, package README,
          and guide/reference copies, but no new runtime design is needed.
      reviewer:
        effort: medium
        rationale: Docs review needs to catch drift between root docs, web content, SDK
          comments, and examples.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a focused multi-file engine/extensibility feature, so
    excursion is appropriate. Plan review is included because the change touches
    runtime normalization, build-stage orchestration, public extension
    semantics, docs, and tests. The build runs implementation and documentation
    authoring, adds focused tests, syncs docs, then runs the loaded validation
    provider gate before review as required. Review focuses on code correctness
    and public API/extension contract compatibility, with three rounds to match
    the recovery-loop budget and standard strictness for a feature change.
