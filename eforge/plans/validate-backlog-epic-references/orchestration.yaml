name: validate-backlog-epic-references
description: Add direct-action validation so eforge-plan capture-item and
  update-item reject non-empty epic ids that do not exist in the canonical
  private planning store, while preserving valid, omitted, and empty-string
  clear behavior plus legacy/import permissiveness.
base_branch: main
mode: excursion
validate:
  - pnpm vitest run --silent
    eforge/extensions/eforge-plan/__tests__/backlog-epic-reference-validation.test.ts
  - pnpm type-check
  - pnpm maintainability:check
plans:
  - id: plan-01-direct-epic-reference-validation
    name: Direct Epic Reference Validation
    depends_on: []
    branch: validate-backlog-epic-references/plan-01-direct-epic-reference-validation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - validate
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a localized but non-trivial data-integrity fix spanning
    eforge-plan action handlers, shared validation helpers, and dispatch-level
    tests, so excursion is appropriate. A plan review is included to ensure the
    direct-action boundary and permissive legacy/import paths are scoped
    correctly. The build runs implementation first, then the registered
    maintainability validation gate and test writing, followed by test-cycle and
    review-cycle. Review uses code and test perspectives with strict evaluation
    because the change protects backlog referential integrity and must preserve
    several edge-case behaviors.
