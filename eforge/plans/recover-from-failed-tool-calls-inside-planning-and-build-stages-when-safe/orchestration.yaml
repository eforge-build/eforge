name: recover-from-failed-tool-calls-inside-planning-and-build-stages-when-safe
description: Recover from retryable Pi tool-call, tool-infrastructure, and
  transport failures inside planning and build stages when eforge has not
  crossed an unsafe checkpoint, and downgrade late retryable infrastructure
  failures after authoritative checkpoints to warnings.
base_branch: fix/pi-harness-infra-false-positive
mode: excursion
validate:
  - pnpm vitest run test/retry.test.ts test/pi-transport-resilience.test.ts
    test/pi-harness-tool-error-classification.test.ts
    test/pipeline-composer.test.ts test/compile-evaluator-enforcement.test.ts
  - pnpm type-check
  - pnpm test
  - pnpm build
plans:
  - id: plan-01-stage-local-retry-recovery
    name: Stage-local retry and checkpoint recovery for Pi tool failures
    depends_on: []
    branch: recover-from-failed-tool-calls-inside-planning-and-build-stages-when-safe/plan-01-stage-local-retry-recovery
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This touches shared retry semantics plus compile/build stage agent
          behavior; the builder needs to preserve safety boundaries around
          planning artifacts and build commits.
      tester:
        effort: high
        rationale: The behavior is checkpoint-sensitive and requires regression tests
          for pre-checkpoint retry, post-checkpoint downgrade, and ambiguous
          submission failures.
      reviewer:
        effort: high
        rationale: Review must verify that retries are limited to roles and checkpoints
          with explicit safety contracts.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
    - test-write
    - test-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a focused but cross-cutting engine bugfix touching retry
    policy, Pi error classification, compile-stage behavior, and tests, so
    excursion is appropriate. A plan review cycle helps ensure the
    checkpoint/retry safety boundaries are correctly captured before
    implementation. Build includes implementation, iterative code review,
    explicit test authoring, and a test cycle because the PRD requires multiple
    regression and resilience tests. Review focuses on code correctness and test
    coverage with standard strictness.
