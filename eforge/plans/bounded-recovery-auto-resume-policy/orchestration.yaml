name: bounded-recovery-auto-resume-policy
description: Bounded planner compiler artifacts for bounded-recovery-auto-resume-policy
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
  - pnpm maintainability:check
plans:
  - id: client-contracts-routes
    name: Client contracts, projection, routes
    depends_on: []
    branch: bounded-recovery-auto-resume-policy/client-contracts-routes
    build:
      - implement
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: core-policy-config
    name: Recovery core policy/config
    depends_on:
      - client-contracts-routes
    branch: bounded-recovery-auto-resume-policy/core-policy-config
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: console-recovery-ui
    name: Console recovery display/controls
    depends_on:
      - client-contracts-routes
      - core-policy-config
    branch: bounded-recovery-auto-resume-policy/console-recovery-ui
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  compile:
    - planner
    - planning-quality-review-cycle
  defaultBuild:
    - implement
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: >-
    Bounded planner compiler pipeline

    Bounded planner compiler produced final plan artifacts directly.

    Per-plan pipeline settings derived deterministically from compiler risk
    signals.

    Set-level defaults follow the highest plan risk score (4).

    - client-contracts-routes: risk score 4 (large-plan,
    low-confidence-localization, multi-subsystem, dependency-root); declared
    docs work none, test work author-new; derived build implement -> test-write
    -> test-cycle -> review-cycle and parallel review with perspectives code,
    security, test, verify, 2 round(s), strict evaluation

    - console-recovery-ui: risk score 2 (low-confidence-localization,
    multi-subsystem); declared docs work sync-existing, test work author-new;
    derived build implement -> doc-sync -> test-write -> test-cycle ->
    review-cycle and auto review with perspectives code, test, 1 round(s),
    standard evaluation

    - core-policy-config: risk score 4 (large-plan, low-confidence-localization,
    multi-subsystem, dependency-root); declared docs work sync-existing, test
    work author-new; derived build implement -> doc-sync -> test-write ->
    test-cycle -> review-cycle and parallel review with perspectives code,
    security, test, verify, 2 round(s), strict evaluation
