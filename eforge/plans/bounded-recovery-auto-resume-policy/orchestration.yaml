name: bounded-recovery-auto-resume-policy
description: Bounded planner compiler artifacts for bounded-recovery-auto-resume-policy
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
  - pnpm maintainability:check
plans:
  - id: contracts-config-docs
    name: Contracts, default-off config, docs
    depends_on: []
    branch: bounded-recovery-auto-resume-policy/contracts-config-docs
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: policy-resume-core
    name: Guarded resume policy
    depends_on:
      - contracts-config-docs
    branch: bounded-recovery-auto-resume-policy/policy-resume-core
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: visibility-provenance
    name: Queue/run and Console visibility
    depends_on:
      - policy-resume-core
    branch: bounded-recovery-auto-resume-policy/visibility-provenance
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  compile:
    - planner
    - planning-quality-review-cycle
  defaultBuild:
    - implement
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: >-
    Bounded planner compiler pipeline

    Bounded planner compiler produced final plan artifacts directly.

    Per-plan pipeline settings derived deterministically from compiler risk
    signals.

    Set-level defaults follow the highest plan risk score (4).

    - contracts-config-docs: risk score 3 (large-plan, multi-subsystem,
    dependency-root); declared docs work sync-existing, test work author-new;
    derived build implement -> doc-sync -> test-write -> test-cycle ->
    review-cycle and parallel review with perspectives code, security, test,
    verify, 2 round(s), strict evaluation

    - policy-resume-core: risk score 4 (large-plan, low-confidence-localization,
    multi-subsystem, dependency-root); declared docs work sync-existing, test
    work author-new; derived build implement -> doc-sync -> test-write ->
    test-cycle -> review-cycle and parallel review with perspectives code,
    security, test, verify, 2 round(s), strict evaluation

    - visibility-provenance: risk score 2 (low-confidence-localization,
    multi-subsystem); declared docs work sync-existing, test work author-new;
    derived build implement -> doc-sync -> test-write -> test-cycle ->
    review-cycle and auto review with perspectives code, test, 1 round(s),
    standard evaluation
