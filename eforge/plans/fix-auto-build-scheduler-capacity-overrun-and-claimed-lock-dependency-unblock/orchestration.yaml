name: fix-auto-build-scheduler-capacity-overrun-and-claimed-lock-dependency-unblock
description: Fix auto-build scheduling so live queue locks count as in-flight
  work and already-claimed lock contention cannot unblock dependent PRDs.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- queue-scheduler auto-build-resume-after-failure prd-queue
plans:
  - id: plan-01-lock-aware-scheduler
    name: Lock-Aware Queue Scheduler and Claimed-Skip Semantics
    depends_on: []
    branch: fix-auto-build-scheduler-capacity-overrun-and-claimed-lock-dependency-unblock/plan-01-lock-aware-scheduler
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Concurrency/state-machine bug spanning queue scheduler
          initialization, child exit interpretation, and regression tests.
      tester:
        effort: high
        rationale: Tests need to exercise lock-backed in-flight state, capacity
          accounting, dependency blocking, and already-claimed child exits.
      reviewer:
        effort: high
        rationale: Review must verify state transitions do not regress normal completed,
          failed, and skipped dependency behavior.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a focused but non-trivial scheduler/state-machine bug
    touching queue locks, capacity accounting, child completion semantics, and
    dependency unblocking, so excursion is appropriate rather than expedition. A
    planner plus plan-review-cycle should produce a cohesive implementation plan
    and catch edge-case gaps before build. The build pipeline includes
    implementation, explicit test writing for the requested regressions,
    iterative review for concurrency/state correctness, and a test cycle to
    validate the production bug reproduction and existing scheduler behavior.
    Strict parallel review with code, test, and verify perspectives matches the
    risk of capacity overruns and dependency-order violations without adding
    unrelated security or docs work.
