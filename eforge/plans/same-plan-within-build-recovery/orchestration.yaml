name: same-plan-within-build-recovery
description: Bounded planner compiler artifacts for same-plan-within-build-recovery
base_branch: eforge/direct-pr-base-sync-recovery-ux
validate:
  - pnpm test
  - pnpm type-check
  - pnpm build
  - pnpm maintainability:check
plans:
  - id: mod-same-plan-recovery-core
    name: Same-plan recovery core
    depends_on: []
    branch: same-plan-within-build-recovery/mod-same-plan-recovery-core
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: mod-recovery-visibility-refusal-regressions
    name: Recovery visibility/refusal regressions
    depends_on:
      - mod-same-plan-recovery-core
    branch: same-plan-within-build-recovery/mod-recovery-visibility-refusal-regressions
    build:
      - implement
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
pipeline:
  compile:
    - planner
    - planning-quality-review-cycle
  defaultBuild:
    - implement
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: >-
    Bounded planner compiler pipeline

    Bounded planner compiler produced final plan artifacts directly.

    Per-plan pipeline settings derived deterministically from compiler risk
    signals.

    Set-level defaults follow the highest plan risk score (4).

    - mod-recovery-visibility-refusal-regressions: risk score 3 (large-plan,
    low-confidence-localization, multi-subsystem); declared docs work none, test
    work author-new; derived build implement -> test-write -> test-cycle ->
    review-cycle and parallel review with perspectives code, security, test,
    verify, 2 round(s), strict evaluation

    - mod-same-plan-recovery-core: risk score 4 (large-plan,
    low-confidence-localization, multi-subsystem, dependency-root); declared
    docs work sync-existing, test work author-new; derived build implement ->
    doc-sync -> test-write -> test-cycle -> review-cycle and parallel review
    with perspectives code, security, test, verify, 2 round(s), strict
    evaluation
