name: surface-extension-trust-issues-in-console-and-allow-trust-from-ui
description: Surface untrusted or changed project-team extensions in Console
  Needs attention and add Console trust/re-trust actions using existing
  extension trust APIs.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm --filter @eforge-build/console-ui test
plans:
  - id: plan-01-system-extension-trust-actions
    name: System Extension Trust Actions
    depends_on: []
    branch: surface-extension-trust-issues-in-console-and-allow-trust-from-ui/plan-01-system-extension-trust-actions
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
  - id: plan-02-now-extension-trust-attention
    name: Now Extension Trust Attention
    depends_on:
      - plan-01-system-extension-trust-actions
    branch: surface-extension-trust-issues-in-console-and-allow-trust-from-ui/plan-02-now-extension-trust-attention
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - validate
      - test-write
      - doc-sync
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a cohesive Console feature spanning selectors, UI components,
    mutation helpers, tests, and docs, but it does not require independently
    planned subsystems, so excursion is appropriate. Plan review adds a useful
    quality gate before implementation. The build runs the loaded validation
    provider after implementation, adds targeted tests, syncs user-facing docs,
    executes an iterative test cycle, then performs review-cycle. Code and
    security perspectives are selected because the UI mutates extension trust
    state and must preserve path targeting, provenance, and existing trust
    semantics.
