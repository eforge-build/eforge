name: eforge-plan-workstation-ux-polish
description: Eforge-plan workstation UX polish for stable annotation input,
  optimistic handoff state, lifecycle timestamp projection/rendering, and
  Roadmap read-first editing.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-plan-artifact-lifecycle-projection
    name: Plan Artifact Lifecycle Projection and Handoff State
    depends_on: []
    branch: eforge-plan-workstation-ux-polish/plan-01-plan-artifact-lifecycle-projection
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Backend projection and canonical-state updates are focused but affect
          shared API output consumed by the workstation.
  - id: plan-02-workstation-ux-polish
    name: Workstation UX Polish
    depends_on:
      - plan-01-plan-artifact-lifecycle-projection
    branch: eforge-plan-workstation-ux-polish/plan-02-workstation-ux-polish
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This plan coordinates several UI flows, component tests, and docs
          while reusing existing workstation patterns.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - validate
      - doc-sync
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a focused multi-file UX/API projection feature spanning the
    eforge-plan workstation, shared timestamp projection, and tests, so
    excursion is appropriate. A single planner can enumerate the related plans
    without expedition module planning. plan-review-cycle adds a useful
    compile-time quality gate. The build pipeline implements first, runs the
    required validation provider gate, writes and runs targeted tests required
    by the PRD, syncs docs for user-facing/API-adjacent changes, and finishes
    with iterative review. Review focuses on general code quality plus
    API/projection contract discipline, with standard strictness and two rounds
    for balanced quality without over-orchestration.
