name: remove-legacy-monitor-ui-package
description: Remove the retired legacy packages/monitor-ui workspace package,
  make Console the default dashboard served by the monitor daemon, and refresh
  tests/docs/comments to reference Console as the canonical UI.
base_branch: eforge/build-extension-platform-foundation-for-kernel-boundary-extraction
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm --filter @eforge-build/monitor type-check
  - pnpm --filter @eforge-build/monitor test
  - pnpm --filter @eforge-build/console-ui type-check
  - pnpm --filter @eforge-build/console-ui test
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
  - pnpm build
plans:
  - id: plan-01-remove-monitor-ui-code
    name: Remove Monitor UI Package and Route Dashboard Traffic to Console
    depends_on: []
    branch: remove-legacy-monitor-ui-package/plan-01-remove-monitor-ui-code
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan deletes a workspace package, refreshes lockfile/config
          metadata, updates static HTTP routing, and migrates root tests to
          Console equivalents.
      reviewer:
        effort: high
        rationale: The review must inspect package removal, HTTP static serving
          behavior, path traversal safeguards, and build/test configuration
          changes.
      tester:
        effort: high
        rationale: Targeted monitor static-serving tests, Console package tests,
          workspace type-checking, and root tests all exercise different parts
          of the removal.
  - id: plan-02-refresh-console-docs
    name: Refresh Console Documentation and Stale Monitor UI Comments
    depends_on:
      - plan-01-remove-monitor-ui-code
    branch: remove-legacy-monitor-ui-package/plan-02-refresh-console-docs
    build:
      - implement
      - doc-sync
      - review-cycle
    review:
      strategy: single
      perspectives:
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-file/package cleanup with workspace
    metadata, static serving, tests, and docs, but a single planner can
    enumerate the work, so excursion fits better than expedition. Plan review is
    included because deleting a package and updating routing/build references
    has broad blast radius. Build runs implementation alongside planned docs
    work, then syncs docs after the code diff, adds/migrates tests, executes
    iterative tests, and finishes with review-cycle. Review uses code plus
    verify perspectives because the PRD changes package dependencies, build
    scripts, tsup config, lockfile state, and test expectations.
