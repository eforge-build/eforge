name: git-delta-backlog-curation-overlays
description: Add git-delta baselines, deterministic backlog evidence matching,
  prospective recommendation overlays, trace freshness fixes, workstation
  visibility, and documentation for eforge-plan backlog curation.
created: 2026-06-18
compiled: 2026-06-18
mode: expedition
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-plan-01-git-delta-baseline
    name: Add accepted-analysis baseline sidecar, bounded git-delta scanning,
      diagnostics, and source/fingerprint projection for analyze-all curation.
    depends_on: []
    branch: git-delta-backlog-curation-overlays/plan-01-git-delta-baseline
    build: &a1
      - - implement
        - doc-author
      - - doc-sync
        - test-write
      - validate
      - review-cycle
      - test-cycle
    review: &a2
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 3
      evaluatorStrictness: strict
  - id: plan-02-plan-04-trace-lifecycle-freshness
    name: Refine active versus historical trace classification and recommendation
      freshness projection so stale submitted traces do not imply active/planned
      work.
    depends_on: []
    branch: git-delta-backlog-curation-overlays/plan-04-trace-lifecycle-freshness
    build: *a1
    review: *a2
  - id: plan-03-plan-02-evidence-classification
    name: Make shipped/affected evidence range-aware, add deterministic
      commit-to-item matching and superseded/ambiguous evidence classification,
      and enforce required evidence prefixes.
    depends_on:
      - plan-01-plan-01-git-delta-baseline
    branch: git-delta-backlog-curation-overlays/plan-02-evidence-classification
    build: *a1
    review: *a2
  - id: plan-04-plan-03-prospective-overlay-apply
    name: Build the shared prospective backlog/recommendation overlay used by
      preview and apply, add placement validation, and record accepted analysis
      baselines after explicit applies.
    depends_on:
      - plan-01-plan-01-git-delta-baseline
      - plan-03-plan-02-evidence-classification
    branch: git-delta-backlog-curation-overlays/plan-03-prospective-overlay-apply
    build: *a1
    review: *a2
  - id: plan-05-plan-05-workstation-ui
    name: Surface git-delta diagnostics, effective recommendation overlay counts,
      ambiguous needs-input evidence, and truthful freshness labels in the
      planning workstation.
    depends_on:
      - plan-04-plan-03-prospective-overlay-apply
      - plan-02-plan-04-trace-lifecycle-freshness
    branch: git-delta-backlog-curation-overlays/plan-05-workstation-ui
    build: *a1
    review: *a2
  - id: plan-06-plan-06-docs-validation
    name: Update eforge-plan documentation for baseline storage, git-delta
      diagnostics, overlay-first apply behavior, and active-versus-historical
      trace semantics.
    depends_on:
      - plan-01-plan-01-git-delta-baseline
      - plan-03-plan-02-evidence-classification
      - plan-04-plan-03-prospective-overlay-apply
      - plan-02-plan-04-trace-lifecycle-freshness
      - plan-05-plan-05-workstation-ui
    branch: git-delta-backlog-curation-overlays/plan-06-docs-validation
    build: *a1
    review: *a2
pipeline:
  scope: expedition
  compile:
    - planner
    - architecture-review-cycle
    - module-planning
    - cohesion-review-cycle
    - compile-expedition
  defaultBuild: *a1
  defaultReview: *a2
  rationale: "This is expedition-scale work: it spans git-delta baseline
    storage/scanning, curation source schemas, shipped evidence matching,
    overlay-first recommendation projection, trace lifecycle classification, UI
    freshness/diagnostics, docs, and extensive tests. Architecture and module
    planning are useful to coordinate shared contracts and avoid preview/apply
    drift. The build runs docs and test generation alongside implementation,
    then doc sync, the registered maintainability validation gate, iterative
    review, and final test-cycle coverage. Strict parallel code/api review is
    appropriate because the work changes schema surfaces and safety-critical
    backlog mutation semantics."
diff_base_ref: 4c1f79ecf25ad4b5bac046441192c3b95284df78
