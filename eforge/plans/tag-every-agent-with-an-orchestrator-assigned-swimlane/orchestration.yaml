name: tag-every-agent-with-an-orchestrator-assigned-swimlane
description: Generalize the swimlane model from "lane = plan" to "lane =
  orchestrator phase". Engine assigns first-class lane ids
  (planning/validation/final-validation) to plan-less orchestrator agents via
  the existing planId carrier; console-ui consumes a single lane registry so
  validation no longer visually re-lights the PRD lane.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm build
  - pnpm test
plans:
  - id: plan-01-engine-lane-assignment
    name: "Engine: assign orchestrator-phase lane ids to plan-less agents"
    depends_on: []
    branch: tag-every-agent-with-an-orchestrator-assigned-swimlane/plan-01-engine-lane-assignment
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Threads a lane param through 5 planning agents, the validation-fixer
          and prd-validator wiring, and two closure type signatures across
          orchestrator.ts/phases.ts/eforge.ts/prd-validation-wiring.ts. Many
          small coordinated edits with a pre/post-gap-close discrimination that
          must be wired at the exact call sites where ctx.gapClosePerformed is
          in scope; a missed site silently leaves an agent unlabeled.
  - id: plan-02-console-ui-lane-registry
    name: "console-ui: single lane registry and phase-lane consumers"
    depends_on: []
    branch: tag-every-agent-with-an-orchestrator-assigned-swimlane/plan-02-console-ui-lane-registry
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Introduces a new lane-registry module as the single source of truth
          and re-points three consumers (plan-progress selectors,
          thread-pipeline ordering/PRD-pill, pipeline-colors) plus a coupled
          re-scope of selectPlanningLane. The planning-row data-source change
          and the global/Compile-row PRD-pill move are the subtle parts; missing
          one blanks a row or duplicates the Planning lane.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "Scope is excursion per the PRD's own profile signal and the
    negative-expedition signals it exhibits: this is one cohesive conceptual
    change (lane ≡ orchestrator phase) applied across two packages (engine
    wire-population + console-ui rendering), with a leading foundation-style
    change (assign lane ids in the engine) consumed by sequentially-dependent UI
    consumers. It is a type/contract-shaped refactor with a sequential
    pre/post-gap-close dependency, not 4+ independent subsystems requiring
    delegated module planning. A single planner session can enumerate all ~7
    engine call sites, the new lane registry, and the two console-ui consumers,
    so excursion is correct (not expedition). It is more than a mechanical
    one-file fix, so not an errand. Compile uses planner plus plan-review-cycle
    because the change spans multiple agent signatures and coupled UI selectors
    where a missed call site or a duplicated/empty planning lane is a real risk
    - a plan-quality gate catches scope gaps (e.g. the coupled
    selectPlanningLane re-scope + selectPlanLanes exclusion) before build. Build
    runs implement in parallel with doc-author (doc-author has no predecessors
    and the PRD calls for updating packages/console-ui/README.md plus inline
    lane-registry documentation), then doc-sync to reconcile any stale
    references against the post-implement diff, then review-cycle for an
    iterative quality pass given the many coupled edits and extensive test
    acceptance criteria. Review uses the auto strategy with a single code
    perspective and standard strictness: this is a display/visualization change
    with no auth, secrets, sandboxing, subprocess, dependency, or build-command
    surface (so no security or verify perspective), and the engine change is
    explicitly display-only with no wire-contract or schema change. Two rounds
    at standard strictness balance catching the plumbing/ordering regressions
    the PRD flags against not over-spending review capacity on a
    cosmetic-leaning change."
