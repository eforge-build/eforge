name: preserve-terminal-curation-findings-under-reducer-byte-caps
description: Preserve source-backed terminal backlog-curation findings under
  reducer byte caps by adding semantic reducer-input retention, compact terminal
  finding preservation, named omission diagnostics, reducer prompt guidance, and
  regression coverage.
base_branch: main
mode: excursion
validate:
  - pnpm vitest run
    eforge/extensions/eforge-plan/__tests__/backlog-curation-packets.test.ts
    packages/monitor/src/__tests__/routes-extension-agent-task-backlog-curation-map-reduce.test.ts
  - pnpm type-check
  - pnpm maintainability:check
plans:
  - id: plan-01-terminal-curation-byte-cap
    name: Preserve Terminal Curation Findings Under Reducer Byte Caps
    depends_on: []
    branch: preserve-terminal-curation-findings-under-reducer-byte-caps/plan-01-terminal-curation-byte-cap
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The change spans reducer input prioritization, prompt compaction,
          runner result visibility, and regression tests; it needs careful
          schema-compatible behavior under tight byte caps.
      reviewer:
        effort: high
        rationale: Review must verify data-integrity guarantees for terminal curation
          findings and named omission behavior.
      tester:
        effort: high
        rationale: Tests must exercise byte-cap edge cases that are sensitive to
          serialized sizes and outcome ordering.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - validate
      - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a multi-file data-integrity bug fix touching reducer input
    construction, prompt/diagnostic behavior, and regression coverage, but it is
    still cohesive enough for a single excursion planner rather than
    expedition-scale module planning. plan-review-cycle is included because the
    retention/omission semantics are subtle and acceptance criteria are
    detailed. validate is included after implement because the eforge guardrail
    provider is loaded. test-write and test-cycle are included because the PRD
    explicitly requires packet and map/reduce regression tests. Strict parallel
    code/test review is appropriate because capped reducer behavior can silently
    lose terminal closure data.
