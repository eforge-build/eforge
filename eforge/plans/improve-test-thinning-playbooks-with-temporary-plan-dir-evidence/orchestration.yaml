name: improve-test-thinning-playbooks-with-temporary-plan-dir-evidence
description: Add committed project-team test-thinning playbooks that require
  temporary plan-directory evidence for deleted or consolidated tests, plus
  focused playbook validation tests.
base_branch: main
mode: excursion
validate:
  - pnpm vitest run test/playbook.test.ts --reporter verbose
  - pnpm vitest run test/playbook-storage.test.ts --reporter verbose
plans:
  - id: plan-01-project-team-test-thinning-playbooks
    name: Project-Team Test-Thinning Playbooks
    depends_on: []
    branch: improve-test-thinning-playbooks-with-temporary-plan-dir-evidence/plan-01-project-team-test-thinning-playbooks
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - docs
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - validate
    - review-cycle
    - test
  defaultReview:
    strategy: single
    perspectives:
      - docs
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a small but nontrivial repository-scoped playbook change,
    matching excursion: one planner can cover the files and validation, and no
    delegated subsystem planning is needed. A plan review is useful because the
    main risk is precise acceptance-evidence wording and scope resolution. Build
    runs implement, then the registered maintainability validation gate, then a
    docs-focused review cycle, followed by test execution for the required
    playbook test command. Documentation stages are omitted because the playbook
    Markdown files are the primary implementation artifacts, not docs to sync
    against code/API changes."
