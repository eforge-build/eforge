name: make-pi-compile-context-guard-limits-model-aware
description: Make Pi planner-family compile live-context guard limits derive
  from resolved Pi model metadata, emit typed diagnostics, and render/document
  those diagnostics.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test
  - pnpm docs:generate
  - pnpm docs:check
plans:
  - id: plan-01-engine-contract
    name: Model-Aware Pi Compile Guard and Event Contract
    depends_on: []
    branch: make-pi-compile-context-guard-limits-model-aware/plan-01-engine-contract
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Touches Pi harness model resolution, compile-stage guard wiring, and
          client-owned wire schemas; requires careful type coordination without
          adding Claude SDK integration.
      reviewer:
        effort: high
        rationale: Client event schema and engine guard behavior changes need close
          review for backwards-compatible optional fields.
  - id: plan-02-render-docs
    name: Render Guard Diagnostics and Update Documentation
    depends_on:
      - plan-01-engine-contract
    branch: make-pi-compile-context-guard-limits-model-aware/plan-02-render-docs
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - validate
      - doc-sync
      - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is broad cross-package work, but it is a coordinated
    feature/refactor around one shared diagnostic contract rather than
    independent modules, so excursion is appropriate. Plan review helps manage
    the many acceptance criteria and event-contract risk. Build includes docs
    and test generation because schemas, renderers, docs, and focused tests are
    required. The registered validation provider runs after implementation and
    before review. Review emphasizes API contract compatibility and test
    coverage without adding unrelated security review.
