name: parameterize-eforge-on-success-landing-actions
description: "Parameterize eforge on-success landing actions: add
  build.onSuccess config (merge-to-base-branch | issue-pr | leave-branch), wire
  per-build override through API/queue/CLI, and update Pi + Claude plugin
  integrations to gather and display the choice."
base_branch: feat/on_success_action
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
  - pnpm docs:check
plans:
  - id: plan-01-engine-config-and-landing
    name: Engine config, landing events, and finalize refactor
    depends_on: []
    branch: parameterize-eforge-on-success-landing-actions/plan-01-engine-config-and-landing
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Touches the engine finalize phase, introduces a new event family in
          the closed wire schema, refactors the success-status derivation away
          from featureBranchMerged, and adds a gh-CLI subprocess wrapper with
          PR-already-exists handling. Easy to get subtly wrong.
      reviewer:
        effort: high
        rationale: Wire-protocol additions and engine lifecycle semantics need a careful
          read; downstream consumers depend on the event shapes being correct on
          first land.
  - id: plan-02-api-queue-and-ui
    name: Per-build override across API, queue, CLI, and monitor UI
    depends_on:
      - plan-01-engine-config-and-landing
    branch: parameterize-eforge-on-success-landing-actions/plan-02-api-queue-and-ui
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Mostly plumbing — wire-shape extension, child-process arg
          propagation, frontmatter persistence — but spans many files and needs
          durable persistence across queue exec.
  - id: plan-03-consumer-integrations-and-docs
    name: Pi extension, Claude plugin, skill docs, and public docs
    depends_on:
      - plan-02-api-queue-and-ui
    branch: parameterize-eforge-on-success-landing-actions/plan-03-consumer-integrations-and-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Mirrored tool-schema changes across two integrations plus parallel
          skill markdown updates. Mechanical but requires careful Pi/Claude
          parity.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "The PRD itself recommends 'excursion' and the work fits that scope:
    a cohesive feature spanning engine config/finalization, wire protocol
    (events + daemon API), queue persistence, and two consumer integrations
    (pi-eforge + eforge-plugin). A single planner can enumerate all required
    changes and cross-package dependencies without delegated module planning,
    which rules out expedition. It is well beyond an errand because it touches
    user-facing behavior, the wire protocol, and requires multi-layer tests.
    Compile uses planner + plan-review-cycle because plan quality matters here:
    the work has many touch-points across packages that must stay in sync
    (notably eforge-plugin/ and packages/pi-eforge/ parity, plus
    DAEMON_API_VERSION bump), and a plan-review gate will catch missed surfaces
    early. Build runs implement in parallel with doc-author since the PRD
    explicitly enumerates new skill/README/docs content with no implement
    predecessor for authoring fresh sections, then doc-sync after implement to
    refresh existing references (event schemas, config reference, monitor UI
    text, generated reference docs), then review-cycle for the cross-cutting
    quality gate. Review perspectives are intentionally narrow: 'code' for core
    correctness, and 'api' because this PRD changes wire/API surfaces (new
    landing:* events, BuildOnSuccess request shape, enqueue route schema, MCP
    tool schemas, DAEMON_API_VERSION). 'security' is omitted (no
    auth/secrets/crypto/sandboxing changes; gh subprocess is a runtime dep
    concern handled in init warning, not a trust-boundary change). 'verify' is
    omitted (build commands and test infra are not being changed). 'docs' is
    already covered by the dedicated doc-author/doc-sync stages, so a docs
    perspective would duplicate that work. maxRounds=2 and standard strictness
    match a feature-grade change with moderate blast radius rather than a
    security- or data-critical one."
