name: harden-build-validation-evidence-gates
description: Harden build validation evidence gates so build success requires
  complete acceptance evidence, fail-closed parser contracts, committed work,
  and accurate rendering.
base_branch: 754e1b77e8f0232757685ae3326519b4d6430909
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-acceptance-evidence-model
    name: Acceptance Evidence Inventory and Policy Foundation
    depends_on: []
    branch: harden-build-validation-evidence-gates/plan-01-acceptance-evidence-model
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Introduces shared validation models and config policy that downstream
          engine gates depend on.
      tester:
        effort: high
        rationale: Schema/config/extractor edge cases need focused coverage before
          engine integration.
  - id: plan-02-engine-acceptance-gates
    name: Engine Acceptance Gate Enforcement
    depends_on:
      - plan-01-acceptance-evidence-model
    branch: harden-build-validation-evidence-gates/plan-02-engine-acceptance-gates
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Changes final build success semantics across PRD validation, no-PRD
          flows, and waiver event evidence.
      tester:
        effort: high
        rationale: Gate behavior must fail closed across several combinations of PRD
          source, plan source, validator output, and waivers.
  - id: plan-03-parser-and-committed-work-hardening
    name: Reviewer Parser and Committed Work Hardening
    depends_on:
      - plan-01-acceptance-evidence-model
    branch: harden-build-validation-evidence-gates/plan-03-parser-and-committed-work-hardening
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Tightens fail-closed parser contracts and git state semantics that
          can affect build success.
      tester:
        effort: high
        rationale: Parser fixture churn and git-state tests need careful edge-case
          validation.
  - id: plan-04-rendering-and-docs
    name: Validation Rendering and Documentation Sync
    depends_on:
      - plan-02-engine-acceptance-gates
      - plan-03-parser-and-committed-work-hardening
    branch: harden-build-validation-evidence-gates/plan-04-rendering-and-docs
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: UI and docs updates depend on settled event/config behavior from
          previous plans.
      doc-syncer:
        effort: high
        rationale: Behavioral docs and generated reference artifacts must stay aligned
          with new validation policy.
      tester:
        effort: medium
        rationale: Rendering tests need focused assertions for failed gap close and
          acceptance summaries.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a cross-cutting validation hardening effort across engine
    gates, parser contracts, event rendering, tests, and docs, but it has a
    coherent sequential dependency chain that a single planner can enumerate, so
    excursion is appropriate rather than expedition. The compile pipeline adds a
    plan review gate because correctness and scope control are important. The
    build pipeline implements code and planned docs together, syncs existing
    docs after code changes, writes focused regression tests, runs iterative
    test fixing, then performs a strict review cycle. Parallel code/test review
    perspectives are chosen because the core risk is fail-closed behavior and
    regression coverage, without adding unrelated security/API perspectives.
