name: unify-live-coverage-derived-backlog-planning-state
description: Unify eforge-plan backlog planning eligibility around backend live
  coverage and keep session-plan readiness projections synchronized with
  Markdown.
base_branch: main
mode: excursion
validate:
  - pnpm exec vitest run --silent
    eforge/extensions/eforge-plan/__tests__/live-coverage-planning-state-regression.test.ts
    eforge/extensions/eforge-plan/__tests__/sqlite-canonical-session-plan-writes.test.ts
    eforge/extensions/eforge-plan/__tests__/sqlite-projections-lifecycle.test.ts
    eforge/extensions/eforge-plan/__tests__/sqlite-board-projections.test.ts
    eforge/extensions/eforge-plan/__tests__/sqlite-recommendation-actionability.test.ts
    eforge/extensions/eforge-plan/__tests__/recommendation-actionability.test.ts
    eforge/extensions/eforge-plan/__tests__/planner-agent-task-actions.test.ts
    eforge/extensions/eforge-plan/__tests__/planner-orchestration.test.ts
    eforge/extensions/eforge-plan/__tests__/session-plan-actions.test.ts
    eforge/extensions/eforge-plan/__tests__/sqlite-session-plan-projections.test.ts
  - pnpm --filter @eforge-build/eforge-plan-workstation exec vitest run
    src/views/backlog/board-model.test.ts
    src/hooks/use-backlog-selection.test.ts
    src/lib/compact-board-adapter.test.ts
    src/views/recommendations-rail.test.tsx
  - pnpm type-check
  - pnpm maintainability:check
plans:
  - id: plan-01-backend-planning-state
    name: Backend Live Coverage and Readiness Projection
    depends_on: []
    branch: unify-live-coverage-derived-backlog-planning-state/plan-01-backend-planning-state
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Coordinates SQLite canonical sync, projection eligibility, planning
          guards, recommendation actionability, and readiness caching across
          multiple backend files.
      reviewer:
        effort: high
        rationale: The backend contract affects duplicate planning prevention and
          cross-surface state; review needs focused checks for drift between
          coverage and eligibility helpers.
      tester:
        effort: high
        rationale: Regression coverage must exercise real extension workflows plus
          targeted canonical and projection cases.
  - id: plan-02-workstation-plan-eligibility
    name: Workstation Uses Backend Plan Eligibility
    depends_on:
      - plan-01-backend-planning-state
    branch: unify-live-coverage-derived-backlog-planning-state/plan-02-workstation-plan-eligibility
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Focused frontend/type update consuming backend projection fields
          across board filtering and selection paths.
      tester:
        effort: medium
        rationale: Workstation unit tests must cover backend-first eligibility behavior
          and fallback compatibility.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - test-write
      - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a broad but tightly coupled eforge-plan change centered on
    one shared live-coverage/readiness policy across backend projections,
    actionability, guards, and workstation consumers. Excursion fits better than
    expedition because the work has a foundation-plus-consumers shape that a
    single planner can decompose. Plan review is included due the many
    cross-surface invariants. The build writes regression/unit tests, syncs docs
    for possible projection/tool response changes, runs the registered
    maintainability validation gate before review, performs strict iterative
    review, and finishes with a test cycle to catch regressions after review
    fixes.
