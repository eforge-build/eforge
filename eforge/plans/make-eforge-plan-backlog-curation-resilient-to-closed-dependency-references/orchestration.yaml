name: make-eforge-plan-backlog-curation-resilient-to-closed-dependency-references
description: Make eforge-plan backlog curation resilient to generated
  recommendations that reference closed dependency records by adding explicit
  dependency state projection, structured recommendation validation,
  curation-only apply semantics, workstation preview handling, tests, and
  documentation updates.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test --
    eforge/extensions/eforge-plan/__tests__/backlog-curation-source.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-apply.test.ts
    eforge/extensions/eforge-plan/__tests__/recommendation-apply-validation.test.ts
    eforge/extensions/eforge-plan/__tests__/planner-agent-task-actions.test.ts
    eforge/extensions/eforge-plan/__tests__/registration.test.ts
    eforge/extensions/eforge-plan/__tests__/readme-contract.test.ts
  - pnpm --filter @eforge-build/eforge-plan-workstation test --
    src/views/backlog/backlog-curation-preview.test.tsx
    src/views/backlog/planning-task-card.test.tsx
    src/views/backlog/use-planning-task-workflows.test.tsx
plans:
  - id: plan-01-backend-validation-and-apply
    name: Backend Dependency Projection and Curation Apply Validation
    depends_on: []
    branch: make-eforge-plan-backlog-curation-resilient-to-closed-dependency-references/plan-01-backend-validation-and-apply
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes shared recommendation validation, curation apply
          transaction ordering, action schemas, and preview projections across
          several extension backend files.
      reviewer:
        effort: high
        rationale: Default fail-closed behavior and public extension action contracts
          need careful review.
  - id: plan-02-workstation-preview-and-docs
    name: Workstation Preview and Documentation for Curation-Only Apply
    depends_on:
      - plan-01-backend-validation-and-apply
    branch: make-eforge-plan-backlog-curation-resilient-to-closed-dependency-references/plan-02-workstation-preview-and-docs
    build:
      - implement
      - - test-cycle
        - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - validate
    - - test-write
      - doc-sync
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-file bugfix spanning extension
    schemas/contracts, source projection, apply validation, workstation UI,
    prompts, tests, and possible docs, so excursion is appropriate. A plan
    review gate helps ensure the cross-layer contract changes are coherent
    without requiring expedition module planning. The build runs implementation
    and planned docs in parallel, then the registered maintainability validation
    provider, test authoring and doc sync, test execution, and iterative review.
    Review focuses on code correctness and API/schema compatibility because the
    main risks are validation semantics and user-facing extension action
    contracts.
