name: reactivate-queue-dependents-after-successful-compiled-build-resume
description: Reactivate skipped queue dependents after a successful
  compiled-build resume of a failed queued PRD by adding resume queue
  reactivation/finalization helpers, wiring them into the engine resume path,
  and covering queue/artifact/completion state with focused tests.
base_branch: main
mode: excursion
validate:
  - pnpm docs:check-parity
  - pnpm type-check
  - pnpm vitest run test/queue-recovery-cascade.test.ts
    test/resume-compiled-build-engine.test.ts
  - pnpm maintainability:check
plans:
  - id: plan-01-resume-queue-reactivation
    name: Resume Queue Reactivation and Finalization
    depends_on: []
    branch: reactivate-queue-dependents-after-successful-compiled-build-resume/plan-01-resume-queue-reactivation
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Recovery-sensitive filesystem, lock, artifact, and completion state
          changes must preserve queue invariants and avoid duplicate launches.
      tester:
        effort: high
        rationale: The plan requires focused filesystem-state and resume-orchestration
          tests for success, failure, ineligible, and guarded no-artifact paths.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - test-write
      - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a focused but recovery-sensitive engine bugfix touching
    resume orchestration, queue state, artifact/completion registries, locks,
    and tests. Excursion is appropriate because a single planner can enumerate
    the needed ordered changes without delegated module planning. Plan review
    helps catch queue-state invariants before build. Tests and doc sync are
    included because the PRD requires focused filesystem/helper coverage and may
    affect documented resume semantics. Validation is included because eforge
    guardrail providers are loaded. Strict multi-perspective review is warranted
    for durable queue recovery behavior.
