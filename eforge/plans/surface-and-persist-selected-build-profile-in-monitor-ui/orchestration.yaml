name: surface-and-persist-selected-build-profile-in-monitor-ui
description: Surface and persist selected build/runtime profile in monitor UI
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
plans:
  - id: plan-01-profile-replay-and-plan-tab
    name: Persist Session Profiles and Render Plan Tab Badge
    depends_on: []
    branch: surface-and-persist-selected-build-profile-in-monitor-ui/plan-01-profile-replay-and-plan-tab
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
        - verify
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
    - test-write
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is an excursion: a focused but multi-file bugfix spanning
    recorder persistence, client/session replay, metadata projection, and
    monitor UI rendering. A single planner can cover the required changes, but
    plan review is worthwhile because the event ordering and replay semantics
    are easy to fix incompletely. The build pipeline implements first, runs
    iterative review, then adds/adjusts tests and executes a test cycle to
    validate recorder correlation, SSE/metadata replay, and Plan tab rendering.
    Parallel review perspectives emphasize code correctness, API/event-contract
    behavior, test coverage, and acceptance verification without
    expedition-level module planning."
