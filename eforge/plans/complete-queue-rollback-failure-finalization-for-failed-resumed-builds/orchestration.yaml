name: complete-queue-rollback-failure-finalization-for-failed-resumed-builds
description: Refresh or invalidate recovery sidecars after failed
  compiled-resume queue rollbacks so recovery consumers do not read stale
  pre-resume evidence.
base_branch: eforge/build-extension-platform-foundation-for-kernel-boundary-extraction
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test -- resume-compiled-build-engine queue-recovery-cascade
plans:
  - id: plan-01-failed-resume-sidecars
    name: Finalize Failed Resume Recovery Sidecars
    depends_on: []
    branch: complete-queue-rollback-failure-finalization-for-failed-resumed-builds/plan-01-failed-resume-sidecars
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The change crosses direct and scheduler-owned resume rollback paths,
          recovery sidecar generation, and tests around a large legacy engine
          file that requires bounded edits.
      reviewer:
        effort: high
        rationale: Review must check ordering around rollback safety, stale-sidecar
          invalidation, and both resume paths.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - test-write
      - doc-sync
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a deep bugfix spanning engine resume rollback, recovery
    sidecar finalization, tests, and architecture documentation, but it is
    cohesive enough for one planner session, so excursion fits better than
    expedition. The compile pipeline adds a plan review gate because queue
    rollback and recovery semantics are risk-sensitive. Build includes
    implementation, test writing, test execution, documentation sync, and
    iterative review. Review focuses on code correctness and test coverage with
    strict evaluation because stale recovery evidence and rollback ordering are
    data-integrity concerns.
