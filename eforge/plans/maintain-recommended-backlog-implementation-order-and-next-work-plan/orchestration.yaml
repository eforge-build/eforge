name: maintain-recommended-backlog-implementation-order-and-next-work-plan
description: Maintain durable eforge-plan recommendation freshness, refresh
  workflow, stale invalidation, apply validation, and workstation status UI for
  recommended backlog implementation order and next work.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
  - pnpm maintainability:check
plans:
  - id: plan-01-freshness-foundation
    name: Recommendation Freshness Foundation and Apply Validation
    depends_on: []
    branch: maintain-recommended-backlog-implementation-order-and-next-work-plan/plan-01-freshness-foundation
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds new storage semantics, source fingerprinting, reference
          validation, and apply-state transitions across existing strict
          recommendation and planner code.
      reviewer:
        effort: high
        rationale: The plan changes extension action contracts and local-write safety
          around recommendation storage.
  - id: plan-02-refresh-invalidation
    name: Recommendation Refresh Action and Stale Invalidation
    depends_on:
      - plan-01-freshness-foundation
    branch: maintain-recommended-backlog-implementation-order-and-next-work-plan/plan-02-refresh-invalidation
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Coordinates daemon-owned task reuse, workflow-index metadata,
          synchronous lifecycle hooks, and mutation-triggered stale marking.
      reviewer:
        effort: high
        rationale: The plan changes extension action registration, lifecycle behavior,
          and apply semantics for daemon task results.
  - id: plan-03-workstation-docs
    name: Workstation Recommendation Status UX and Documentation
    depends_on:
      - plan-02-refresh-invalidation
    branch: maintain-recommended-backlog-implementation-order-and-next-work-plan/plan-03-workstation-docs
    build:
      - - implement
        - doc-author
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
        - verify
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Updates the extension-owned React workstation, fixture/mock bridge,
          generated assets, docs, and test configuration while preserving
          iframe/action boundaries.
      tester:
        effort: high
        rationale: This plan adds a new workstation test project and must verify root
          test/type/build gates include it.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a substantial multi-file eforge-plan extension feature
    spanning storage/status metadata, action schemas, lifecycle invalidation,
    planning-task reuse, apply validation, workstation UI, tests, and README
    updates, but the work is tightly coupled around one extension and can be
    planned by a single planner, so excursion is preferred over expedition.
    plan-review-cycle adds a compile-time quality gate for the detailed
    dependency chain. The build runs implementation and planned docs together,
    syncs existing docs, writes and exercises tests, runs the registered
    maintainability validation provider before review, then uses an iterative
    review cycle. Parallel code and api review perspectives focus on
    implementation correctness plus extension action/schema contracts; strict
    evaluation is warranted because stale or invalid recommendations could
    corrupt durable private state.
