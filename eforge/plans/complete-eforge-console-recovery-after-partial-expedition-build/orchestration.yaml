name: complete-eforge-console-recovery-after-partial-expedition-build
description: Complete recovery of the partial Eforge Console build by preserving
  completed feature-branch work, implementing the missing Queue view, and
  integrating side-by-side static serving/package support.
base_branch: main
mode: excursion
validate:
  - pnpm --filter @eforge-build/console-ui type-check
  - pnpm --filter @eforge-build/monitor-ui type-check
  - pnpm --filter @eforge-build/monitor type-check
  - pnpm --filter @eforge-build/console-ui build
  - pnpm --filter @eforge-build/monitor-ui build
  - pnpm --filter @eforge-build/monitor build
  - pnpm test
plans:
  - id: plan-01-recover-completed-console-branch
    name: Recover Completed Console Branch on Current Main
    depends_on: []
    branch: complete-eforge-console-recovery-after-partial-expedition-build/plan-01-recover-completed-console-branch
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan is primarily a branch reconciliation step that must
          preserve existing completed work while resolving any drift from
          current main without broad rewrites.
      reviewer:
        effort: high
        rationale: Review must confirm that completed feature-branch work was preserved,
          not reimplemented or dropped.
  - id: plan-02-queue-view
    name: Implement Read-Only Console Queue View
    depends_on:
      - plan-01-recover-completed-console-branch
    branch: complete-eforge-console-recovery-after-partial-expedition-build/plan-02-queue-view
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-03-static-serving-package-integration
    name: Integrate Console Static Serving and Packaging
    depends_on:
      - plan-01-recover-completed-console-branch
    branch: complete-eforge-console-recovery-after-partial-expedition-build/plan-03-static-serving-package-integration
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes server static routing, path traversal handling,
          package build edges, lockfile state, legacy UI navigation, and docs.
      reviewer:
        effort: high
        rationale: Review must focus on API route priority, traversal containment,
          package-copy behavior, dependency drift, and documentation claims.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - verify
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: Excursion is appropriate because the recovery is bounded to two known
    failed plans plus integration validation, and a single planner can preserve
    the existing branch work while sequencing Queue UI and static/package
    serving changes. A plan review gate is included because the PRD has many
    acceptance criteria and recovery-specific constraints. The build runs
    implementation with documentation authoring in parallel, then syncs docs and
    writes tests before iterative test and review cycles. Review is strict and
    parallel because the work touches static serving, path traversal protection,
    API route priority, package/build wiring, and browser/client contract usage.
