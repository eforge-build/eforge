name: compact-eforge-plan-board-initial-load
description: Remove the remaining hidden rich board payload from eforge-plan
  workstation startup so the compact board read is the only Backlog board data
  source on the hot path.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm exec vitest run
    eforge/extensions/eforge-plan/__tests__/session-plan-actions.test.ts
    eforge/extensions/eforge-plan/workstation-src/plans/src/hooks/use-workstation-data.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/App.test.tsx
    eforge/extensions/eforge-plan/__tests__/registration.test.ts
    test/eforge-plan-workstation.test.ts
plans:
  - id: plan-01-artifact-hot-path
    name: Remove Rich Board Payload From Workstation Artifact Load
    depends_on: []
    branch: compact-eforge-plan-board-initial-load/plan-01-artifact-hot-path
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - validate
    - - test-write
      - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a multi-file workstation migration with adapter logic, lazy
    loading, action registration, tests, and documentation, but a single planner
    can enumerate the required changes, so excursion fits better than
    expedition. Plan review is included because the acceptance criteria are
    broad and regression-sensitive. The build runs implementation with
    documentation authoring, then the required validation provider, test/doc
    updates, review cycles, and test cycles. Code and API review perspectives
    cover UI/data-flow correctness plus action/schema/allowlist contract risk
    without over-expanding review scope.
