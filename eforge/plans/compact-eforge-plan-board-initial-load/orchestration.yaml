name: compact-eforge-plan-board-initial-load
description: Harden the compact eforge-plan board initial-load path so
  open-board pagination and lazy closed-lane pagination remain independent
  without reintroducing rich list-board reads.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm --filter @eforge-build/eforge-plan-workstation type-check
  - pnpm --filter @eforge-build/eforge-plan-workstation test
  - pnpm type-check
  - pnpm test
plans:
  - id: plan-01-compact-pagination-hot-path
    name: Harden Compact Board Pagination Hot Path
    depends_on: []
    branch: compact-eforge-plan-board-initial-load/plan-01-compact-pagination-hot-path
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - validate
      - doc-sync
      - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a multi-file workstation migration with adapter logic,
    hook/data-flow changes, UI behavior, action registration, tests, and docs,
    but it is still one coherent feature rather than independent subsystem work,
    so excursion is appropriate. Plan review is included to catch hot-path and
    lazy-loading scope mistakes before build. The build pipeline runs
    implementation and docs authoring together, then runs the registered
    validation gate plus doc sync and test writing before review. A final test
    cycle verifies the compact initial load, closed-lane pagination, lazy detail
    loading, and registration behavior after review fixes. Code and API
    perspectives are sufficient for the main risks: preserving board behavior
    while changing data contracts and action usage."
