name: complete-host-queue-controls-race-safety-fixes-and-docs
description: Complete host queue priority/removal controls, remediate
  queue-control race-safety bugs, and update docs/generated references.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- test/queue-control-race-safety.test.ts
    test/queue-controls-cli-mcp-pi.test.ts test/prd-queue.test.ts
    test/queue-scheduler-policy.test.ts
    packages/monitor/src/__tests__/routes-queue-control.test.ts
    test/client-no-start-api-helpers.test.ts
    test/browser-queue-control-helpers.test.ts test/pi-no-start-policy.test.ts
  - pnpm maintainability:check
  - pnpm docs:check
plans:
  - id: plan-01-queue-control-race-safety
    name: Queue-Control Race-Safety Remediation
    depends_on: []
    branch: complete-host-queue-controls-race-safety-fixes-and-docs/plan-01-queue-control-race-safety
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Filesystem race fixes require careful lock ownership, re-read, and
          error-mapping changes across queue helpers.
      tester:
        effort: high
        rationale: Regression tests need deterministic race interleavings and must prove
          files are not recreated after moves/deletions.
      reviewer:
        effort: high
        rationale: Review must verify stale located PRD data is never used for root or
          movable mutations.
  - id: plan-02-host-queue-controls
    name: CLI, MCP, and Pi Queue Control Surfaces
    depends_on:
      - plan-01-queue-control-race-safety
    branch: complete-host-queue-controls-race-safety-fixes-and-docs/plan-02-host-queue-controls
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds three host surfaces while preserving semantic client helper
          contracts and Pi no-start policy.
      tester:
        effort: high
        rationale: Host controls need CLI, MCP, and Pi success/error coverage against
          real daemon helpers.
      reviewer:
        effort: high
        rationale: Review must guard against raw daemon body construction and route
          literal drift across host integrations.
  - id: plan-04-queue-control-docs
    name: Queue-Control Documentation and Generated References
    depends_on:
      - plan-02-host-queue-controls
    branch: complete-host-queue-controls-race-safety-fixes-and-docs/plan-04-queue-control-docs
    build:
      - implement
      - review-cycle
    review:
      strategy: single
      perspectives:
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Documentation and generated reference updates span several docs but
          follow established content patterns.
      reviewer:
        effort: medium
        rationale: Docs review must verify shipped-vs-future wording and generated
          reference drift.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - test-write
      - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: "This is a multi-package continuation touching engine race-safety,
    CLI/MCP/Pi host controls, tests, and docs, but the work is tightly scoped
    and sequential enough for a single planner, so excursion is appropriate.
    Plan review is included because the PRD contains strict guardrails and prior
    reviewer-confirmed blockers. Documentation and test authoring are included
    because the work changes public commands/tools and requires new regressions.
    The registered validate gate runs before review. A strict parallel code/API
    review targets the highest risks: race-safe queue file mutation and
    preserving shared client helper contracts."
diff_base_ref: eforge/add-queued-prd-priority-and-removal-controls
