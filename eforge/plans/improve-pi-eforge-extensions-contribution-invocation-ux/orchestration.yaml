name: improve-pi-eforge-extensions-contribution-invocation-ux
description: Improve the native Pi /eforge:extensions contribution invocation
  flow with schema-aware input prompting, no-prompt default/no-input invocation,
  Markdown result rendering, and shared-client schema fallback projection for
  bound host contributions.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test -- extension-contribution
plans:
  - id: plan-01-pi-extension-contribution-ux
    name: Pi Extension Contribution Invocation UX
    depends_on: []
    branch: improve-pi-eforge-extensions-contribution-invocation-ux/plan-01-pi-extension-contribution-ux
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - api
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - test-write
      - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a bounded multi-file Pi UX and shared-client projection
    change, so excursion is appropriate rather than expedition. Plan review is
    included because the work has many acceptance criteria and cross-package
    boundaries. The build runs implementation with optional docs authoring, adds
    focused tests and docs sync, runs the registered maintainability validation
    gate before review, then uses an iterative review cycle and final test
    cycle. Review focuses on code quality and API/host-surface compatibility
    without adding unnecessary security or verify perspectives.
