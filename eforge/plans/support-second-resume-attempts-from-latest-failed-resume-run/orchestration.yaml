name: support-second-resume-attempts-from-latest-failed-resume-run
description: Support repeated compiled-build resume attempts by selecting the
  newest failed build/resume run with plan-state evidence while keeping the
  running-resume guard.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm vitest run test/resume-compiled-build-engine.test.ts
    test/recovery.test.ts test/recovery-recommendation.test.ts
plans:
  - id: plan-01-recovery-run-selection
    name: Update Recovery Event-History Resume Run Selection
    depends_on: []
    branch: support-second-resume-attempts-from-latest-failed-resume-run/plan-01-recovery-run-selection
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - - validate
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a focused engine bug fix with regression coverage, so
    excursion fits: a single planner can cover the recovery event-history
    selection logic and tests. plan-review-cycle is included because resume
    recovery behavior is subtle and acceptance criteria are specific. The build
    runs implementation first, then the required validation provider and test
    writing in parallel, followed by iterative test execution and a review
    cycle. Review focuses on code correctness and test coverage with standard
    strictness."
diff_base_ref: 7d815be8a9230e94e49f5bef6120ba8a18b7c04d
