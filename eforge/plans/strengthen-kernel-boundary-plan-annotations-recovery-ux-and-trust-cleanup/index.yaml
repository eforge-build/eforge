name: strengthen-kernel-boundary-plan-annotations-recovery-ux-and-trust-cleanup
description: Coordinate docs boundary cleanup, eforge-plan annotation revision
  gap hardening, typed recovery UX, and removal of the deprecated
  trustProjectExtensions config field while preserving the kernel/extension
  boundary.
created: 2026-06-19
status: draft
mode: expedition
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm docs:generate
  - pnpm docs:check
  - pnpm test
architecture:
  status: complete
modules:
  docs-boundary-and-eforge-plan-docs:
    description: Refocus public docs/nav/manifest on the kernel boundary, move
      eforge-plan product semantics into optional first-party extension docs,
      and add allowlist-based docs boundary tests without regenerating
      artifacts.
    depends_on: []
    status: pending
  eforge-plan-annotation-revisions:
    description: Audit and close any remaining eforge-plan annotation-driven Revise
      with AI gaps in private storage, actions, source-context snapshotting,
      workstation UI, and tests while preserving existing extension-owned
      behavior.
    depends_on: []
    status: pending
  recovery-contracts-and-engine:
    description: Add client-owned recovery/dispatch-failure contracts and engine
      recovery preflight, dependency classification, explicit repair operations,
      and durable pre-session dispatch failure events.
    depends_on: []
    status: pending
  recovery-daemon-console:
    description: Project recovery contracts through daemon routes/SSE snapshots and
      render failed queue blocker, dependency classification, repair
      confirmation, and Needs attention UX in Console without local wire-shape
      redeclarations.
    depends_on:
      - recovery-contracts-and-engine
    status: pending
  trust-cleanup:
    description: Remove the deprecated extensions.trustProjectExtensions field from
      config schema/types/defaults/compatibility handling, extension loader
      options, monitor/Pi consumers, tests, and active docs references.
    depends_on: []
    status: pending
  generated-reference-artifacts:
    description: Regenerate and verify public docs mirrors, reference docs, JSON
      schemas, and LLM artifacts after source docs, client contracts, and config
      schema changes land.
    depends_on:
      - docs-boundary-and-eforge-plan-docs
      - eforge-plan-annotation-revisions
      - recovery-contracts-and-engine
      - recovery-daemon-console
      - trust-cleanup
    status: pending
