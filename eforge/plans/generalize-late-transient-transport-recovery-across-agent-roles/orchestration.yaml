name: generalize-late-transient-transport-recovery-across-agent-roles
description: Generalize late retryable transport/infrastructure recovery for
  reviewer agents so parseable reviewer output from agent:result.resultText is
  preserved across single and parallel review paths while malformed or
  pre-result failures stay fail-closed.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm vitest run test/agent-wiring.test.ts test/parallel-reviewer.test.ts
    test/reviewer-isolation.test.ts test/build-evaluator-enforcement.test.ts
    test/tester-wiring.test.ts test/retry.test.ts
plans:
  - id: plan-01-reviewer-late-transport-recovery
    name: Reviewer Late Transport Recovery
    depends_on: []
    branch: generalize-late-transient-transport-recovery-across-agent-roles/plan-01-reviewer-late-transport-recovery
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: "Excursion fits this focused engine resilience bug: it touches
    several related reviewer, parallel-reviewer, and test files, but a single
    planner can enumerate the work. Plan review is included to guard fail-closed
    semantics. The build runs implementation, targeted test authoring, test
    execution, the loaded maintainability validation gate before review, then an
    iterative review cycle. Parallel code/test review perspectives target the
    core risks: preserving valid reviewer output without swallowing malformed
    failures and ensuring regression coverage for late transport errors."
