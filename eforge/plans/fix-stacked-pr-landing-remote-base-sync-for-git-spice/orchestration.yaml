name: fix-stacked-pr-landing-remote-base-sync-for-git-spice
description: Fix stacked PR landing so git-spice workflows sync the remote base,
  prove the fetched effective base is contained in HEAD, retry a stale-base
  sync/restack cycle once, and fail closed before PR submission when freshness
  cannot be proven.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test -- stack-runtime-landing
plans:
  - id: plan-01-stacked-pr-landing-freshness
    name: Stacked PR Landing Remote Base Freshness
    depends_on: []
    branch: fix-stacked-pr-landing-remote-base-sync-for-git-spice/plan-01-stacked-pr-landing-freshness
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Landing control flow must preserve existing git-spice provider
          ordering, restack conflict recovery, state persistence, freshness
          retry semantics, and file-size constraints in a 575-line existing
          module.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a focused multi-file engine bugfix with clear seams in
    stacked landing, provider sequencing, tests, and docs, so excursion is
    sufficient. A plan review helps catch fail-closed/retry edge cases before
    implementation. Documentation is updated alongside implementation, tests are
    generated and exercised, and iterative review plus test cycles are warranted
    because the change affects landing correctness and PR submission safety.
