name: fix-removed-queue-coverage-cleanup
description: Fix removed eforge queue item coverage leaks by emitting a
  queue-removal lifecycle signal and synchronizing eforge-plan canonical queue,
  lifecycle, projection, and recommendation state.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-queue-removal-signal
    name: Emit Queue Removal Signal
    depends_on: []
    branch: fix-removed-queue-coverage-cleanup/plan-01-queue-removal-signal
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
  - id: plan-02-eforge-plan-cleanup
    name: Clean Removed Queue Coverage in eforge-plan
    depends_on:
      - plan-01-queue-removal-signal
    branch: fix-removed-queue-coverage-cleanup/plan-02-eforge-plan-cleanup
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The implementation spans canonical SQLite writes, lifecycle evidence,
          projection filtering, and recommendation actionability with several
          non-over-clearing edge cases.
      tester:
        effort: high
        rationale: Regression coverage must exercise SQLite fixtures and multiple
          projection/action surfaces for the same canonical cleanup path.
      reviewer:
        effort: high
        rationale: Review must check that queue cleanup does not erase unrelated build,
          PR, landing, or result evidence.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - validate
    - test-write
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is broad, multi-package bug-fix work spanning daemon queue
    removal, eforge-plan lifecycle/projection logic, shared client contracts,
    CLI/MCP/Pi/Console behavior, and regression tests, but it is still a
    coordinated excursion rather than an expedition because a single planner can
    enumerate the dependency chain and shared cleanup path. The compile pipeline
    adds a plan review gate due to the large acceptance-criteria set and
    projection-drift risk. The build pipeline includes implement, the required
    validation provider gate, generated regression tests, documentation sync for
    public behavior/API references, iterative code review, and an iterative test
    cycle. Strict parallel review with code and test perspectives is appropriate
    because the bug affects durable canonical state, eligibility projections,
    and many regression paths.
