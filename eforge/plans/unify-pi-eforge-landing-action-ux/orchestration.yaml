name: unify-pi-eforge-landing-action-ux
description: Unify Pi eforge landing-action UX across build and autonomous
  playbook flows with a shared branch-aware policy/menu model, typed verbose
  config access, tests, and aligned skill docs.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
plans:
  - id: plan-01-unified-pi-landing-ux
    name: Unified Pi Landing-Action UX
    depends_on: []
    branch: unify-pi-eforge-landing-action-ux/plan-01-unified-pi-landing-ux
    build:
      - test-write
      - - implement
        - doc-author
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Coordinates a shared pure policy model, Pi command flows, typed
          client helpers, tests, and parity-sensitive skill docs across multiple
          packages.
      reviewer:
        effort: high
        rationale: The UX policy must preserve trunk-safety backstops and avoid
          regressions in build/playbook enqueue paths.
      test-writer:
        effort: high
        rationale: Acceptance requires coverage for feature branches, protected trunk,
          opt-in trunk, default inheritance, explicit overrides, and native
          command integration.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a medium-sized cross-cutting feature touching Pi extension
    workflows, shared policy helpers, typed client config access, tests, and
    user-facing docs, but it is still coherent enough for a single planner
    session, so excursion is appropriate. A plan review gate is included to
    catch UX/API drift before implementation. Documentation stages are included
    because build/playbook skill behavior changes. Test-writing and test-cycle
    are included because the PRD explicitly requires coverage for landing policy
    and workflow integration cases. Parallel API and test review perspectives
    focus on shared contracts, enqueue semantics, and required coverage without
    adding unnecessary security or verify review.
