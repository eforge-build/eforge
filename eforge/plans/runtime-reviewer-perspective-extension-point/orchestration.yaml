name: runtime-reviewer-perspective-extension-point
description: Promote registerReviewerPerspective from loader-only provenance to
  a runtime-supported, bounded review-cycle extension point with dynamic
  perspective identifiers, applicability rules, events, observability, examples,
  and docs.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-dynamic-perspective-contracts
    name: Dynamic Perspective Contracts and Schema Foundation
    depends_on: []
    branch: runtime-reviewer-perspective-extension-point/plan-01-dynamic-perspective-contracts
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes shared wire schemas and public TypeScript types
          consumed across engine, client, monitor, and planning code; a thorough
          pass is needed to avoid type drift.
      reviewer:
        effort: high
        rationale: Schema and API compatibility changes affect daemon/client boundaries
          and need careful review.
  - id: plan-02-extension-perspective-runtime
    name: Extension Reviewer Perspective Runtime
    depends_on:
      - plan-01-dynamic-perspective-contracts
    branch: runtime-reviewer-perspective-extension-point/plan-02-extension-perspective-runtime
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan wires a new bounded runtime path through extension
          registration, build context, applicability evaluation, reviewer prompt
          composition, and event emission.
      reviewer:
        effort: high
        rationale: Runtime extension execution is trusted but fail-open; review needs to
          check isolation of read-only contexts, timeout behavior, and event
          schema coverage.
      tester:
        effort: high
        rationale: Runtime behavior depends on git diff snapshots, StubHarness agent
          dispatch, and failure/timeout cases that require targeted tests.
  - id: plan-03-observability-docs-examples
    name: Observability, Management Surfaces, Docs, and Examples
    depends_on:
      - plan-02-extension-perspective-runtime
    branch: runtime-reviewer-perspective-extension-point/plan-03-observability-docs-examples
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
        - api
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: This plan combines management surface shaping and documentation
          updates after runtime behavior is available.
      doc-author:
        effort: high
        rationale: User-facing extension docs and two integration skills must stay in
          sync and accurately describe security, applicability, and runtime
          limits.
      reviewer:
        effort: high
        rationale: Consumer-facing docs and plugin skill changes need review for parity
          and no over-promising of out-of-scope extension capabilities.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
      - docs
      - test
      - security
      - verify
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: "This is a cohesive but cross-cutting feature spanning SDK contracts,
    engine runtime, event schemas, CLI/monitor rendering, tests, examples, and
    docs, so excursion fits better than expedition: a single planner can
    enumerate the sequential contract-to-runtime-to-consumer changes.
    plan-review-cycle is included to catch scope and dependency issues before
    build. The build runs implementation and planned doc authoring in parallel,
    then syncs existing docs while generating tests, followed by test-cycle and
    a full review-cycle. Parallel review with code, API, docs, test, security,
    and verify perspectives is appropriate because the change affects public
    extension APIs, trusted extension execution boundaries, runtime behavior,
    schemas, and user-facing documentation."
