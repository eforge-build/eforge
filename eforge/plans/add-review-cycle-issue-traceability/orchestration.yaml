name: add-review-cycle-issue-traceability
description: Add optional review-cycle issue traceability across shared event
  schemas, engine reviewer/fixer/evaluator contracts, and Console review-cycle
  detail views.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-client-traceability-contract
    name: Client Event Traceability Contract
    depends_on: []
    branch: add-review-cycle-issue-traceability/plan-01-client-traceability-contract
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-02-reviewer-issue-ids
    name: Reviewer Issue ID Assignment
    depends_on:
      - plan-01-client-traceability-contract
    branch: add-review-cycle-issue-traceability/plan-02-reviewer-issue-ids
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Coordinates parser changes, deterministic ID generation, parallel
          review emission, and synthetic issue paths across several engine
          review surfaces.
  - id: plan-03-review-fixer-references
    name: Review-Fixer Issue References
    depends_on:
      - plan-02-reviewer-issue-ids
    branch: add-review-cycle-issue-traceability/plan-03-review-fixer-references
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Adds a new structured agent submission path while preserving legacy
          review-fixer behavior and max-turn continuation semantics.
  - id: plan-04-evaluator-issue-references
    name: Evaluator Verdict Issue References
    depends_on:
      - plan-03-review-fixer-references
    branch: add-review-cycle-issue-traceability/plan-04-evaluator-issue-references
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Touches evaluator schemas, XML fallback parsing, tool submissions,
          build-stage emission, and feedback loops while retaining strict
          evaluator coverage checks.
  - id: plan-05-console-linked-traces
    name: Console Linked Review-Cycle Traces
    depends_on:
      - plan-04-evaluator-issue-references
    branch: add-review-cycle-issue-traceability/plan-05-console-linked-traces
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a multi-package feature spanning shared event schemas, engine
    contracts, prompts, evaluator/fixer propagation, Console
    projection/rendering, generated docs, and tests, but it is coordinated
    around a shared additive schema change rather than independent subsystem
    planning, so excursion is appropriate. The plan-review-cycle adds planning
    quality for the cross-cutting compatibility work. Build includes
    documentation sync and test generation because the PRD changes public wire
    contracts and requires broad coverage. The registered validate provider runs
    after implementation/test/doc authoring and before review. Parallel api and
    test review perspectives focus on backward-compatible event contracts and
    required traceability coverage without unnecessary security review.
