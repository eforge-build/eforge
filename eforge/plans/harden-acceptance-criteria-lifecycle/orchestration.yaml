name: harden-acceptance-criteria-lifecycle
description: Harden acceptance criteria lifecycle with enqueue-time structured
  extraction, persisted canonical inventories, and final unknown-resolution
  evidence collection.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm vitest run test/acceptance-criteria-extractor.test.ts
    test/acceptance-criteria-quality.test.ts
    test/acceptance-unknown-resolver.test.ts test/prd-validator.test.ts
    test/prd-validate-phase.test.ts test/engine-enqueue-after-queue-id.test.ts
    test/orchestration-validation-gates.test.ts
  - pnpm maintainability:check
plans:
  - id: plan-01-canonical-ac-inventory
    name: Canonical Acceptance Criteria Inventory
    depends_on: []
    branch: harden-acceptance-criteria-lifecycle/plan-01-canonical-ac-inventory
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Cross-cutting engine lifecycle change across enqueue, queue
          persistence, compile/build handoff, and tests while keeping oversized
          files under no-growth ceilings.
      tester:
        effort: high
        rationale: Requires targeted fail-closed regression coverage for extractor
          parsing, queue writes, prompt stripping, and PRD build inventory
          loading.
  - id: plan-02-unknown-resolution
    name: Acceptance Unknown Resolution
    depends_on:
      - plan-01-canonical-ac-inventory
    branch: harden-acceptance-criteria-lifecycle/plan-02-unknown-resolution
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds a guarded read-only evidence pass in the final validation gate
          and must preserve fail-closed semantics.
      reviewer:
        effort: high
        rationale: The resolver may inspect files and request commands, so review must
          examine command auditing, dirty-worktree failure, and acceptance gate
          interactions.
      tester:
        effort: high
        rationale: Needs phase-level coverage for trigger/no-trigger paths, malformed
          output, dirty worktree, and crash handling.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - validate
    - test-write
    - test-cycle
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: "This is a cohesive but cross-cutting engine lifecycle change, so
    excursion fits better than expedition: one planner can sequence extractor
    persistence, build consumption, resolver behavior, and tests without
    delegated module planning. Plan review is included because the flow is
    high-risk and touches validation gates. Build includes docs and test stages
    due explicit documentation and Vitest requirements, plus validate because an
    eforge guardrail provider is loaded. Strict parallel review with code and
    security perspectives is warranted because the change affects fail-closed
    validation, persisted evidence, agent outputs, and read-only command/tool
    execution safeguards."
