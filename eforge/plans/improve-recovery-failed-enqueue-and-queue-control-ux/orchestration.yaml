name: improve-recovery-failed-enqueue-and-queue-control-ux
description: Improve recovery guidance patching, failed-enqueue attention and
  re-enqueue, and safer queue hold/pause/cascade/cancel control UX.
created: 2026-06-19
compiled: 2026-06-19
mode: expedition
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-client-contracts
    name: Client-owned wire contracts, route constants, helpers, event/snapshot
      schemas, queue capability types, failed-enqueue types, and API version
      bump.
    depends_on: []
    branch: improve-recovery-failed-enqueue-and-queue-control-ux/client-contracts
    build: &a1
      - - implement
        - doc-author
      - - doc-sync
        - test-write
      - validate
      - test-cycle
      - review-cycle
    review: &a2
      strategy: parallel
      perspectives:
        - api
        - security
      maxRounds: 3
      evaluatorStrictness: strict
  - id: plan-02-engine-queue-controls
    name: Engine queue hold/unhold, scheduler held gating, cascade preview/apply
      primitives, capabilities, and PRD-owned cancellation helpers.
    depends_on:
      - plan-01-client-contracts
    branch: improve-recovery-failed-enqueue-and-queue-control-ux/engine-queue-controls
    build: *a1
    review: *a2
  - id: plan-03-engine-recovery-guidance
    name: Idempotent root-only Recovery Guidance patching for compiled plan
      artifacts and continue/resume integration.
    depends_on:
      - plan-01-client-contracts
    branch: improve-recovery-failed-enqueue-and-queue-control-ux/engine-recovery-guidance
    build: *a1
    review: *a2
  - id: plan-04-daemon-routes-projections
    name: Monitor routes, recorder/projection changes, auto-build pause/resume
      wiring, failed-enqueue re-enqueue, queue capability projection, and
      snapshot/live parity.
    depends_on:
      - plan-01-client-contracts
      - plan-03-engine-recovery-guidance
      - plan-02-engine-queue-controls
    branch: improve-recovery-failed-enqueue-and-queue-control-ux/daemon-routes-projections
    build: *a1
    review: *a2
  - id: plan-05-console-ux
    name: Now dashboard failed-enqueue attention, re-enqueue UX,
      held/capability-driven queue controls, scheduler pause/resume, and cascade
      preview confirmations.
    depends_on:
      - plan-01-client-contracts
      - plan-04-daemon-routes-projections
    branch: improve-recovery-failed-enqueue-and-queue-control-ux/console-ux
    build: *a1
    review: *a2
  - id: plan-06-docs-validation
    name: Console/client documentation updates and final validation alignment for
      the new recovery and queue-control UX.
    depends_on:
      - plan-05-console-ux
    branch: improve-recovery-failed-enqueue-and-queue-control-ux/docs-validation
    build: *a1
    review: *a2
pipeline:
  scope: expedition
  compile:
    - planner
    - architecture-review-cycle
    - module-planning
    - cohesion-review-cycle
    - compile-expedition
  defaultBuild: *a1
  defaultReview: *a2
  rationale: This is expedition-scale work spanning client-owned route contracts,
    engine recovery patching, queue scheduler/control semantics, daemon
    projections/routes, Console UI, tests, and documentation. Architecture and
    module planning are warranted to coordinate shared contracts and subsystem
    boundaries before implementation. Documentation and tests are first-class
    acceptance criteria, so doc-author/doc-sync, test-write, and test-cycle are
    included. The registered maintainability validation provider runs after
    implementation/test/doc generation and before review. Parallel API and
    security review is appropriate because the work adds mutating daemon
    endpoints, route validation/security requirements, queue
    cancellation/removal semantics, and public wire contracts.
