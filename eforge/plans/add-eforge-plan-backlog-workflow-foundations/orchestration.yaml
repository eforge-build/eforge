name: add-eforge-plan-backlog-workflow-foundations
description: Add extension-owned recommendation storage, multi-source backlog
  promotion, and planner orchestration foundations to eforge-plan without
  changing engine build intake.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm vitest run eforge/extensions/eforge-plan/__tests__
plans:
  - id: plan-01-recommendations
    name: Recommendation Store and Board Projection
    depends_on: []
    branch: add-eforge-plan-backlog-workflow-foundations/plan-01-recommendations
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-02-promotion-selection
    name: Multi-Source and Epic Promotion
    depends_on:
      - plan-01-recommendations
    branch: add-eforge-plan-backlog-workflow-foundations/plan-02-promotion-selection
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
  - id: plan-03-planner-orchestration-workstation
    name: Planner Orchestration Actions and Workstation Controls
    depends_on:
      - plan-02-promotion-selection
    branch: add-eforge-plan-backlog-workflow-foundations/plan-03-planner-orchestration-workstation
    build:
      - implement
      - - test-cycle
        - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - test-cycle
    - doc-sync
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is cohesive cross-cutting extension work rather than independent
    subsystem work, so excursion is appropriate. A planner plus
    plan-review-cycle fits the contract-heavy scope without expedition overhead.
    The build pipeline runs implementation and planned README documentation in
    parallel, adds targeted tests, executes test iterations, syncs docs after
    code/test changes, runs the registered validation provider gate before
    review, then uses an iterative review cycle. Review focuses on code quality
    and public extension/action API contracts with standard strictness.
