name: harden-eforge-build-validation-gates
description: Harden eforge build validation gates so success requires explicit
  command, PRD/acceptance, gap-close, review-contract, and committed-work
  evidence before artifact recording or landing.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- packages/client/src/__tests__/events-schemas.test.ts
    packages/client/src/__tests__/events-wire-parity.test.ts
    test/prd-validator.test.ts test/prd-validator-fail-closed.test.ts
    test/prd-validate-phase.test.ts test/gap-closer.test.ts
    test/orchestration-logic.test.ts test/validate-phase-timeout.test.ts
    test/stack-artifact-recording.test.ts test/xml-parsers.test.ts
    test/review-cycle-adaptive.test.ts test/build-evaluator-enforcement.test.ts
    test/reviewer-verify.test.ts test/agent-wiring.test.ts
    test/worktree-manager.test.ts
  - pnpm docs:check
plans:
  - id: plan-01-validation-evidence-contract
    name: Validation Evidence Contract and PRD Validator Output
    depends_on: []
    branch: harden-eforge-build-validation-gates/plan-01-validation-evidence-contract
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds client-owned event schema variants and changes PRD validator
          structured output, which requires synchronized type exports, event
          registry updates, prompt changes, and tests.
      reviewer:
        effort: high
        rationale: Wire-protocol changes and fail-closed validator semantics require API
          and test-focused review.
      tester:
        effort: high
        rationale: Existing PRD validator and event parity fixtures encode old behavior
          and need focused regression coverage.
  - id: plan-02-final-validation-gates
    name: Final Validation Gates, Waivers, and Gap-Close Reruns
    depends_on:
      - plan-01-validation-evidence-contract
    branch: harden-eforge-build-validation-gates/plan-02-final-validation-gates
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: xhigh
        rationale: This plan changes core orchestrator success semantics, config schema,
          gap-close control flow, PRD closure fail-closed behavior, and
          artifact-recording ordering.
      reviewer:
        effort: high
        rationale: Final build status and artifact safety require careful code, API, and
          test review.
      tester:
        effort: high
        thinking:
          type: enabled
          budgetTokens: 8000
        rationale: Gap-close rerun behavior and no-artifact-on-failure tests require
          multi-phase event assertions.
  - id: plan-03-reviewer-contract-hardening
    name: Reviewer Contract Hardening
    depends_on:
      - plan-02-final-validation-gates
    branch: harden-eforge-build-validation-gates/plan-03-reviewer-contract-hardening
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Reviewer parser behavior is used by single, parallel, and extension
          perspectives; changing fail-open semantics requires fixture updates
          across several build-cycle tests.
      reviewer:
        effort: high
        rationale: Agent contract hardening must not break dynamic perspectives or
          review-cycle termination semantics.
      tester:
        effort: high
        rationale: Many existing tests use empty review XML stubs and need targeted
          updates to distinguish valid empty output from invalid contract
          output.
  - id: plan-04-committed-work-artifact-safety
    name: Committed Work Enforcement and Artifact Safety
    depends_on:
      - plan-03-reviewer-contract-hardening
    branch: harden-eforge-build-validation-gates/plan-04-committed-work-artifact-safety
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Git worktree state checks affect merge semantics and artifact
          recording, including the single-plan builtOnMerge path.
      reviewer:
        effort: high
        rationale: Worktree merge behavior needs careful review to avoid false positives
          that block valid builds.
      tester:
        effort: high
        thinking:
          type: enabled
          budgetTokens: 6000
        rationale: Tests need real git repositories and artifact registry assertions
          around dirty tracked and untracked work.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - test-cycle
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
      - test
      - verify
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a deep, cross-cutting validation-hardening effort touching
    engine orchestration, client-owned event schemas, agent prompt/parser
    contracts, tests, and docs, but a single planner can enumerate the ordered
    slices and dependencies, so excursion is preferable to expedition.
    plan-review-cycle is included to catch scope and sequencing mistakes before
    implementation. The build pipeline includes implementation with
    documentation authoring, generated/updated tests, iterative test execution,
    doc synchronization, and a strict review cycle because the PRD changes core
    success/failure semantics and public contracts. Review uses code, api, test,
    and verify perspectives because the work changes wire/event contracts,
    validation behavior, test infrastructure, and build validation gates.
