name: close-stacked-pr-follow-up-gaps
description: Close stacked PR follow-up gaps across artifact metadata
  finalization, completed dependency diagnostics, generated docs, integration
  guidance, and landing vocabulary.
base_branch: main
mode: excursion
validate:
  - node scripts/check-skill-parity.mjs
  - pnpm type-check
  - pnpm docs:check
  - pnpm vitest run test/artifact-registry.test.ts
    test/stack-artifact-recording.test.ts test/stack-landing-cleanup.test.ts
    test/artifact-aware-scheduler.test.ts test/queue-piggyback.test.ts
    test/docs-gen-determinism.test.ts test/pi-landing-policy.test.ts
    test/pi-trunk-landing-policy.test.ts test/cli-landing-options.test.ts
    test/onsuccess-config.test.ts test/prd-frontmatter-onsuccess.test.ts
plans:
  - id: plan-01-runtime-artifact-diagnostics
    name: Runtime Artifact Finalization and Completion Diagnostics
    depends_on: []
    branch: close-stacked-pr-follow-up-gaps/plan-01-runtime-artifact-diagnostics
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Touches artifact registry lifecycle, queue scheduling, and landing
          flows with ordering-sensitive state updates.
      tester:
        effort: high
        rationale: Requires targeted tests covering registry mutation, landing cleanup
          ordering, and dependency diagnostics across queue states.
  - id: plan-02-docs-integration-vocabulary
    name: Docs, Skills, and Landing Vocabulary Alignment
    depends_on: []
    branch: close-stacked-pr-follow-up-gaps/plan-02-docs-integration-vocabulary
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Mostly source/docs alignment plus a contained Pi type rename across a
          small integration surface.
      doc-author:
        effort: medium
        rationale: Consumer-facing Pi and Claude skill guidance plus generated docs
          wording need synchronized updates.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - docs
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is cross-cutting but bounded work across engine runtime state,
    generated docs, CLI/Pi/Claude integration text, and tests, so excursion fits
    better than expedition. A planner plus plan-review-cycle should produce a
    coherent ordered plan without delegated module planning. The build runs
    implementation and planned documentation authoring together, then syncs
    existing docs and writes tests before iterative review and final test
    cycling. Parallel code/docs review targets the main risks:
    artifact/dependency correctness and stale user-facing guidance."
