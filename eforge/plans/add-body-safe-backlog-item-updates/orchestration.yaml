name: add-body-safe-backlog-item-updates
description: Add body-safe backlog item updates to eforge-plan update-item with
  optimistic locking, section patching, versioned read/write outputs, storage
  consistency, and documentation updates.
base_branch: eforge/eforge-plan-workstation-ux-polish
mode: excursion
validate:
  - pnpm type-check
  - pnpm vitest run
    eforge/extensions/eforge-plan/__tests__/item-body-sections.test.ts
    eforge/extensions/eforge-plan/__tests__/update-item-body-safe.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-query-actions.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-storage-migration.test.ts
    eforge/extensions/eforge-plan/__tests__/sqlite-canonical-backlog-writes.test.ts
    eforge/extensions/eforge-plan/__tests__/recommendation-invalidation.test.ts
    eforge/extensions/eforge-plan/__tests__/registration.test.ts
    eforge/extensions/eforge-plan/__tests__/readme-contract.test.ts
    eforge/extensions/eforge-plan/__tests__/docs-validation-contract.test.ts
  - pnpm docs:check
  - pnpm maintainability:check
plans:
  - id: plan-01-body-safe-update-action
    name: Body-safe update-item action and canonical storage
    depends_on: []
    branch: add-body-safe-backlog-item-updates/plan-01-body-safe-update-action
    build:
      - test-write
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Extends an agent-facing mutation API across schemas, canonical
          storage helpers, Markdown section rendering, optimistic locks,
          projections, and focused tests.
      reviewer:
        effort: high
        rationale: The mutation boundary needs careful review for locking, storage
          consistency, and backward compatibility.
  - id: plan-02-agent-docs-and-guidance
    name: Agent workflow docs and guidance for body-safe updates
    depends_on:
      - plan-01-body-safe-update-action
    branch: add-body-safe-backlog-item-updates/plan-02-agent-docs-and-guidance
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a substantial but cohesive eforge-plan feature touching
    action schemas, canonical storage helpers, projections, tests, and
    documentation. A single planner can decompose the sequential
    storage/API/docs/test work, so excursion is appropriate rather than
    expedition. Plan review is included because the PRD has many compatibility
    and consistency constraints. Documentation authoring and sync are included
    for user-facing workflow guidance, test generation and test execution are
    included for the extensive validation requirements, and the loaded
    maintainability validation provider is run before review. Parallel code and
    API review with strict evaluation fits the optimistic-locking and
    storage-consistency risk.
