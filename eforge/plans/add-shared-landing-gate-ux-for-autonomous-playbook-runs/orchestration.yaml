name: add-shared-landing-gate-ux-for-autonomous-playbook-runs
description: Add shared landing-gate UX for autonomous playbook runs and
  propagate playbook onSuccess through daemon/API/tool surfaces.
base_branch: chore/update-eforge-config
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
plans:
  - id: plan-01-playbook-onsuccess-api
    name: Playbook Run onSuccess API Propagation
    depends_on: []
    branch: add-shared-landing-gate-ux-for-autonomous-playbook-runs/plan-01-playbook-onsuccess-api
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
  - id: plan-02-shared-pi-landing-gate
    name: Shared Pi Landing Gate UX for Build and Playbook Run
    depends_on:
      - plan-01-playbook-onsuccess-api
    branch: add-shared-landing-gate-ux-for-autonomous-playbook-runs/plan-02-shared-pi-landing-gate
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a multi-package feature touching Pi UX, shared helper logic,
    client/daemon API propagation, MCP/plugin schemas, docs, and tests, but a
    single planner can enumerate the required plans and dependencies, so
    excursion is appropriate. A plan review gate helps catch cross-surface drift
    before implementation. Documentation and tests are explicitly required, so
    doc-author/doc-sync, test-write, and test-cycle are included. Parallel API
    and test review perspectives focus on the highest-risk areas: route/schema
    compatibility and propagation coverage."
