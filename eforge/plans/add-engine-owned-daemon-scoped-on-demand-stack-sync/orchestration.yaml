name: add-engine-owned-daemon-scoped-on-demand-stack-sync
description: Add engine/daemon-owned on-demand stack sync with daemon-scoped
  execution, active-build deferral, durable status, safe client surfaces,
  console visibility, provider-boundary cleanup, and updated docs.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm docs:check
  - pnpm test
plans:
  - id: plan-01-core-daemon-stack-sync
    name: Core Daemon-Owned Stack Sync
    depends_on: []
    branch: add-engine-owned-daemon-scoped-on-demand-stack-sync/plan-01-core-daemon-stack-sync
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Cross-package API, daemon concurrency, durable state,
          provider-boundary refactor, and safety semantics require careful
          coordinated changes.
      reviewer:
        effort: high
        rationale: Review must verify subprocess safety, daemon cwd ownership,
          event/wire compatibility, and provider-boundary discipline.
      tester:
        effort: high
        rationale: Tests must cover concurrent route behavior, active-build deferral,
          agent-worktree safety, event schemas, and provider-boundary regression
          gates.
  - id: plan-02-client-surfaces-and-console
    name: Client Surfaces and Console Stack Sync Visibility
    depends_on:
      - plan-01-core-daemon-stack-sync
    branch: add-engine-owned-daemon-scoped-on-demand-stack-sync/plan-02-client-surfaces-and-console
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Updates span CLI/MCP/Pi/console UX and must stay synchronized with
          shared route/event types without reintroducing unsafe local sync
          patterns.
      reviewer:
        effort: high
        rationale: Review must verify consumer-facing safety semantics, Pi/Claude
          parity, and console route discipline.
  - id: plan-03-docs-and-workflow-guidance
    name: Documentation and Workflow Guidance
    depends_on:
      - plan-02-client-surfaces-and-console
    branch: add-engine-owned-daemon-scoped-on-demand-stack-sync/plan-03-docs-and-workflow-guidance
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - code
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Mostly documentation and generated-reference updates, with care
          needed to keep plugin/Pi guidance and generated docs in sync.
      doc-author:
        effort: high
        rationale: User-facing docs must replace unsafe automation guidance with precise
          daemon-owned sync, deferred retry, and after-build trigger semantics.
      reviewer:
        effort: medium
        rationale: Review should focus on docs parity, plugin version bump, and absence
          of unsafe postMergeCommands recommendations.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - security
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a cohesive cross-cutting feature spanning engine, daemon,
    client routes, CLI/Pi/plugin surfaces, docs, and UI visibility, but a single
    planner can enumerate the dependent plans, so excursion is appropriate
    rather than expedition. A plan review cycle is included because correctness
    and safety boundaries are central. Build includes implementation plus
    documentation authoring/sync and generated tests because the PRD changes
    public APIs, user-facing behavior, and docs. Review uses API and security
    perspectives due to daemon/client wire changes, subprocess/git command
    execution, cwd safety, and lock/mutex behavior, with strict evaluation for
    the safety-critical fallback and concurrency requirements.
diff_base_ref: 9a3b1cedeab0fff45d2f56c38ddac2f48528db7d
