name: session-plan-agent-profile-select
description: Bounded planner compiler artifacts for session-plan-agent-profile-select
base_branch: main
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
  - pnpm maintainability:check
plans:
  - id: client-profile-contract
    name: Profile route/type source-of-truth contract
    depends_on: []
    branch: session-plan-agent-profile-select/client-profile-contract
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: eforge-plan-profile-options-action
    name: Read-only eforge-plan profile options action
    depends_on:
      - client-profile-contract
    branch: session-plan-agent-profile-select/eforge-plan-profile-options-action
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
  - id: session-plan-agent-profile-select
    name: Session plan agent profile select UI and persistence
    depends_on:
      - eforge-plan-profile-options-action
    branch: session-plan-agent-profile-select/session-plan-agent-profile-select
    build:
      - implement
      - doc-sync
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  compile:
    - planner
    - planning-quality-review-cycle
  defaultBuild:
    - implement
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: >-
    Bounded planner compiler pipeline

    Bounded planner compiler produced final plan artifacts directly.

    Per-plan pipeline settings derived deterministically from compiler risk
    signals.

    Set-level defaults follow the highest plan risk score (3).

    - client-profile-contract: risk score 3 (large-plan,
    low-confidence-localization, dependency-root); declared docs work
    sync-existing, test work author-new; derived build implement -> doc-sync ->
    test-write -> test-cycle -> review-cycle and parallel review with
    perspectives code, security, test, verify, 2 round(s), strict evaluation

    - eforge-plan-profile-options-action: risk score 3 (large-plan,
    low-confidence-localization, dependency-root); declared docs work
    sync-existing, test work author-new; derived build implement -> doc-sync ->
    test-write -> test-cycle -> review-cycle and parallel review with
    perspectives code, security, test, verify, 2 round(s), strict evaluation

    - session-plan-agent-profile-select: risk score 2 (large-plan,
    low-confidence-localization); declared docs work sync-existing, test work
    author-new; derived build implement -> doc-sync -> test-write -> test-cycle
    -> review-cycle and auto review with perspectives code, test, 1 round(s),
    standard evaluation
