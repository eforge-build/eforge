name: dry-plan-presentation-metadata-and-overflow-safe-console-pipeline-labels
description: Bounded planner compiler artifacts for
  dry-plan-presentation-metadata-and-overflow-safe-console-pipeline-labels
base_branch: eforge/keep-eforge-plan-search-index-clean-after-read-only-workstation-refresh
validate: []
plans:
  - id: console-plan-presentation-and-id-compatibility
    name: Console plan presentation and ID compatibility
    depends_on: []
    branch: dry-plan-presentation-metadata-and-overflow-safe-console-pipeline-labels/console-plan-presentation-and-id-compatibility
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
    test_ownership: builder
  - id: console-plan-presentation-acceptance-tests
    name: Console plan presentation acceptance coverage
    depends_on:
      - console-plan-presentation-and-id-compatibility
    branch: dry-plan-presentation-metadata-and-overflow-safe-console-pipeline-labels/console-plan-presentation-acceptance-tests
    build:
      - implement
      - test-write
      - test-cycle
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - test
      maxRounds: 1
      evaluatorStrictness: standard
    test_ownership: test-writer
pipeline:
  compile:
    - planner
    - planning-quality-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: auto
    perspectives:
      - code
      - test
    maxRounds: 1
    evaluatorStrictness: standard
  rationale: >-
    Bounded planner compiler pipeline

    Bounded planner compiler produced final plan artifacts directly.

    Per-plan pipeline settings normalize typed model intent against
    deterministic compiler safety signals.

    Set-level review follows the deepest normalized review; build defaults
    follow the broadest normalized plan pipeline (highest risk score 0).

    - console-plan-presentation-acceptance-tests: no risk factors; declared docs
    work none, test work author-new, test owner test-writer; model review intent
    standard (Independent ownership follows the explicit cross-scenario
    acceptance boundary; review should check realistic precedence fixtures and
    robust layout assertions rather than brittle snapshots.); derived build
    implement -> test-write -> test-cycle -> review-cycle and auto review with
    perspectives code, test, 1 round(s), standard evaluation

    - console-plan-presentation-and-id-compatibility: risk score 0
    (dependency-root); declared docs work none, test work author-new, test owner
    builder; model review intent standard (Review must trace asynchronous
    metadata precedence, presentation-versus-identity boundaries, client-owned
    routes, ordering, and CSS shrink behavior.); derived build implement ->
    test-cycle -> review-cycle and auto review with perspectives code, test, 1
    round(s), standard evaluation
