name: reduce-extension-tool-dispatch-complexity
description: Refactor duplicated MCP and Pi eforge_extension action validation
  and dispatch into shared client helpers while preserving schemas, messages,
  routes, and helper usage.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test -- test/extension-tooling-wiring.test.ts
plans:
  - id: plan-01-shared-extension-dispatch
    name: Shared eforge_extension Dispatcher
    depends_on: []
    branch: reduce-extension-tool-dispatch-complexity/plan-01-shared-extension-dispatch
    build:
      - implement
      - validate
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - validate
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a multi-file refactor across shared client helpers, MCP
    proxy, Pi extension, and existing tests, but a single planner can enumerate
    the required changes, so excursion is appropriate. A plan review is useful
    because behavior and validation-message parity must be preserved. The build
    includes test-writing/updating and a test cycle because the PRD explicitly
    requires test coverage and command validation. The loaded maintainability
    validation provider requires the validate stage after implementation and
    before review. Parallel code/API review targets the main risks: shared
    dispatcher correctness, exports, dependency boundaries, and preserving
    public tool behavior."
