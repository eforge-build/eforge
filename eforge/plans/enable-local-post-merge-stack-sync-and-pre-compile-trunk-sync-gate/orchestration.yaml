name: enable-local-post-merge-stack-sync-and-pre-compile-trunk-sync-gate
description: Add a non-mutating pre-compile trunk sync gate for queued root
  builds so stale local trunk refs do not become new build bases.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm docs:check
  - pnpm test
plans:
  - id: plan-01-pre-compile-trunk-sync-gate
    name: Pre-Compile Trunk Sync Gate
    depends_on: []
    branch: enable-local-post-merge-stack-sync-and-pre-compile-trunk-sync-gate/plan-01-pre-compile-trunk-sync-gate
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The implementation coordinates config parsing, git fetch/merge-base
          behavior, queue compile-base selection, tests with real repositories,
          and user-facing docs.
      reviewer:
        effort: high
        rationale: Review needs extra attention to non-mutating git guarantees and
          configured remote/ref subprocess handling.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a cohesive multi-file engine feature touching config
    schema/defaults, git base-selection behavior, queue compile integration,
    tests, and docs, so excursion fits better than expedition. Plan review is
    included to catch boundary mistakes around root vs child stacked builds and
    non-mutating trunk behavior. The build pipeline implements code and docs
    together, syncs existing docs, adds tests, then runs iterative test and
    review cycles. API-focused review is warranted because the change adds
    public config and possibly event surface behavior; code review covers the
    git/worktree integration and non-mutating guarantees.
