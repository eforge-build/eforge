name: make-monitor-ui-auto-build-toggle-safer
description: Make the monitor UI auto-build toggle safer by preventing
  label-text clicks from toggling it, requiring confirmation before enabling,
  and moving the hook/callers to an explicit setEnabled API.
base_branch: main
mode: excursion
validate:
  - pnpm --filter @eforge-build/monitor-ui test
  - pnpm type-check
plans:
  - id: plan-01-safer-auto-build-toggle
    name: Safer Monitor UI Auto-build Toggle
    depends_on: []
    branch: make-monitor-ui-auto-build-toggle-safer/plan-01-safer-auto-build-toggle
    build:
      - test-write
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - api
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - review-cycle
    - test-cycle
    - validate
  defaultReview:
    strategy: auto
    perspectives:
      - code
      - api
      - test
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a moderate UI behavior and hook API change across a few
    monitor-ui files with explicit test requirements, so excursion is
    appropriate. A plan review helps catch accessibility and stale-toggle risks
    before build. The build pipeline implements the change, adds/updates focused
    tests, performs iterative review, then runs test validation. Review
    perspectives emphasize code quality, internal API updates, test coverage,
    and verification of the safer enable-confirmation behavior.
