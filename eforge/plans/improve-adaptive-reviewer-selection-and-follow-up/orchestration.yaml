name: improve-adaptive-reviewer-selection-and-follow-up
description: Improve adaptive reviewer selection and follow-up so inferred
  reviewer sets are risk-budgeted, follow-up rounds are targeted or skipped
  after accepted fixes, and decision rationale explains kept/dropped/terminated
  outcomes.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm vitest run test/review-heuristics.test.ts
    test/review-cycle-perspectives.test.ts test/review-cycle-adaptive.test.ts
    test/sharded-build-via-review-cycle.test.ts test/decisions.test.ts
    packages/monitor-ui/src/lib/reducer/__tests__/handle-decisions.test.ts
  - pnpm test
plans:
  - id: plan-01-adaptive-review-policy
    name: Risk-Budgeted Adaptive Review Selection
    depends_on: []
    branch: improve-adaptive-reviewer-selection-and-follow-up/plan-01-adaptive-review-policy
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Cross-cutting engine orchestration behavior changes require careful
          coordination between inference, review-cycle continuation policy, and
          existing sharded verify safety guarantees.
      tester:
        effort: high
        rationale: The plan depends on multiple selector and integration scenarios,
          including regression coverage for sharded verify behavior and event
          rationale output.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
      - security
      - verify
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a focused but cross-cutting engine behavior correction
    touching reviewer heuristics, review-cycle orchestration, decision
    observability, and tests, so excursion is appropriate rather than
    expedition. A plan-review-cycle is included to guard scope and safety policy
    details before implementation. The build pipeline emphasizes implementation,
    new/updated tests, iterative test validation, and a review-cycle because the
    acceptance criteria require selector, adaptive-cycle, sharded, and
    decision-format coverage. Review uses code, test, security, and verify
    perspectives with strict evaluation because the change affects automated
    quality gates and must reduce reviewer budget without weakening security or
    sharded-build verification safety.
