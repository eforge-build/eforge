name: add-extension-packaging-and-install-support
description: Add packaged native extension manifest,
  install/update/remove/promote/demote support, provenance, and parity across
  CLI, MCP, Pi, docs, and tests.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-extension-package-foundation
    name: Extension Package Manifest and Provenance Foundation
    depends_on: []
    branch: add-extension-packaging-and-install-support/plan-01-extension-package-foundation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes discovery identity/entrypoint resolution and shared
          wire contracts; careful compatibility work is required.
      reviewer:
        effort: high
        rationale: Review needs to verify backward compatibility, API shape consistency,
          and manifest validation edge cases.
  - id: plan-02-extension-package-daemon-operations
    name: Daemon Extension Package Operations
    depends_on:
      - plan-01-extension-package-foundation
    branch: add-extension-packaging-and-install-support/plan-02-extension-package-daemon-operations
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - api
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Package acquisition and filesystem mutation are security-sensitive
          and require collision, trust, and path-safety handling.
      reviewer:
        effort: high
        rationale: Review must inspect supply-chain safeguards, path traversal defenses,
          and trust-record semantics.
      tester:
        effort: high
        rationale: Route tests need real filesystem and git behavior for install,
          update, removal, promote, demote, and trust-state transitions.
  - id: plan-03-extension-package-surfaces-docs
    name: Extension Package CLI, MCP, Pi, and Documentation
    depends_on:
      - plan-02-extension-package-daemon-operations
    branch: add-extension-packaging-and-install-support/plan-03-extension-package-surfaces-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
        - docs
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      reviewer:
        effort: high
        rationale: Surface parity and documentation changes cross CLI, MCP, Pi, plugin
          skills, and generated docs.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - review-cycle
    - test-cycle
    - validate
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
      - api
      - docs
      - test
      - verify
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a cohesive but multi-package feature touching engine
    discovery/provenance, shared client routes, daemon handlers, CLI/MCP/Pi
    surfaces, docs, and tests. A single planner can enumerate the dependent
    slices, so excursion is appropriate rather than expedition. Plan review is
    included because the work has broad user-facing API and trust/security
    implications. Documentation and tests are first-class acceptance criteria,
    so doc-author runs alongside implementation, followed by doc-sync and test
    writing. Iterative review and test cycles are included to catch API drift,
    trust regressions, data-loss risks, and consumer-surface parity issues.
    Strict parallel review is warranted because package installation/update
    involves unsandboxed code, supply-chain risk, filesystem mutation, and
    public API/CLI behavior.
