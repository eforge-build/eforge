name: complete-first-class-stacked-pr-and-git-spice-support
description: Complete first-class stacked PR and git-spice support by replacing
  non-trunk PR aggregation with direct head-to-base publication, wiring
  git-spice into stacked runtime landing, persisting stack landing state,
  exposing stack layers in daemon/client/UI, updating consumer integrations and
  docs, and finalizing repo dogfooding config.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
  - pnpm docs:check
plans:
  - id: plan-01-direct-pr-landing
    name: Replace Non-Trunk PR Aggregation with Direct PR Landing
    depends_on: []
    branch: complete-first-class-stacked-pr-and-git-spice-support/plan-01-direct-pr-landing
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes core landing semantics and shared event workflow
          literals used by tests and generated docs.
      reviewer:
        effort: high
        rationale: Review must verify the old aggregation path is fully removed from
          runtime and tests.
  - id: plan-02-stack-provider-runtime
    name: Wire git-spice Runtime Landing and Durable Stack State
    depends_on:
      - plan-01-direct-pr-landing
    branch: complete-first-class-stacked-pr-and-git-spice-support/plan-02-stack-provider-runtime
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: xhigh
        rationale: This plan coordinates provider subprocess execution, stack state
          mutation, orchestrator lifecycle ordering, and event emission.
      reviewer:
        effort: high
        rationale: Review must check subprocess argv safety, failure ordering, and
          state/event consistency.
  - id: plan-03-stack-daemon-ui
    name: Expose Stack Layers through Client, Daemon, and Monitor UI
    depends_on:
      - plan-02-stack-provider-runtime
    branch: complete-first-class-stacked-pr-and-git-spice-support/plan-03-stack-daemon-ui
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan spans shared wire contracts, monitor server projection,
          daemon stream snapshots, reducer state, and React rendering.
      reviewer:
        effort: high
        rationale: Review must verify API shapes are owned by @eforge-build/client and
          no ad hoc monitor-local stack wire interfaces are introduced.
  - id: plan-04-consumer-surfaces
    name: Reconcile CLI MCP Pi and Claude Consumer Surfaces
    depends_on:
      - plan-02-stack-provider-runtime
    branch: complete-first-class-stacked-pr-and-git-spice-support/plan-04-consumer-surfaces
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan touches both consumer integration packages and must keep Pi
          and Claude plugin capabilities in sync.
      reviewer:
        effort: high
        rationale: Review must verify plugin/Pi parity, compatibility aliases, and
          plugin version bump.
  - id: plan-05-docs-and-dogfood-config
    name: Update Documentation Generated References and Dogfood Config
    depends_on:
      - plan-03-stack-daemon-ui
      - plan-04-consumer-surfaces
    branch: complete-first-class-stacked-pr-and-git-spice-support/plan-05-docs-and-dogfood-config
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan updates multiple documentation surfaces and generated
          artifacts that must match final runtime contracts.
      reviewer:
        effort: high
        rationale: Review must verify stale aggregation semantics are removed and docs
          generation artifacts are synchronized.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: "This is broad and cross-cutting, but the PRD is cohesive and
    sequential: landing semantics, git-spice runtime integration, durable stack
    state, API/UI projection, integrations, docs, and tests can be planned by
    one planner as ordered dependent plans. That fits excursion rather than
    expedition. A plan review gate is included because the work touches engine
    behavior, daemon/client contracts, integrations, and documentation. The
    build pipeline runs documentation authoring alongside implementation, then
    syncs existing docs, adds tests, performs strict iterative review, and
    finally runs a test cycle to catch regressions after review fixes. Parallel
    code and API review perspectives focus on implementation correctness and
    public/wire-contract stability without over-expanding review scope."
