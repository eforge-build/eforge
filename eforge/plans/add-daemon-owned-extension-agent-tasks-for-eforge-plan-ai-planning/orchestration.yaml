name: add-daemon-owned-extension-agent-tasks-for-eforge-plan-ai-planning
description: Add daemon-owned, extension-requested single-shot agent tasks and
  wire an eforge-plan AI planning flow through Console workstations.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm maintainability:check
  - pnpm build:eforge-plan-workstation
  - pnpm test
plans:
  - id: plan-01-agent-task-contracts-engine-runner
    name: Shared Agent Task Contracts and Engine Runner
    depends_on: []
    branch: add-daemon-owned-extension-agent-tasks-for-eforge-plan-ai-planning/plan-01-agent-task-contracts-engine-runner
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Defines new public client contracts, persisted event variants, and a
          read-only structured agent runner used by later plans.
      reviewer:
        effort: high
        rationale: Shared API/event contracts and read-only harness enforcement need
          API-focused review.
  - id: plan-02-daemon-task-service-extension-api
    name: Daemon Task Service and Extension Action API
    depends_on:
      - plan-01-agent-task-contracts-engine-runner
    branch: add-daemon-owned-extension-agent-tasks-for-eforge-plan-ai-planning/plan-02-daemon-task-service-extension-api
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Implements local HTTP routes, background task lifecycle management,
          task persistence, cancellation, and action-context bridging across
          monitor, engine, and extension-sdk.
      reviewer:
        effort: high
        rationale: This plan touches local HTTP security, cancellation, and trusted
          extension boundaries.
  - id: plan-03-eforge-plan-ai-workstation-flow
    name: eforge-plan AI Planning Actions and Workstation Flow
    depends_on:
      - plan-02-daemon-task-service-extension-api
    branch: add-daemon-owned-extension-agent-tasks-for-eforge-plan-ai-planning/plan-03-eforge-plan-ai-workstation-flow
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Wires new daemon task APIs into a trusted extension, adds explicit
          preview/apply behavior, and updates bundled workstation assets.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - - doc-sync
      - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - security
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a cross-package but cohesive feature with a shared foundation
    and one initial consumer, so excursion fits better than delegated expedition
    planning. Plan review is included because the contracts span client, daemon,
    engine, SDK, extension, UI, docs, and tests. Docs and tests are explicit
    acceptance criteria, so doc-author/doc-sync, test-write, and test-cycle are
    included. The loaded maintainability validation provider requires validate
    after implementation artifacts are produced and before review. Parallel api
    and security review is warranted because the work changes public
    daemon/client contracts, extension boundaries, local HTTP handling,
    sandboxed workstation flows, provider access boundaries, cancellation, and
    read-only tool enforcement.
