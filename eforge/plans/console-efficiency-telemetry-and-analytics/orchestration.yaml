name: console-efficiency-telemetry-and-analytics
description: Console efficiency telemetry and analytics across build detail,
  active Now dashboard summaries, and historical model/profile rollups.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
  - pnpm maintainability:check
plans:
  - id: plan-01-efficiency-analytics-foundation
    name: Efficiency Metrics Contracts and Historical Aggregation
    depends_on: []
    branch: console-efficiency-telemetry-and-analytics/plan-01-efficiency-analytics-foundation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan spans shared client formulas, daemon route contracts, and
          historical aggregation with partial-data semantics across
          model/profile dimensions.
      reviewer:
        effort: high
        rationale: API and daemon aggregation changes need careful review of
          denominators, attribution, and route ownership.
  - id: plan-02-live-efficiency-surfaces
    name: Live Build Detail and Active Now Efficiency Surfaces
    depends_on:
      - plan-01-efficiency-analytics-foundation
    branch: console-efficiency-telemetry-and-analytics/plan-02-live-efficiency-surfaces
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-03-historical-analytics-ui-docs
    name: Historical Efficiency Analytics UI and Documentation
    depends_on:
      - plan-02-live-efficiency-surfaces
    branch: console-efficiency-telemetry-and-analytics/plan-03-historical-analytics-ui-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a substantial multi-package feature spanning console
    selectors/UI, client-owned daemon contracts, monitor historical aggregation,
    tests, and docs, but it is still plan-able as an excursion with shared
    foundations and ordered vertical work rather than requiring delegated
    expedition module planning. The compile plan includes a planning review gate
    because metric definitions, missing-data behavior, and route discipline are
    important. The build runs implementation with documentation authoring in
    parallel, syncs existing docs, adds tests, runs the registered
    maintainability validation gate before review, then performs iterative
    review and final test validation. Review focuses on code correctness and
    API/wire-contract discipline without adding unrelated security review.
