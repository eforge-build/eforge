name: source-first-backlog-implementation-audit
description: Implement a source-first backlog curation audit path for
  eforge-plan, including bounded per-item source audits, source-authoritative
  closure validation, action concurrency inputs, preview metadata, workstation
  evidence rendering, and user-facing guidance.
base_branch: main
mode: excursion
validate:
  - pnpm --filter @eforge-build/eforge-plan type-check
  - pnpm --filter @eforge-build/eforge-plan-workstation type-check
  - pnpm maintainability:check
  - pnpm vitest run
    eforge/extensions/eforge-plan/__tests__/backlog-curation-source-first-audit.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-source.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-actions.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-apply.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-prompt-contract.test.ts
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/backlog-curation-view-model.test.ts
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/backlog-curation-full-audit-panel.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/backlog-curation-preview.test.tsx
    eforge/extensions/eforge-plan/workstation-src/plans/src/views/backlog/use-planning-task-workflows.test.tsx
  - pnpm type-check
plans:
  - id: plan-01-source-first-audit-core
    name: Source-First Audit Core and Validation
    depends_on: []
    branch: source-first-backlog-implementation-audit/plan-01-source-first-audit-core
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan changes curation trust semantics, source assembly,
          concurrency control, and server-side apply validation across several
          extension files.
      reviewer:
        effort: high
        rationale: Review must verify that historical evidence cannot authorize
          source-first closure and that redaction/exclusion behavior remains
          intact.
      tester:
        effort: high
        rationale: Tests must cover worker-pool bounds, source fingerprints, closure
          validation, and prompt contract behavior.
  - id: plan-02-source-first-audit-ui-docs
    name: Source-First Audit Workstation and Docs
    depends_on:
      - plan-01-source-first-audit-core
    branch: source-first-backlog-implementation-audit/plan-02-source-first-audit-ui-docs
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: This plan updates workstation view models, fixtures, tests, and
          user-facing documentation after the core source-first metadata
          contract exists.
      reviewer:
        effort: medium
        rationale: Review must verify UI labels do not imply historical evidence can
          close source-first items.
      tester:
        effort: medium
        rationale: UI/view-model tests must cover evidence rendering and action input
          propagation.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a substantial multi-file feature across eforge-plan curation
    logic, schemas/actions, source assembly, workstation UI, prompt text, and
    tests, but a single planner can enumerate the work and dependencies, so
    excursion fits better than expedition. Plan review is included because the
    acceptance criteria are detailed and cross-cutting. Build includes
    implementation plus documentation/help authoring, test generation, doc sync,
    the registered maintainability validation gate before review, iterative
    review, and final test cycling. Review is strict with code and security
    perspectives because the feature affects automatic backlog closure decisions
    and must preserve secret/path redaction before source excerpts reach
    auditors.
