name: generate-public-web-docs-and-audit-for-user-facing-gaps
description: Refresh generated public web docs artifacts and audit web/content
  user-facing docs against current implementation behavior, fixing stale or
  missing coverage.
base_branch: main
mode: excursion
validate:
  - pnpm docs:check
  - pnpm test -- web/__tests__/content.test.ts
plans:
  - id: plan-01-public-docs-audit-refresh
    name: Audit and Refresh Public Web Docs
    depends_on: []
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-01-public-docs-audit-refresh
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Docs-only work spans many public guide pages and generated artifacts;
          the builder must cross-check implementation behavior, host skill docs,
          generated reference, and navigation without over-expanding scope.
      reviewer:
        effort: high
        rationale: Review must verify user-facing accuracy, concise task-oriented
          wording, generated artifact handling, and internal link/navigation
          consistency.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - docs
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a documentation-heavy public user-facing audit across
    web/content plus generated web reference artifacts, but a single planner can
    enumerate the docs, generation steps, and gaps, so excursion is appropriate.
    A plan review gate helps keep the audit scoped and complete. The build runs
    documentation authoring alongside implementation, then syncs existing docs
    against the resulting changes, performs iterative docs/API-focused review,
    and runs the test/check cycle so pnpm docs:check or equivalent verification
    is exercised.
