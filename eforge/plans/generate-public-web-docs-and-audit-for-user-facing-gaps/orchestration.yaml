name: generate-public-web-docs-and-audit-for-user-facing-gaps
description: Generate and audit public web documentation artifacts for current
  eforge user-facing behavior
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- test/docs-gen-determinism.test.ts
    test/reference-content.test.ts web/__tests__/content.test.ts
  - pnpm docs:check
plans:
  - id: plan-01-public-web-docs-audit
    name: Audit Public Web Docs and Refresh Generated Artifacts
    depends_on: []
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-01-public-web-docs-audit
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Requires comparing public docs against user-facing implementation
          surfaces, updating generated reference tooling, and regenerating
          artifacts without hand-editing generated outputs.
      reviewer:
        effort: high
        rationale: Docs accuracy and generator changes need thorough review from both
          code and documentation perspectives.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - validate
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - docs
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a documentation-heavy audit across public web docs and
    generated reference artifacts, but a single planner can enumerate the
    affected user journeys and files, so excursion is appropriate. A plan-review
    cycle helps catch coverage gaps before build. doc-author runs alongside
    implementation for planned docs edits, doc-sync reconciles existing docs
    with source/reference changes, validate runs the registered guardrails, and
    test-cycle covers docs generation/check commands such as pnpm docs:check.
    Review focuses on docs accuracy and public API/reference consistency with
    standard strictness.
