name: generate-public-web-docs-and-audit-for-user-facing-gaps
description: Audit and refresh public web documentation against current eforge
  user-facing behavior, including generated reference artifacts.
base_branch: main
mode: excursion
validate:
  - pnpm docs:check
  - pnpm test
plans:
  - id: plan-01-public-docs-audit-refresh
    name: Audit and Refresh Public Web Docs
    depends_on: []
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-01-public-docs-audit-refresh
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Docs-heavy audit requires cross-checking public guides, generated
          references, and current integration/CLI skill surfaces before editing.
      reviewer:
        effort: high
        rationale: Review needs to catch stale or misleading user-facing documentation
          and generated-artifact drift.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - docs
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a broad documentation audit and refresh across the public web
    docs, generated reference artifacts, and user-facing CLI/API coverage, but
    it remains within one coherent subsystem and can be planned by a single
    planner, so excursion is appropriate. A plan review gate helps catch missing
    user journeys before build. The build runs implementation and documentation
    authoring in parallel, then syncs existing docs against the resulting
    changes, performs iterative docs/API-focused review, and finally runs
    validation/testing such as docs generation/check workflows. Review focuses
    on docs accuracy and public API/reference consistency with standard
    strictness.
