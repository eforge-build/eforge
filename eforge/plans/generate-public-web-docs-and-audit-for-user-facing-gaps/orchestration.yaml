name: generate-public-web-docs-and-audit-for-user-facing-gaps
description: Audit public docs under web/content/, fill user-facing
  documentation gaps, regenerate web docs artifacts, and verify docs drift/link
  checks.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
plans:
  - id: plan-01-public-docs-audit-and-fill-gaps
    name: Audit public docs and fill user-facing gaps
    depends_on: []
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-01-public-docs-audit-and-fill-gaps
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: The work is documentation-first, but it requires cross-checking
          current behavior across CLI commands, skills, profiles, playbooks,
          extensions, daemon events, recovery, and docs generation before
          editing the public guide pages.
      reviewer:
        effort: high
        rationale: Public docs require careful review for implementation accuracy,
          generated artifact drift, navigation consistency, and concise
          task-oriented coverage.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - docs
      - api
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a documentation-heavy public docs audit across web/content
    plus generated artifacts, but it is centered on one user-facing docs surface
    and does not require delegated module planning, so excursion is appropriate.
    A plan review helps catch coverage gaps before build. doc-author runs
    alongside implementation because the task is primarily authoring and
    updating docs; doc-sync then reconciles existing docs with the
    post-implementation diff. review-cycle provides iterative quality control
    for accuracy, navigation, terminology, and user-facing completeness.
    test-cycle is included to run docs generation/check workflows such as pnpm
    docs:check and catch artifact drift.
