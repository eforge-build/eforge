name: generate-public-web-docs-and-audit-for-user-facing-gaps
description: Audit public web documentation against current eforge behavior,
  update editable guide sources, regenerate generated web artifacts, and verify
  docs drift/link checks.
base_branch: main
mode: excursion
validate:
  - pnpm --filter @eforge-build/web type-check
  - pnpm docs:check
  - pnpm test
plans:
  - id: plan-01-public-docs-audit
    name: Audit and Update Public Guide Sources
    depends_on: []
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-01-public-docs-audit
    build:
      - implement
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - code
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Broad documentation audit across all public guide journeys requires
          careful comparison with current CLI, host integration, config,
          extension, queue, playbook, profile, and recovery implementation
          surfaces.
      reviewer:
        effort: high
        rationale: Docs review needs to catch stale claims, missing user journeys,
          broken navigation, and accidental internal-only details across many
          guide pages.
  - id: plan-02-public-docs-regeneration
    name: Regenerate and Validate Public Web Artifacts
    depends_on:
      - plan-01-public-docs-audit
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-02-public-docs-regeneration
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
      maxRounds: 1
      evaluatorStrictness: standard
    agents:
      builder:
        effort: medium
        rationale: Generated docs refresh is mechanical, but the builder must
          distinguish generated outputs from hand-authored sources and capture
          docs:check failures with actionable diagnostics.
      reviewer:
        effort: medium
        rationale: Review focuses on generated-artifact drift, link health, and absence
          of accidental hand edits to generated reference files.
      tester:
        effort: high
        rationale: Docs generation and drift checks depend on workspace builds and link
          validation; failures need careful triage between real drift and
          missing local dependencies.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - validate
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - docs
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a documentation-heavy audit spanning multiple public-doc user
    journeys and generated artifacts, but a single planner can enumerate the
    work, so excursion is appropriate. A plan review gate helps catch coverage
    gaps before build. The build pipeline authors and syncs docs, runs the
    registered validation provider, executes verification such as docs
    generation/checks, then uses an iterative docs-focused review cycle. The
    verify perspective is included because the PRD explicitly requires generated
    artifacts and docs:check validation.
