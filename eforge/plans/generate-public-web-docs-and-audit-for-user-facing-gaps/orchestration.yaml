name: generate-public-web-docs-and-audit-for-user-facing-gaps
description: Refresh generated public web documentation artifacts and audit
  user-facing web docs against the current eforge implementation.
base_branch: main
mode: excursion
validate:
  - pnpm docs:check
  - pnpm --filter @eforge-build/web type-check
  - pnpm test
plans:
  - id: plan-01-public-docs-audit-and-generate
    name: Audit Public Web Docs and Refresh Generated Artifacts
    depends_on: []
    branch: generate-public-web-docs-and-audit-for-user-facing-gaps/plan-01-public-docs-audit-and-generate
    build:
      - implement
      - validate
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - docs
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The work is documentation-only but requires cross-checking multiple
          user-facing surfaces against implementation sources and generated
          artifacts.
      reviewer:
        effort: high
        rationale: Review must verify docs accuracy against implementation behavior,
          generated artifact discipline, and user-journey coverage.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - docs
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a broad documentation audit and regeneration task spanning
    public docs, generated reference artifacts, navigation, terminology, and
    user journeys, but it can be planned coherently by a single planner, so
    excursion is appropriate. A plan-review cycle helps catch coverage gaps
    before build. Implementation and doc-authoring can proceed in parallel for
    planned docs edits, followed by doc-sync to align existing docs with
    generated artifacts and current behavior. A docs/API-focused review-cycle is
    appropriate because the main risk is stale or misleading user-facing
    documentation, especially around CLI/API/reference coverage.
