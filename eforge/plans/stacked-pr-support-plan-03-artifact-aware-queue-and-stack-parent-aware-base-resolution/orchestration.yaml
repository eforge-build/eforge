name: stacked-pr-support-plan-03-artifact-aware-queue-and-stack-parent-aware-base-resolution
description: "Stacked PR Plan 03: artifact-aware queue dependency readiness,
  stack-parent inference, stack-aware base resolution, and artifact recording."
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm build
plans:
  - id: plan-01-stack-foundation-sync
    name: Synchronize Existing Stack Foundation and Provider Baseline
    depends_on: []
    branch: stacked-pr-support-plan-03-artifact-aware-queue-and-stack-parent-aware-base-resolution/plan-01-stack-foundation-sync
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
  - id: plan-02-artifact-aware-queue-base-resolution
    name: Artifact-Aware Queue and Stack-Aware Base Resolution
    depends_on:
      - plan-01-stack-foundation-sync
    branch: stacked-pr-support-plan-03-artifact-aware-queue-and-stack-parent-aware-base-resolution/plan-02-artifact-aware-queue-base-resolution
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Multi-file engine change spanning queue scheduling, PRD frontmatter
          persistence, compile/build base selection, orchestrator artifact
          recording, and tests.
      reviewer:
        effort: high
        rationale: The change alters queue dependency semantics and build base refs, so
          review needs thorough code and test inspection.
      tester:
        effort: high
        rationale: Regression coverage must prove intentionally changed dependency
          semantics and stack base resolution.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - test
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a multi-file engine feature touching scheduler semantics,
    stack-aware base resolution, durable artifact state, and tests, but it is
    still cohesive enough for a single planner rather than an expedition. A
    plan-review cycle is warranted because the PRD references prior failed
    partial work and intentionally changes dependency semantics. The build
    pipeline implements first, writes the required regression tests, reviews
    code and test quality, then runs the test cycle after review fixes so final
    changes are validated. Documentation stages are omitted because docs and
    consumer surface updates are explicitly out of scope.
