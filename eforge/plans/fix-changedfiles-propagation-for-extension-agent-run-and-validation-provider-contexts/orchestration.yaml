name: fix-changedfiles-propagation-for-extension-agent-run-and-validation-provider-contexts
description: Thread changedFiles metadata through extension agent-run hook
  contexts and validation-provider build-stage wiring.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- extension-agent-context-runtime validation-provider-runtime
    validation-provider-build-stage review-context-filtering
plans:
  - id: plan-01-changedfiles-extension-contexts
    name: Propagate changedFiles into extension contexts
    depends_on: []
    branch: fix-changedfiles-propagation-for-extension-agent-run-and-validation-provider-contexts/plan-01-changedfiles-extension-contexts
    build:
      - implement
      - test-cycle
      - validate
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
        - api
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - doc-sync
    - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: This is a focused multi-file contract-wiring bugfix across engine
    harness types, extension runtime context, reviewer call sites,
    validation-stage wiring, and tests, so excursion is appropriate. A plan
    review helps catch missed propagation paths without expedition overhead. The
    build runs implementation, syncs docs because the public extension API
    contract is affected, adds/updates focused tests, runs test validation, then
    runs the registered validation provider gate before review. Parallel
    code/api review covers implementation correctness and SDK/runtime contract
    compatibility with standard strictness.
