name: improve-session-plan-review-and-rendering-ux
description: Improve eforge-plan session-plan review by moving annotations and
  revision activity into a shared rail, persisting and rendering executive
  summaries with progressive disclosure, and adding safe Mermaid rendering for
  plan Markdown.
base_branch: main
mode: excursion
validate:
  - pnpm --filter @eforge-build/eforge-plan type-check
  - pnpm --filter @eforge-build/eforge-plan-workstation type-check
  - pnpm --filter @eforge-build/eforge-plan-workstation test
  - pnpm exec vitest run
    eforge/extensions/eforge-plan/__tests__/planner-orchestration.test.ts
    test/session-plan.test.ts test/normalize-build-source.test.ts
    test/prompts.test.ts
  - pnpm --filter @eforge-build/eforge-plan-workstation build
  - pnpm maintainability:check
plans:
  - id: plan-01-review-rail-annotations
    name: Review Rail Annotation and Revision Controls
    depends_on: []
    branch: improve-session-plan-review-and-rendering-ux/plan-01-review-rail-annotations
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: "Cross-component React state refactor: the revision-session hook,
          selected plan detail, pending annotation target, main card, and rail
          must share one state owner while preserving existing action payloads."
      reviewer:
        effort: high
        rationale: Payload preservation and UI state placement are central acceptance
          points for this refactor.
  - id: plan-02-executive-summary-disclosure
    name: Executive Summary Persistence and Progressive Disclosure
    depends_on:
      - plan-01-review-rail-annotations
    branch: improve-session-plan-review-and-rendering-ux/plan-02-executive-summary-disclosure
    build:
      - implement
      - - test-cycle
        - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: This plan coordinates runtime draft application, prompt guidance,
          build-source behavior, and the plan-detail rendering order while
          keeping large files within maintainability ceilings.
  - id: plan-03-safe-mermaid-markdown
    name: Safe Mermaid Rendering for eforge-plan Markdown
    depends_on:
      - plan-02-executive-summary-disclosure
    branch: improve-session-plan-review-and-rendering-ux/plan-03-safe-mermaid-markdown
    build:
      - implement
      - - test-cycle
        - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - security
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Mermaid rendering touches dependency metadata, async React rendering,
          SVG sanitization, and Markdown XSS boundaries.
      reviewer:
        effort: high
        rationale: Security-sensitive Markdown/SVG rendering needs careful review of
          sanitizer configuration and fallback behavior.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - doc-sync
    - test-write
    - test-cycle
    - validate
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: This is a substantial multi-file feature spanning the eforge-plan
    workstation UI, revision-session state placement, planner/runtime
    persistence, Markdown rendering, docs/guidance, and tests, but it can be
    planned coherently by one planner as ordered excursion work rather than
    delegated expedition modules. Plan review is included to catch scope and
    dependency issues before implementation. The build pipeline includes docs,
    test generation, test execution, the registered validation gate, and an
    iterative review cycle. Security review is warranted because
    Mermaid/Markdown sanitization and a possible dependency addition affect
    user-rendered content safety.
