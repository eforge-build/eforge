name: add-extension-dependency-contracts-and-remove-eforge-plan-surfaces
description: Add first-class native extension dependency and capability
  contracts, adopt them for eforge-plan/playbook planning entry, and delete
  hardcoded /eforge:plan host surfaces.
base_branch: eforge/compact-eforge-plan-workstation-loading-and-oversized-output-safeguards
mode: excursion
validate:
  - pnpm type-check
  - pnpm test
  - pnpm docs:check
  - pnpm maintainability:check
plans:
  - id: plan-01-extension-dependency-contracts
    name: Extension Dependency and Capability Contracts
    depends_on: []
    branch: add-extension-dependency-contracts-and-remove-eforge-plan-surfaces/plan-01-extension-dependency-contracts
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: xhigh
        rationale: Kernel-level API addition touching manifest parsing, loader ordering,
          registry projection, action dispatch, and public SDK/client types.
      reviewer:
        effort: high
        rationale: Review must check loader ordering, trust-boundary diagnostics, and
          public API compatibility.
      tester:
        effort: high
        rationale: Dependency graph, trust, optional availability, and action-context
          lookup require targeted regression tests.
  - id: plan-02-first-party-planning-contract-adoption
    name: First-Party Planning Contract Adoption
    depends_on:
      - plan-01-extension-dependency-contracts
    branch: add-extension-dependency-contracts-and-remove-eforge-plan-surfaces/plan-02-first-party-planning-contract-adoption
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan wires the new platform contract into first-party
          eforge-plan and playbook surfaces without moving product workflow
          ownership into the kernel.
      reviewer:
        effort: high
        rationale: Review must verify no host-specific planning shim is introduced while
          playbook planning-mode behavior gates on eforge-plan capability state.
      tester:
        effort: high
        rationale: Tests must cover first-party capability declarations, planning entry
          contribution routing, and playbook behavior with and without
          eforge-plan.
  - id: plan-03-remove-eforge-plan-host-surfaces
    name: Remove Hardcoded /eforge:plan Host Surfaces
    depends_on:
      - plan-02-first-party-planning-contract-adoption
    branch: add-extension-dependency-contracts-and-remove-eforge-plan-surfaces/plan-03-remove-eforge-plan-host-surfaces
    build:
      - implement
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This is a broad deletion and documentation cleanup across Pi, Claude
          plugin, skill parity, generated references, and host-surface tests.
      reviewer:
        effort: high
        rationale: Review must verify deletion rather than compatibility shims and
          confirm Pi/Claude consumer-facing parity.
      tester:
        effort: high
        rationale: Many existing tests reference the old plan skill/command and need
          replacement with grep gates and generic planning-entry assertions.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - validate
    - - doc-sync
      - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - api
      - security
    maxRounds: 3
    evaluatorStrictness: strict
  rationale: "This is a large but sequential foundation-and-adoption effort, so
    excursion fits better than expedition: one planner can decompose the
    extension contract foundation, first-party adoption, host-surface deletion,
    docs, and tests. Plan review is included due to cross-package risk. The
    build runs implementation with documentation authoring, then the registered
    validation gate, documentation sync, test generation, iterative test
    execution, and a strict review cycle. API and security perspectives are
    selected because the work changes extension manifests/runtime APIs and
    touches trust, provenance, and optional cross-extension invocation safety."
