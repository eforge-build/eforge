name: fix-reviewer-isolation-across-pi-and-claude-sdk-harnesses
description: Fix reviewer isolation across Pi and Claude SDK harnesses by adding
  an explicit read-only tool preset, switching all build-reviewer dispatch paths
  to it, normalizing mutation denylists across harness tool names, adding
  review-stage worktree mutation detection/restoration, and updating
  tests/prompts.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm test -- agent-wiring reviewer
  - pnpm test
plans:
  - id: plan-01-reviewer-isolation
    name: Reviewer Isolation and Read-Only Harness Tools
    depends_on: []
    branch: fix-reviewer-isolation-across-pi-and-claude-sdk-harnesses/plan-01-reviewer-isolation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: The change crosses shared harness contracts, Pi and Claude SDK tool
          composition, reviewer/evaluator call sites, prompt contracts, and
          review-stage worktree invariants.
      reviewer:
        effort: high
        rationale: Tool isolation is a safety boundary involving subprocess and mutation
          permissions across both harnesses.
      tester:
        effort: high
        rationale: Regression coverage must prove tool composition and worktree
          restoration across multiple reviewer paths.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - doc-sync
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - security
    maxRounds: 2
    evaluatorStrictness: strict
  rationale: This is a focused but cross-cutting bug fix touching harness
    contracts, reviewer/evaluator call sites, prompt/docs, and regression tests,
    so excursion is appropriate. A plan review gate helps catch missed
    cross-harness casing/read-only semantics without requiring expedition-level
    module planning. Build includes implementation, test authoring, iterative
    test validation, doc synchronization for prompt/API/role updates, and a
    strict review cycle. Parallel code and security perspectives are justified
    because the change concerns tool isolation, mutation prevention, and
    subprocess/tool availability boundaries.
