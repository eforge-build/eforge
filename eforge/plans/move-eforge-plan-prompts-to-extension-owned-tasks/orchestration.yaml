name: move-eforge-plan-prompts-to-extension-owned-tasks
description: Move eforge-plan prompt ownership from engine assets/runners to
  extension-owned prompt-backed agent task contributions while preserving
  planning, revision, recommendation refresh, and backlog-curation behavior.
base_branch: eforge/sqlite-backed-eforge-plan-store
mode: excursion
validate:
  - pnpm type-check
  - pnpm vitest run test/resolved-agent-task-runner.test.ts
    packages/client/src/__tests__/extension-agent-task-contributions.test.ts
    packages/monitor/src/__tests__/extension-agent-task-contribution-resolution.test.ts
    packages/monitor/src/__tests__/routes-extension-agent-task-backlog-curation-map-reduce.test.ts
    eforge/extensions/eforge-plan/__tests__/prompt-assets.test.ts
    eforge/extensions/eforge-plan/__tests__/registration.test.ts
    eforge/extensions/eforge-plan/__tests__/backlog-curation-prompt-contract.test.ts
  - pnpm test
  - pnpm maintainability:check
plans:
  - id: plan-01-agent-task-contribution-contract
    name: Agent Task Contribution Contract
    depends_on: []
    branch: move-eforge-plan-prompts-to-extension-owned-tasks/plan-01-agent-task-contribution-contract
    build:
      - implement
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Adds a new extension contribution surface and client wire shape used
          by later plans.
      reviewer:
        effort: high
        rationale: Public SDK/client contracts and registry projection changes need
          API-focused review.
  - id: plan-02-resolved-planning-tasks
    name: Resolved Planning Task Execution
    depends_on:
      - plan-01-agent-task-contribution-contract
    branch: move-eforge-plan-prompts-to-extension-owned-tasks/plan-02-resolved-planning-tasks
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - security
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Coordinates generic engine execution, daemon owner-scoped resolution,
          and several eforge-plan planning flows.
      reviewer:
        effort: high
        rationale: Touches extension owner validation and prompt asset path resolution,
          so review needs extra depth.
  - id: plan-03-backlog-curation-prompts-and-engine-removal
    name: Backlog Curation Contributions and Engine Removal
    depends_on:
      - plan-02-resolved-planning-tasks
    branch: move-eforge-plan-prompts-to-extension-owned-tasks/plan-03-backlog-curation-prompts-and-engine-removal
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Completes the boundary refactor by moving curation map/reduce prompt
          assets, validation, and repair behavior out of engine code.
      reviewer:
        effort: high
        rationale: Final removal must prove no hidden engine fallbacks remain while
          preserving curation behavior.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - test-write
    - doc-sync
    - validate
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a substantial cross-package refactor involving engine,
    daemon, client contracts, extension SDK, eforge-plan contributions,
    packaging, and tests, but it is still a coordinated foundation/API migration
    that a single planner can decompose, so excursion fits better than
    expedition. A plan review gate is included because the boundary and
    migration details are risk-sensitive. The build includes implementation plus
    documentation authoring/sync for the source audit and public contract
    changes, targeted test generation, the required validation provider gate
    after implementation, iterative review, and test execution. Parallel
    code/API review is used to focus on kernel-extension separation, typed
    contracts, and preserving behavior without broad unnecessary perspectives.
