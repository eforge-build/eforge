name: move-playbooks-behind-the-bundled-workflow-adapter
description: Move playbook domain operations behind a bundled workflow-shaped
  adapter in @eforge-build/input while preserving daemon/client compatibility
  routes and engine input-agnostic behavior.
base_branch: main
mode: excursion
validate:
  - pnpm maintainability:check
  - pnpm type-check
  - pnpm test -- test/playbook-workflow.test.ts
    packages/monitor/src/__tests__/routes-extension-content-source-contract.test.ts
    packages/monitor/src/__tests__/routes-playbooks.test.ts
    test/daemon-session-plan-routes-playbook.test.ts
plans:
  - id: plan-01-playbook-workflow-adapter
    name: Add Bundled Playbook Workflow Adapter
    depends_on: []
    branch: move-playbooks-behind-the-bundled-workflow-adapter/plan-01-playbook-workflow-adapter
    build:
      - implement
      - validate
      - test-cycle
      - doc-sync
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This is a cross-package ownership-boundary refactor that must
          preserve existing daemon route behavior while introducing a new public
          input adapter surface.
      reviewer:
        effort: high
        rationale: Review needs to check boundary discipline, route contract
          preservation, and documentation consistency.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - validate
    - - test-write
      - doc-sync
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a cohesive cross-package boundary refactor, not an
    expedition: one planner can enumerate the input adapter, monitor shim,
    tests, and documentation updates. Plan review is included because route/API
    compatibility and ownership boundaries matter. Build runs implementation
    alongside doc authoring, then the registered maintainability validation
    gate, followed by test authoring/doc sync, targeted test execution, and
    iterative review. Code and API perspectives focus review on implementation
    quality and preserving public daemon/client contracts."
