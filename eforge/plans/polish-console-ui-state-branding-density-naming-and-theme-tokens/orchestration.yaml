name: polish-console-ui-state-branding-density-naming-and-theme-tokens
description: Polish the Console SPA state surfaces, branding assets, selector
  naming/dedup, Runs grouping and filters, System model disclosure, Activity
  disclosure, typography, and theme-token discipline while preserving
  daemon/client boundaries.
base_branch: main
mode: excursion
validate:
  - pnpm --filter @eforge-build/console-ui type-check
  - pnpm --filter @eforge-build/console-ui test
  - pnpm --filter @eforge-build/console-ui build
  - pnpm --filter @eforge-build/monitor type-check
plans:
  - id: plan-01-branding-fonts-label-foundation
    name: Branding, Fonts, Tokens, and Label Foundation
    depends_on: []
    branch: polish-console-ui-state-branding-density-naming-and-theme-tokens/plan-01-branding-fonts-label-foundation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - verify
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-02-selector-dedup-and-run-grouping
    name: Selector Deduplication, Display Labels, and Run Grouping
    depends_on:
      - plan-01-branding-fonts-label-foundation
    branch: polish-console-ui-state-branding-density-naming-and-theme-tokens/plan-02-selector-dedup-and-run-grouping
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Selector changes affect Now, Queue, Runs, and Activity view models
          and require deterministic merge and grouping rules.
  - id: plan-03-shell-now-queue-system-status
    name: Shell, Now, Queue, and System Status Consolidation
    depends_on:
      - plan-02-selector-dedup-and-run-grouping
    branch: polish-console-ui-state-branding-density-naming-and-theme-tokens/plan-03-shell-now-queue-system-status
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
  - id: plan-04-runs-filters-day-groups-detail-density
    name: Runs Filters, Day Groups, and Detail Density
    depends_on:
      - plan-03-shell-now-queue-system-status
    branch: polish-console-ui-state-branding-density-naming-and-theme-tokens/plan-04-runs-filters-day-groups-detail-density
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
      maxRounds: 2
      evaluatorStrictness: standard
    agents:
      builder:
        effort: high
        rationale: Runs changes combine selector state, URL/detail selection, responsive
          layout, grouping, and component tests.
  - id: plan-05-system-activity-progressive-disclosure-and-guards
    name: System and Activity Progressive Disclosure with Theme Guards
    depends_on:
      - plan-04-runs-filters-day-groups-detail-density
    branch: polish-console-ui-state-branding-density-naming-and-theme-tokens/plan-05-system-activity-progressive-disclosure-and-guards
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - test
        - verify
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: This plan finishes remaining dense views, adds a shadcn Sheet
          primitive, and introduces source-grep guard tests that require all
          earlier UI cleanups to hold.
      reviewer:
        effort: high
        rationale: The final guard plan must verify no typography or token violations
          remain across the Console source tree.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - test-write
    - test-cycle
    - review-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - verify
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is cross-cutting Console UI polish across selectors, shell,
    views, assets, theme tokens, fonts, and tests, but it is cohesive and
    already has a clear sequential plan foundation, so excursion is appropriate
    rather than expedition. A planner plus plan-review-cycle gives enough
    compile-time quality control. The build pipeline implements first, then
    writes the extensive required selector/component/guard tests, runs iterative
    testing, and finishes with an iterative review cycle. The review uses code
    plus verify perspectives because the PRD changes UI logic, package
    dependencies, build assets, and test/discipline guards; security is not
    included because no auth, secrets, sandboxing, or trust-boundary changes are
    in scope.
