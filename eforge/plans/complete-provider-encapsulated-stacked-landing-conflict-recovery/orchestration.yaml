name: complete-provider-encapsulated-stacked-landing-conflict-recovery
description: Complete provider-encapsulated automatic recovery for recoverable
  stacked PR landing restack conflicts, including rebasing the prior foundation
  onto current main, landing integration, tests, and documentation.
base_branch: main
mode: excursion
validate:
  - pnpm type-check
  - pnpm exec vitest run test/git-spice-provider.test.ts
    test/landing-conflict-recovery.test.ts test/stack-runtime-landing.test.ts
    test/merge-conflict-resolver.test.ts test/stack-events.test.ts
    packages/client/src/__tests__/events-wire-parity.test.ts
    packages/client/src/__tests__/events-schemas.test.ts
  - pnpm docs:check
  - pnpm maintainability:check
plans:
  - id: plan-01-rebase-provider-recovery-foundation
    name: Rebase Provider Recovery Foundation
    depends_on: []
    branch: complete-provider-encapsulated-stacked-landing-conflict-recovery/plan-01-rebase-provider-recovery-foundation
    build:
      - implement
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - api
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Ports the prior provider-neutral recovery foundation onto the current
          main branch, adds provider APIs, subprocess-backed git-spice methods,
          new event variants, and focused tests while avoiding stale branch
          changes.
      reviewer:
        effort: high
        rationale: Provider API and event-schema changes need careful review for
          provider encapsulation, wire compatibility, and fixed-argv subprocess
          handling.
  - id: plan-02-stack-landing-integration-docs
    name: Stack Landing Integration and Documentation
    depends_on:
      - plan-01-rebase-provider-recovery-foundation
    branch: complete-provider-encapsulated-stacked-landing-conflict-recovery/plan-02-stack-landing-integration-docs
    build:
      - - implement
        - doc-author
      - doc-sync
      - test-cycle
      - review-cycle
    review:
      strategy: parallel
      perspectives:
        - code
        - docs
      maxRounds: 2
      evaluatorStrictness: strict
    agents:
      builder:
        effort: high
        rationale: Integrates the provider recovery helper into stacked landing while
          preserving non-recoverable failure semantics, state persistence,
          validation behavior, and documentation updates.
      reviewer:
        effort: high
        rationale: Landing state transitions, provider encapsulation, and docs/reference
          generation need close review to avoid regressions in stacked and
          non-stacked PR landing.
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - - implement
      - doc-author
    - validate
    - test-write
    - doc-sync
    - review-cycle
    - test-cycle
  defaultReview:
    strategy: parallel
    perspectives:
      - code
      - api
    maxRounds: 3
    evaluatorStrictness: standard
  rationale: This is a multi-file feature completion and bug-recovery task
    spanning provider APIs, git-spice adapter behavior, landing orchestration,
    lifecycle events, tests, and docs, but it is still a cohesive sequential
    effort rather than independent module planning, so excursion is appropriate.
    A planner plus plan-review cycle should catch dependency and
    acceptance-criteria gaps before build. The build runs implementation
    alongside initial doc authoring, then the registered maintainability
    validation gate, test authoring, documentation sync, iterative review, and
    final test cycling for the specified vitest/type-check acceptance criteria.
    Parallel code and API review focuses on implementation correctness plus
    provider/event contract encapsulation without adding unrelated security
    review overhead.
